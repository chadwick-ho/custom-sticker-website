<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Confirm the route before comparing price</text><rect x="35" y="190" width="630" height="155" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="233" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Packer identifies the process</text><text x="58" y="276" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Peel from liner or apply glue?</text><text x="58" y="318" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Continuous reel or pre-cut supply?</text><path d="M350 348 L350 381" stroke="#ad7542" stroke-width="4"/><rect x="35" y="390" width="630" height="155" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="433" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Converter identifies the stock</text><text x="58" y="476" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Construction + finishing + references</text><text x="58" y="518" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">List exceptions to the machine brief.</text><path d="M350 548 L350 581" stroke="#ad7542" stroke-width="4"/><rect x="35" y="590" width="630" height="155" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="633" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Owners agree the evidence</text><text x="58" y="676" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Representative stock and actual line</text><text x="58" y="718" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Record what the trial must establish.</text><path d="M350 748 L350 781" stroke="#ad7542" stroke-width="4"/><rect x="35" y="790" width="630" height="155" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="833" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Buyer compares accepted scope</text><text x="58" y="876" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Same artwork, quantities and destination</text><text x="58" y="918" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Do not infer route from “paper roll”.</text><text x="35" y="1018" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Material names alone do not identify the route.</text></svg>