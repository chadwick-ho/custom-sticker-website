<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f6fb2"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#f7f9fc"/>
  <text x="380" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#22364f">Wrap label panel plan (flat layout)</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#5a6b7d">zones planned at real size &#x2014; approved copy only, no shrinking to fit</text>

  <!-- bleed -->
  <rect x="60" y="92" width="640" height="220" fill="none" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- label -->
  <rect x="70" y="102" width="620" height="200" fill="#fbf6ea" stroke="#22364f" stroke-width="1.8"/>

  <!-- LEFT panel: directions / ingredients -->
  <line x1="230" y1="102" x2="230" y2="302" stroke="#22364f" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="150" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a6b7d">SIDE PANEL</text>
  <rect x="88" y="140" width="124" height="7" fill="#9fb3c8"/>
  <rect x="88" y="154" width="124" height="7" fill="#9fb3c8"/>
  <rect x="88" y="168" width="110" height="7" fill="#c3d0de"/>
  <rect x="88" y="182" width="124" height="7" fill="#c3d0de"/>
  <rect x="88" y="196" width="96" height="7" fill="#c3d0de"/>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#5a6b7d">directions &#xB7; ingredients</text>
  <text x="150" y="254" text-anchor="middle" font-size="10" fill="#5a6b7d">warnings &#xB7; company details</text>
  <text x="150" y="282" text-anchor="middle" font-size="10" fill="#2f6fb2">(wraps to back-left)</text>

  <!-- CENTER panel: front / brand -->
  <line x1="420" y1="102" x2="420" y2="302" stroke="#22364f" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="325" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#22364f">FRONT PANEL</text>
  <rect x="285" y="140" width="80" height="14" fill="#2f6fb2"/>
  <rect x="263" y="168" width="124" height="9" fill="#22364f"/>
  <rect x="281" y="186" width="88" height="6" fill="#9fb3c8"/>
  <rect x="299" y="208" width="52" height="52" rx="6" fill="none" stroke="#c97a3f" stroke-width="1.6"/>
  <circle cx="325" cy="234" r="14" fill="#e5b26e" stroke="#b9833f" stroke-width="1.4"/>
  <text x="325" y="238" text-anchor="middle" font-size="9" fill="#7a4f1d">icon</text>
  <text x="325" y="282" text-anchor="middle" font-size="10" fill="#5a6b7d">brand &#xB7; product name &#xB7; net qty</text>

  <!-- RIGHT panel: supplement facts + barcode -->
  <line x1="620" y1="102" x2="620" y2="302" stroke="#22364f" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="520" y="124" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a6b7d">INFORMATION PANEL</text>
  <rect x="438" y="136" width="120" height="96" fill="#ffffff" stroke="#22364f" stroke-width="1.4"/>
  <rect x="444" y="142" width="108" height="10" fill="#22364f"/>
  <text x="450" y="150" font-size="7" fill="#ffffff">Supplement Facts</text>
  <g stroke="#9fb3c8" stroke-width="1">
    <line x1="444" y1="160" x2="552" y2="160"/>
    <line x1="444" y1="174" x2="552" y2="174"/>
    <line x1="444" y1="188" x2="552" y2="188"/>
    <line x1="444" y1="202" x2="552" y2="202"/>
    <line x1="444" y1="216" x2="552" y2="216"/>
  </g>
  <!-- barcode -->
  <g fill="#22364f">
    <rect x="576" y="140" width="3" height="36"/><rect x="581" y="140" width="2" height="36"/>
    <rect x="585" y="140" width="4" height="36"/><rect x="591" y="140" width="2" height="36"/>
    <rect x="595" y="140" width="3" height="36"/><rect x="600" y="140" width="1.5" height="36"/>
    <rect x="603" y="140" width="4" height="36"/><rect x="609" y="140" width="2" height="36"/>
  </g>
  <text x="593" y="188" text-anchor="middle" font-size="9" fill="#5a6b7d">barcode</text>
  <text x="520" y="254" text-anchor="middle" font-size="10" fill="#5a6b7d">facts box &#xB7; barcode zone</text>
  <text x="520" y="282" text-anchor="middle" font-size="10" fill="#2f6fb2">(wraps to back-right)</text>

  <!-- width dimension -->
  <line x1="70" y1="338" x2="690" y2="338" stroke="#2f6fb2" stroke-width="1.6" marker-start="url(#arr4)" marker-end="url(#arr4)"/>
  <text x="380" y="358" text-anchor="middle" font-size="12" fill="#2f6fb2">total wrap length = container circumference &#x2212; gap (or + overlap) &#x2014; split lines follow the bottle&#x2019;s visible faces</text>

  <text x="380" y="386" text-anchor="middle" font-size="12" fill="#8494a5">RP Labels &#x2014; panel plan: readable at real size, checked on the proof</text>
</svg>
