<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f6fb2"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#f7f9fc"/>

  <!-- ============ LEFT: vial with applied label ============ -->
  <text x="165" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#22364f">Applied on the vial</text>

  <!-- cap -->
  <rect x="125" y="56" width="80" height="26" rx="5" fill="#4a5d73"/>
  <rect x="125" y="60" width="80" height="4" fill="#3a4a5c" opacity="0.5"/>
  <rect x="125" y="70" width="80" height="4" fill="#3a4a5c" opacity="0.5"/>
  <!-- neck -->
  <rect x="133" y="82" width="64" height="16" fill="#e5b26e" stroke="#b9833f" stroke-width="1.5"/>
  <!-- body -->
  <path d="M110 100 h110 v185 a16 16 0 0 1 -16 16 h-78 a16 16 0 0 1 -16 -16 z" fill="#e5b26e" stroke="#b9833f" stroke-width="1.5"/>
  <ellipse cx="165" cy="100" rx="55" ry="9" fill="#f0cd92" stroke="#b9833f" stroke-width="1.5"/>
  <!-- applied label band -->
  <rect x="110" y="150" width="110" height="100" fill="#fbf6ea" stroke="#22364f" stroke-width="1.8"/>
  <rect x="120" y="162" width="60" height="9" fill="#2f6fb2"/>
  <rect x="120" y="180" width="90" height="6" fill="#9fb3c8"/>
  <rect x="120" y="192" width="90" height="6" fill="#9fb3c8"/>
  <rect x="120" y="204" width="64" height="6" fill="#c3d0de"/>
  <rect x="120" y="222" width="34" height="18" fill="none" stroke="#2f6fb2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="137" y="235" text-anchor="middle" font-size="9" fill="#2f6fb2">batch</text>
  <rect x="160" y="222" width="18" height="18" fill="#22364f"/>
  <path d="M163 225h4v4h-4zM170 225h4v4h-4zM163 232h4v4h-4z" fill="#fbf6ea"/>

  <!-- diameter arrow -->
  <line x1="110" y1="322" x2="220" y2="322" stroke="#2f6fb2" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="165" y="340" text-anchor="middle" font-size="12" fill="#2f6fb2">vial body diameter (&#xD8;)</text>
  <line x1="110" y1="301" x2="110" y2="328" stroke="#9fb3c8" stroke-width="1"/>
  <line x1="220" y1="301" x2="220" y2="328" stroke="#9fb3c8" stroke-width="1"/>

  <!-- usable label height arrow (left) -->
  <line x1="90" y1="150" x2="90" y2="250" stroke="#2f6fb2" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="110" y1="150" x2="86" y2="150" stroke="#9fb3c8" stroke-width="1"/>
  <line x1="110" y1="250" x2="86" y2="250" stroke="#9fb3c8" stroke-width="1"/>
  <text x="78" y="205" font-size="12" fill="#2f6fb2" text-anchor="middle" transform="rotate(-90 78 205)">usable label height</text>

  <!-- vial height arrow (right) -->
  <line x1="242" y1="100" x2="242" y2="301" stroke="#2f6fb2" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="220" y1="301" x2="246" y2="301" stroke="#9fb3c8" stroke-width="1"/>
  <text x="256" y="205" font-size="12" fill="#2f6fb2" text-anchor="middle" transform="rotate(-90 256 205)">vial height under cap</text>

  <!-- ============ RIGHT: flat label layout ============ -->
  <text x="480" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#22364f">Flat label layout</text>

  <!-- bleed -->
  <rect x="318" y="112" width="324" height="168" fill="none" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <!-- label / trim (finished size) -->
  <rect x="328" y="122" width="304" height="148" fill="#fbf6ea" stroke="#22364f" stroke-width="1.8"/>
  <rect x="342" y="140" width="110" height="14" fill="#2f6fb2"/>
  <rect x="342" y="164" width="170" height="8" fill="#9fb3c8"/>
  <rect x="342" y="180" width="170" height="8" fill="#9fb3c8"/>
  <rect x="342" y="196" width="120" height="8" fill="#c3d0de"/>
  <rect x="342" y="222" width="60" height="30" fill="none" stroke="#2f6fb2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="372" y="241" text-anchor="middle" font-size="10" fill="#2f6fb2">batch</text>
  <rect x="594" y="140" width="24" height="24" fill="#22364f"/>
  <path d="M598 144h5v5h-5zM608 144h5v5h-5zM598 154h5v5h-5z" fill="#fbf6ea"/>
  <text x="606" y="178" text-anchor="middle" font-size="10" fill="#2f6fb2">QR zone</text>

  <!-- wrap direction arrow (kept inside, clear of the height dimension line) -->
  <path d="M636 246 q20 -18 18 -52" fill="none" stroke="#2f6fb2" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="600" y="290" text-anchor="middle" font-size="11" fill="#2f6fb2">wraps around</text>

  <!-- width arrow -->
  <line x1="328" y1="88" x2="632" y2="88" stroke="#2f6fb2" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="328" y1="112" x2="328" y2="84" stroke="#9fb3c8" stroke-width="1"/>
  <line x1="632" y1="112" x2="632" y2="84" stroke="#9fb3c8" stroke-width="1"/>
  <text x="480" y="78" text-anchor="middle" font-size="12" fill="#2f6fb2">label width = body circumference &#x2212; gap (or + overlap)</text>

  <!-- height arrow -->
  <line x1="664" y1="122" x2="664" y2="270" stroke="#2f6fb2" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="678" y="200" font-size="12" fill="#2f6fb2" text-anchor="middle" transform="rotate(-90 678 200)">label height</text>

  <!-- legend -->
  <line x1="318" y1="322" x2="352" y2="322" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="360" y="326" font-size="12" fill="#5a6b7d">dashed grey = bleed edge</text>
  <line x1="318" y1="340" x2="352" y2="340" stroke="#22364f" stroke-width="1.8"/>
  <text x="360" y="344" font-size="12" fill="#5a6b7d">solid = trim (finished size)</text>
  <line x1="520" y1="322" x2="554" y2="322" stroke="#2f6fb2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="562" y="326" font-size="12" fill="#5a6b7d">variable-data zone (agreed on quote)</text>

  <text x="380" y="368" text-anchor="middle" font-size="12" fill="#5a6b7d" font-style="italic">Measure the actual vial &#x2014; the same &#x201C;mL&#x201D; capacity ships in different body diameters and heights.</text>

  <text x="380" y="412" text-anchor="middle" font-size="12" fill="#8494a5">RP Labels &#x2014; custom peptide vial labels: measured fit, not capacity guesswork</text>
</svg>
