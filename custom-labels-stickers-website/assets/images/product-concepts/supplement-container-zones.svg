<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f6fb2"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#f7f9fc"/>
  <text x="380" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#22364f">Label zones by container type</text>

  <!-- ============ Bottle ============ -->
  <text x="150" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#22364f">Bottle</text>
  <text x="150" y="93" text-anchor="middle" font-size="11" fill="#5a6b7d">vitamin · capsule</text>

  <!-- cap -->
  <rect x="128" y="106" width="44" height="18" rx="3" fill="#4a5d73"/>
  <!-- neck ring -->
  <rect x="134" y="124" width="32" height="8" fill="#dce5ee" stroke="#9fb3c8"/>
  <!-- shoulder + body -->
  <path d="M134 132 q-24 10 -24 34 v176 a14 14 0 0 0 14 14 h52 a14 14 0 0 0 14 -14 v-176 q0 -24 -24 -34 z" fill="#f3f6fa" stroke="#22364f" stroke-width="1.6"/>
  <!-- wrap label zone -->
  <rect x="110" y="186" width="80" height="104" fill="#eef4fb" stroke="#2f6fb2" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="118" y="200" width="50" height="8" fill="#2f6fb2"/>
  <rect x="118" y="216" width="64" height="5" fill="#9fb3c8"/>
  <rect x="118" y="227" width="64" height="5" fill="#9fb3c8"/>
  <rect x="118" y="244" width="44" height="22" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="140" y="259" text-anchor="middle" font-size="8" fill="#5a6b7d">facts</text>
  <!-- callouts -->
  <text x="206" y="150" font-size="11" fill="#2f6fb2">measure usable height</text>
  <text x="206" y="165" font-size="11" fill="#2f6fb2">between shoulder &amp; base</text>
  <line x1="200" y1="152" x2="190" y2="180" stroke="#2f6fb2" stroke-width="1.2"/>
  <line x1="196" y1="186" x2="196" y2="290" stroke="#2f6fb2" stroke-width="1.4" marker-start="url(#arr3)" marker-end="url(#arr3)"/>

  <text x="150" y="392" text-anchor="middle" font-size="11" fill="#5a6b7d">wrap or front + back pair</text>

  <!-- ============ Jar ============ -->
  <text x="380" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#22364f">Jar</text>
  <text x="380" y="93" text-anchor="middle" font-size="11" fill="#5a6b7d">gummy · powders</text>

  <!-- lid -->
  <rect x="320" y="106" width="120" height="26" rx="6" fill="#4a5d73"/>
  <ellipse cx="380" cy="112" rx="30" ry="7" fill="#eef4fb" stroke="#2f6fb2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="380" y="116" text-anchor="middle" font-size="8" fill="#2f6fb2">lid top</text>
  <!-- neck band zone -->
  <rect x="320" y="132" width="120" height="14" fill="#eef4fb" stroke="#2f6fb2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="380" y="142" text-anchor="middle" font-size="8" fill="#2f6fb2">neck / seal band</text>
  <!-- body -->
  <rect x="324" y="146" width="112" height="212" rx="14" fill="#f3f6fa" stroke="#22364f" stroke-width="1.6"/>
  <!-- body label zone -->
  <rect x="324" y="176" width="112" height="120" fill="#eef4fb" stroke="#2f6fb2" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="336" y="192" width="60" height="9" fill="#c97a3f"/>
  <rect x="336" y="210" width="88" height="5" fill="#9fb3c8"/>
  <rect x="336" y="221" width="88" height="5" fill="#9fb3c8"/>
  <rect x="336" y="238" width="50" height="24" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="361" y="253" text-anchor="middle" font-size="8" fill="#5a6b7d">facts</text>

  <line x1="446" y1="176" x2="446" y2="296" stroke="#2f6fb2" stroke-width="1.4" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <text x="462" y="230" font-size="11" fill="#2f6fb2">body wrap zone</text>
  <text x="462" y="245" font-size="11" fill="#2f6fb2">+ lid / neck set</text>

  <text x="380" y="392" text-anchor="middle" font-size="11" fill="#5a6b7d">body + lid seal planned as one set</text>

  <!-- ============ Tub ============ -->
  <text x="610" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#22364f">Tub</text>
  <text x="610" y="93" text-anchor="middle" font-size="11" fill="#5a6b7d">protein powder · bulk</text>

  <!-- lid -->
  <rect x="528" y="106" width="164" height="24" rx="6" fill="#4a5d73"/>
  <!-- tapered body -->
  <path d="M536 130 h148 l-8 216 a14 14 0 0 1 -14 12 h-104 a14 14 0 0 1 -14 -12 z" fill="#f3f6fa" stroke="#22364f" stroke-width="1.6"/>
  <!-- big wrap zone -->
  <path d="M534 160 h152 l-3 130 h-146 z" fill="#eef4fb" stroke="#2f6fb2" stroke-width="1.6" stroke-dasharray="5 3"/>
  <rect x="556" y="180" width="80" height="11" fill="#4f8a5b"/>
  <rect x="556" y="202" width="108" height="6" fill="#9fb3c8"/>
  <rect x="556" y="215" width="108" height="6" fill="#9fb3c8"/>
  <rect x="556" y="234" width="62" height="30" fill="#ffffff" stroke="#9fb3c8" stroke-width="1"/>
  <text x="587" y="253" text-anchor="middle" font-size="8" fill="#5a6b7d">facts panel</text>

  <line x1="702" y1="160" x2="702" y2="290" stroke="#2f6fb2" stroke-width="1.4" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <text x="618" y="316" font-size="11" fill="#2f6fb2">wide wrap: taper +</text>
  <text x="618" y="331" font-size="11" fill="#2f6fb2">flexibility matter</text>

  <text x="610" y="392" text-anchor="middle" font-size="11" fill="#5a6b7d">large panel area · check taper</text>

  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#8494a5">RP Labels — custom supplement labels: fit the container first, then the panel plan</text>
</svg>
