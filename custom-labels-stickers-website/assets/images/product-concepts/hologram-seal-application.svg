<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f093fb"/>
      <stop offset="0.35" stop-color="#8fd3f4"/>
      <stop offset="0.65" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fda4af"/>
    </linearGradient>
    <marker id="arr5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2f6fb2"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#f7f9fc"/>
  <text x="380" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#22364f">Seal placement across the closure</text>

  <!-- ============ bottle cap seal ============ -->
  <text x="185" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#22364f">Bottle cap → shoulder</text>

  <!-- bottle -->
  <rect x="150" y="96" width="70" height="34" rx="5" fill="#4a5d73"/>
  <rect x="160" y="130" width="50" height="12" fill="#dce5ee" stroke="#9fb3c8"/>
  <path d="M160 142 q-36 12 -36 44 v140 a14 14 0 0 0 14 14 h94 a14 14 0 0 0 14 -14 v-140 q0 -32 -36 -44 z" fill="#f3f6fa" stroke="#22364f" stroke-width="1.6"/>

  <!-- seal strip across cap and shoulder -->
  <path d="M168 92 h34 v18 q0 6 6 10 l26 16 q8 5 8 14 v30 h-14 v-26 q0 -7 -6 -11 l-24 -15 q-16 -10 -16 -22 z" fill="url(#holo)" stroke="#22364f" stroke-width="1.6"/>
  <text x="188" y="106" text-anchor="middle" font-size="8" fill="#22364f" transform="rotate(90 188 101)" dy="-1">SEAL</text>
  <text x="230" y="152" font-size="8" fill="#22364f" transform="rotate(32 230 152)">SEAL</text>

  <!-- callout -->
  <text x="272" y="120" font-size="11" fill="#2f6fb2">crosses the opening line:</text>
  <text x="272" y="136" font-size="11" fill="#2f6fb2">cap → neck → shoulder</text>
  <line x1="266" y1="126" x2="244" y2="136" stroke="#2f6fb2" stroke-width="1.2" marker-end="url(#arr5)"/>
  <text x="272" y="180" font-size="11" fill="#5a6b7d">shape follows closure:</text>
  <text x="272" y="196" font-size="11" fill="#5a6b7d">strip · dumbbell · die-cut</text>

  <text x="185" y="380" text-anchor="middle" font-size="11" fill="#5a6b7d">must conform to both surfaces</text>

  <!-- ============ carton flap seal ============ -->
  <text x="545" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#22364f">Carton flap edge</text>

  <!-- carton -->
  <rect x="450" y="150" width="190" height="140" fill="#efe7d3" stroke="#22364f" stroke-width="1.6"/>
  <path d="M450 150 l30 -34 h190 l-30 34 z" fill="#f7f0dd" stroke="#22364f" stroke-width="1.6"/>
  <path d="M640 150 l30 -34 v140 l-30 34 z" fill="#e4d7ba" stroke="#22364f" stroke-width="1.6"/>
  <!-- flap seam on top -->
  <line x1="545" y1="116" x2="575" y2="150" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="480" y1="116" x2="450" y2="150" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="5 3"/>
  <line x1="480" y1="116" x2="545" y2="116" stroke="#9fb3c8" stroke-width="1.4" stroke-dasharray="5 3"/>

  <!-- round hologram seal across flap edge -->
  <circle cx="512" cy="133" r="26" fill="url(#holo)" stroke="#22364f" stroke-width="1.8"/>
  <circle cx="512" cy="133" r="17" fill="none" stroke="#22364f" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="512" y="130" text-anchor="middle" font-size="8" fill="#22364f">LOGO</text>
  <text x="512" y="140" text-anchor="middle" font-size="7" fill="#22364f">SEAL</text>

  <text x="545" y="330" font-size="11" fill="#2f6fb2">spans the flap edge — residue</text>
  <text x="545" y="346" font-size="11" fill="#2f6fb2">behavior depends on board coating</text>
  <line x1="540" y1="320" x2="524" y2="168" stroke="#2f6fb2" stroke-width="1.2" marker-end="url(#arr5)"/>

  <text x="545" y="380" text-anchor="middle" font-size="11" fill="#5a6b7d">test peel on the real surface</text>

  <text x="380" y="412" text-anchor="middle" font-size="12" fill="#8494a5">RP Labels — custom security hologram stickers: planned against the actual package</text>
</svg>
