<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Trace scope; decide quality separately</text><rect x="35" y="205" width="630" height="170" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="250" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">1 · Start with the observed roll</text><text x="60" y="300" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Example: R3 and its actual observation</text><text x="60" y="345" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Keep the roll and evidence identified.</text><path d="M350 378 L350 410" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="415" width="630" height="170" rx="10" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="460" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">2 · Look backward to its inputs</text><text x="60" y="510" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">In the fictional record: MAT-A</text><text x="60" y="555" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Do not invent an unrecorded transition.</text><path d="M350 588 L350 620" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="625" width="630" height="170" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="670" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">3 · Look forward to linked output</text><text x="60" y="720" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">MAT-A is also linked to R1 and R2.</text><text x="60" y="765" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Find the recorded deliveries and locations.</text><rect x="35" y="875" width="630" height="125" rx="10" fill="#f4e5cf" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="921" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">Quality owner decides the disposition.</text><text x="60" y="968" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">A linkage is not proof that a roll is defective.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">No recall or acceptance decision is represented.</text></svg>