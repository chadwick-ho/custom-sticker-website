<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Two checks before stock approval</text><rect x="35" y="210" width="630" height="290" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><rect x="58" y="232" width="60" height="60" rx="10" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><text x="78" y="275" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#173d37">1</text><text x="140" y="275" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Make the intended output</text><text x="60" y="342" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Printer + mode + proposed stock</text><text x="60" y="400" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Ribbon reference where applicable</text><text x="60" y="458" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Actual template and longest values</text><rect x="35" y="595" width="630" height="290" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><rect x="58" y="617" width="60" height="60" rx="10" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><text x="78" y="660" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#173d37">2</text><text x="140" y="660" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Check the actual handling route</text><text x="60" y="727" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Printed and applied representative sample</text><text x="60" y="785" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Relevant storage, contact and exposure</text><text x="60" y="843" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Readable data + intended scan result</text><path d="M350 510 L350 575" fill="none" stroke="#ad7542" stroke-width="4"/><text x="35" y="1025" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Neither check is shown as passed.</text></svg>