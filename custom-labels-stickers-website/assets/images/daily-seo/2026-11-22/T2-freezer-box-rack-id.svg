<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .id{font:700 13px Arial;fill:#16324F}
    .ft{font:13px Arial;fill:#35516B}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">DEMO IDs — the primary mark stays with the box body</text>
  <text class="sm" x="40" y="68">Demonstration IDs only · not scannable codes · illustrated access workflow</text>

  <!-- LEFT: loaded rack -->
  <rect x="30" y="90" width="540" height="620" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="60" y="124">Loaded rack — ordinary access side</text>

  <!-- rack frame -->
  <rect x="80" y="160" width="450" height="440" fill="none" stroke="#5B7186" stroke-width="2.5"/>
  <!-- background boxes -->
  <rect x="110" y="200" width="390" height="160" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.6"/>
  <rect x="110" y="200" width="190" height="160" fill="none" stroke="#8FA9BE" stroke-width="1.2"/>
  <!-- front box -->
  <rect x="110" y="400" width="390" height="180" fill="#FFFFFF" stroke="#5B7186" stroke-width="2"/>
  <!-- ghost label position behind rail -->
  <rect x="150" y="402" width="230" height="40" fill="none" stroke="#B9C6D4" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="sm" x="165" y="426">possible position — hidden</text>
  <!-- rail -->
  <rect x="80" y="385" width="450" height="24" fill="#F0E7C8" stroke="#B07514" stroke-width="2"/>
  <text class="acc" x="536" y="402">Rack rail</text>
  <!-- visible primary label below rail -->
  <rect x="150" y="470" width="300" height="70" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text class="lb" x="165" y="496">Primary body ID:</text>
  <text class="id" x="165" y="524">DEMO-BOX-K</text>
  <!-- viewer direction -->
  <line x1="60" y1="520" x2="105" y2="520" stroke="#2E5F8A" stroke-width="2.4" marker-end="url(#ah2)"/>
  <defs><marker id="ah2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9 Z" fill="#2E5F8A"/></marker></defs>
  <text class="sm" x="56" y="548">staff view</text>

  <!-- RIGHT TOP: pulled-out box, lid lifted -->
  <rect x="600" y="90" width="570" height="360" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="630" y="124">Same box pulled out, lid lifted</text>

  <!-- lid lifted above -->
  <rect x="700" y="160" width="340" height="80" fill="#DCE8F2" stroke="#5B7186" stroke-width="2"/>
  <rect x="720" y="172" width="300" height="56" fill="#FFFFFF" stroke="#16324F" stroke-width="1.6"/>
  <text class="lb" x="732" y="194">Optional lid mark:</text>
  <text class="id" x="732" y="216">DEMO-BOX-K</text>
  <line x1="850" y1="242" x2="850" y2="296" stroke="#B9C6D4" stroke-width="1.6" stroke-dasharray="5 5"/>
  <!-- body -->
  <rect x="700" y="296" width="340" height="120" fill="#FFFFFF" stroke="#5B7186" stroke-width="2"/>
  <rect x="720" y="316" width="300" height="70" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
  <text class="lb" x="732" y="342">Primary body ID:</text>
  <text class="id" x="732" y="370">DEMO-BOX-K</text>
  <!-- withdrawal arrow -->
  <path d="M640,420 C630,390 645,350 675,330" fill="none" stroke="#2E5F8A" stroke-width="2" marker-end="url(#ah2)"/>
  <text class="sm" x="610" y="448">allowed withdrawal</text>

  <!-- RIGHT BOTTOM: inventory record -->
  <rect x="600" y="470" width="570" height="240" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="630" y="504">Inventory record</text>
  <rect x="640" y="520" width="490" height="160" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="1.6"/>
  <text class="lb" x="660" y="556">Location: DEMO-RACK-B</text>
  <line x1="660" y1="576" x2="1110" y2="576" stroke="#DCE8F2" stroke-width="1.4"/>
  <text class="lb" x="660" y="610">DEMO-VIAL-R → DEMO-SLOT-A1</text>
  <line x1="660" y1="630" x2="1110" y2="630" stroke="#DCE8F2" stroke-width="1.4"/>
  <text class="sm" x="660" y="660">box ID, rack location and vial slot are separate fields</text>

  <!-- footer -->
  <text class="ft" x="40" y="752">DEMO IDs: the primary mark stays on the body; a lid mark repeats it only under a controlled lid rule.</text>
  <text class="ft" x="40" y="778">No functional code, real inventory record, lab branding or temperature rating is shown.</text>
  <text class="acc" x="40" y="810">Proof the readable face and the lid-check step on the actual rack and box before ordering.</text>
</svg>
