<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1360" font-family="Arial,Helvetica,sans-serif">
  <rect width="360" height="1360" fill="#FFFFFF"/>
  <style>
    .t{font:700 15px Arial;fill:#16324F}
    .pt{font:700 13px Arial;fill:#16324F}
    .lb{font:11px Arial;fill:#16324F}
    .sm{font:10px Arial;fill:#4A6278}
    .gn{font:700 10px Arial;fill:#16324F}
    .ft{font:11px Arial;fill:#35516B}
    .acc{font:700 11px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="14" y="30">Illustrative grid — same cells,</text>
  <text class="t" x="14" y="50">flat and applied</text>
  <text class="sm" x="14" y="70">Generic shouldered bottle · no shrink values,</text>
  <text class="sm" x="14" y="84">compensation or equipment settings shown</text>

  <!-- flat grid panel -->
  <rect x="10" y="100" width="340" height="500" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="24" y="124">Flat grid sleeve</text>

  <text class="gn" x="60" y="146" text-anchor="middle">A</text>
  <text class="gn" x="120" y="146" text-anchor="middle">B</text>
  <text class="gn" x="180" y="146" text-anchor="middle">C</text>
  <text class="gn" x="240" y="146" text-anchor="middle">D</text>
  <text class="gn" x="300" y="146" text-anchor="middle">E</text>

  <g stroke="#8FA9BE" stroke-width="1.2" fill="#E9F1F7">
    <rect x="30" y="156" width="300" height="416" fill="none"/>
    <line x1="90" y1="156" x2="90" y2="572"/><line x1="150" y1="156" x2="150" y2="572"/>
    <line x1="210" y1="156" x2="210" y2="572"/><line x1="270" y1="156" x2="270" y2="572"/>
    <line x1="30" y1="208" x2="330" y2="208"/><line x1="30" y1="260" x2="330" y2="260"/>
    <line x1="30" y1="312" x2="330" y2="312"/><line x1="30" y1="364" x2="330" y2="364"/>
    <line x1="30" y1="416" x2="330" y2="416"/><line x1="30" y1="468" x2="330" y2="468"/>
    <line x1="30" y1="520" x2="330" y2="520"/>
  </g>
  <g class="gn" text-anchor="middle">
    <text x="22" y="185">1</text><text x="22" y="237">2</text><text x="22" y="289">3</text><text x="22" y="341">4</text>
    <text x="22" y="393">5</text><text x="22" y="445">6</text><text x="22" y="497">7</text><text x="22" y="549">8</text>
  </g>
  <line x1="270" y1="150" x2="270" y2="578" stroke="#B07514" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text class="sm" x="280" y="330" transform="rotate(-90 280 330)">Seam reference</text>

  <!-- applied panel -->
  <rect x="10" y="624" width="340" height="540" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="24" y="648">Applied grid sleeve</text>

  <!-- bottle outline -->
  <path d="M155,664 h50 v16 C205,705 280,730 280,758 L280,1080 q0,10 -10,10 L90,1090 q-10,0 -10,-10 L80,758 C80,730 155,705 155,680 Z"
        fill="none" stroke="#5B7186" stroke-width="1.6"/>

  <!-- applied grid rows: R1 685-705, R2 705-725, R3 725-755, R4-8 755..1085 step 66 -->
  <g stroke="#8FA9BE" stroke-width="1.1" fill="#E9F1F7" fill-opacity="0.55">
    <polygon points="150,685 210,685 230,705 130,705"/>
    <polygon points="130,705 230,705 250,725 110,725"/>
    <polygon points="110,725 250,725 280,755 80,755"/>
    <polygon points="80,755 280,755 280,821 80,821"/>
    <polygon points="80,821 280,821 280,887 80,887"/>
    <polygon points="80,953 280,953 280,1019 80,1019"/>
    <polygon points="80,1019 280,1019 280,1085 80,1085"/>
  </g>
  <polygon points="120,887 160,887 160,953 120,953" fill="#B9D9EC" stroke="#8FA9BE" stroke-width="1.1"/>
  <polygon points="150,705 170,705 166,725 138,725" fill="#F4D9A8" stroke="#B07514" stroke-width="1.4"/>

  <!-- column lines -->
  <g stroke="#8FA9BE" stroke-width="1">
    <line x1="162" y1="685" x2="150" y2="705"/><line x1="174" y1="685" x2="170" y2="705"/>
    <line x1="186" y1="685" x2="190" y2="705"/><line x1="198" y1="685" x2="210" y2="705"/>
    <line x1="150" y1="705" x2="138" y2="725"/><line x1="170" y1="705" x2="166" y2="725"/>
    <line x1="190" y1="705" x2="194" y2="725"/><line x1="210" y1="705" x2="222" y2="725"/>
    <line x1="138" y1="725" x2="120" y2="755"/><line x1="166" y1="725" x2="160" y2="755"/>
    <line x1="194" y1="725" x2="200" y2="755"/><line x1="222" y1="725" x2="240" y2="755"/>
    <line x1="120" y1="755" x2="120" y2="1085"/><line x1="160" y1="755" x2="160" y2="1085"/>
    <line x1="200" y1="755" x2="200" y2="1085"/><line x1="240" y1="755" x2="240" y2="1085"/>
  </g>
  <polyline points="198,685 210,705 222,725 240,755 240,1081" fill="none"
            stroke="#B07514" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text class="sm" x="252" y="930" transform="rotate(-90 252 930)">Seam</text>

  <g class="gn" text-anchor="middle">
    <text x="144" y="699">1</text><text x="124" y="719">2</text><text x="104" y="744">3</text>
    <text x="72" y="792">4</text><text x="72" y="858">5</text><text x="72" y="924">6</text>
    <text x="72" y="990">7</text><text x="72" y="1056">8</text>
    <text x="100" y="1102">A</text><text x="140" y="1102">B</text><text x="180" y="1102">C</text>
    <text x="220" y="1102">D</text><text x="260" y="1102">E</text>
  </g>
  <text class="sm" x="140" y="924" text-anchor="middle">B6</text>
  <text class="sm" x="153" y="718" text-anchor="middle">B2</text>

  <!-- copy-move arrow -->
  <path d="M152,728 C170,780 150,830 146,872" fill="none" stroke="#C05621" stroke-width="2" marker-end="url(#ahm)"/>
  <defs><marker id="ahm" markerWidth="8" markerHeight="8" refX="5.5" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="#C05621"/></marker></defs>
  <text class="acc" x="290" y="806">Possible copy</text>
  <text class="acc" x="290" y="820">move</text>
  <line x1="286" y1="812" x2="168" y2="826" stroke="#C05621" stroke-width="1"/>

  <text class="lb" x="292" y="694">Shoulder:</text>
  <text class="lb" x="292" y="708">compressed</text>
  <line x1="288" y1="700" x2="252" y2="712" stroke="#8FA9BE" stroke-width="1"/>
  <text class="lb" x="292" y="930">Wall: more</text>
  <text class="lb" x="292" y="944">regular cells</text>
  <line x1="288" y1="938" x2="282" y2="936" stroke="#8FA9BE" stroke-width="1"/>

  <!-- footer -->
  <text class="ft" x="14" y="1198">Matching rows 1–8 and columns A–E</text>
  <text class="ft" x="14" y="1216">on both views; the dashed seam line is</text>
  <text class="ft" x="14" y="1234">a position reference only. Compare the</text>
  <text class="ft" x="14" y="1252">same bottle, sleeve film, seam</text>
  <text class="ft" x="14" y="1270">orientation and packing line before</text>
  <text class="ft" x="14" y="1288">checking the applied artwork.</text>
  <text class="acc" x="14" y="1316">Next: applied artwork proof — this grid</text>
  <text class="acc" x="14" y="1334">cannot stand in for the printed sample.</text>
</svg>
