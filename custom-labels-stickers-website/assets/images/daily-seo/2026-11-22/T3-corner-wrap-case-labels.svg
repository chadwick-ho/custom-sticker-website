<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <defs>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#C8B98A" stroke-width="2.5"/>
    </pattern>
    <pattern id="cross" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0,0 L12,12 M12,0 L0,12" stroke="#B9C6D4" stroke-width="1.4"/>
    </pattern>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#2E5F8A"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .ft{font:13px Arial;fill:#35516B}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">One label across a corner, or two flat labels</text>
  <text class="sm" x="40" y="68">Illustrative layouts · placeholder symbol blocks only · not a placement specification</text>

  <!-- TOP LEFT: case overview -->
  <rect x="30" y="90" width="400" height="290" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="56" y="124">Packed case — working corner</text>
  <polygon points="120,190 260,190 260,330 120,330" fill="#DCE8F2" stroke="#5B7186" stroke-width="2"/>
  <polygon points="260,190 340,160 340,300 260,330" fill="#F0E7C8" stroke="#5B7186" stroke-width="2"/>
  <polygon points="120,190 200,160 340,160 260,190" fill="#F4F8FB" stroke="#5B7186" stroke-width="2"/>
  <text class="lb" x="190" y="265" text-anchor="middle">Face A</text>
  <text class="lb" x="300" y="250" text-anchor="middle">Face B</text>
  <line x1="260" y1="190" x2="260" y2="330" stroke="#B07514" stroke-width="3"/>
  <text class="acc" x="262" y="352">working corner</text>
  <line x1="60" y1="255" x2="112" y2="255" stroke="#2E5F8A" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text class="sm" x="50" y="284">Receiver</text><text class="sm" x="50" y="298">view 1</text>
  <line x1="404" y1="225" x2="348" y2="240" stroke="#2E5F8A" stroke-width="2.2" marker-end="url(#ah3)"/>
  <text class="sm" x="352" y="210">Receiver view 2</text>

  <!-- TOP RIGHT: one-piece wrap flat map -->
  <rect x="450" y="90" width="720" height="290" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="476" y="124">One-piece wrap — flat map</text>
  <!-- face A zone -->
  <rect x="490" y="150" width="330" height="160" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.8"/>
  <text class="sm" x="496" y="168">Face A</text>
  <!-- fold band -->
  <rect x="820" y="150" width="110" height="160" fill="url(#hatch)" stroke="#B07514" stroke-width="1.8"/>
  <line x1="852" y1="150" x2="852" y2="310" stroke="#B07514" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="898" y1="150" x2="898" y2="310" stroke="#B07514" stroke-width="1.6" stroke-dasharray="6 5"/>
  <!-- face B zone -->
  <rect x="930" y="150" width="220" height="160" fill="#F0E7C8" stroke="#5B7186" stroke-width="1.8"/>
  <text class="sm" x="936" y="168">Face B</text>
  <!-- symbol placeholders -->
  <rect x="540" y="186" width="190" height="100" fill="url(#cross)" stroke="#16324F" stroke-width="1.8"/>
  <rect x="540" y="186" width="190" height="100" fill="none" stroke="#16324F" stroke-width="1.8" stroke-dasharray="7 5" transform="translate(0,0)"/>
  <text class="lb" x="635" y="230" text-anchor="middle">Complete</text>
  <text class="lb" x="635" y="248" text-anchor="middle">symbol area</text>
  <text class="sm" x="635" y="270" text-anchor="middle">+ Quiet zone</text>
  <rect x="966" y="186" width="160" height="100" fill="url(#cross)" stroke="#16324F" stroke-width="1.8"/>
  <text class="lb" x="1046" y="230" text-anchor="middle">Complete</text>
  <text class="lb" x="1046" y="248" text-anchor="middle">symbol area</text>
  <text class="sm" x="1046" y="270" text-anchor="middle">+ Quiet zone</text>
  <!-- fold band labels -->
  <text class="acc" x="875" y="332" text-anchor="middle">Fold band</text>
  <text class="sm" x="875" y="350" text-anchor="middle">possible corner</text>
  <text class="sm" x="875" y="364" text-anchor="middle">positions</text>

  <!-- BOTTOM: two separate labels -->
  <rect x="30" y="400" width="1140" height="280" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="56" y="434">Two separate labels — each keeps a complete symbol area on its own face</text>
  <rect x="90" y="460" width="440" height="180" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.8"/>
  <text class="sm" x="98" y="480">Face A</text>
  <rect x="150" y="490" width="220" height="120" fill="url(#cross)" stroke="#16324F" stroke-width="1.8"/>
  <text class="lb" x="260" y="540" text-anchor="middle">Complete symbol</text>
  <text class="lb" x="260" y="558" text-anchor="middle">area + Quiet zone</text>
  <text class="lb" x="400" y="560">Label 1</text>
  <rect x="670" y="460" width="440" height="180" fill="#F0E7C8" stroke="#5B7186" stroke-width="1.8"/>
  <text class="sm" x="678" y="480">Face B</text>
  <rect x="730" y="490" width="220" height="120" fill="url(#cross)" stroke="#16324F" stroke-width="1.8"/>
  <text class="lb" x="840" y="540" text-anchor="middle">Complete symbol</text>
  <text class="lb" x="840" y="558" text-anchor="middle">area + Quiet zone</text>
  <text class="lb" x="980" y="560">Label 2</text>
  <text class="sm" x="590" y="555">two placements,</text>
  <text class="sm" x="590" y="572">one approved</text>
  <text class="sm" x="590" y="589">case record</text>

  <!-- footer -->
  <text class="ft" x="40" y="730">Placeholder blocks only — no scannable pattern. Symbol areas and their quiet zones stay outside the fold band.</text>
  <text class="ft" x="40" y="756">Confirm fold variation, edge clearance and permitted duplication for the actual case and receiver before ordering.</text>
  <text class="acc" x="40" y="790">The working corner, faces and required views follow the packed case and the receiver’s rules — not a universal rule.</text>
</svg>
