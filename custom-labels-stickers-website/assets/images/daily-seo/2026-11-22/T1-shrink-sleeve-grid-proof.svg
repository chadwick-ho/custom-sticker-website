<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .gn{font:700 12px Arial;fill:#16324F}
    .ft{font:13px Arial;fill:#35516B}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">Illustrative grid — same cells, flat and applied</text>
  <text class="sm" x="40" y="68">Generic shouldered bottle · no shrink values, compensation percentages or equipment settings shown</text>

  <!-- LEFT: flat grid -->
  <rect x="30" y="90" width="560" height="620" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="60" y="124">Flat grid sleeve</text>

  <text class="gn" x="128" y="150" text-anchor="middle">A</text>
  <text class="gn" x="224" y="150" text-anchor="middle">B</text>
  <text class="gn" x="320" y="150" text-anchor="middle">C</text>
  <text class="gn" x="416" y="150" text-anchor="middle">D</text>
  <text class="gn" x="512" y="150" text-anchor="middle">E</text>

  <g stroke="#8FA9BE" stroke-width="1.4" fill="#E9F1F7">
    <rect x="80" y="160" width="480" height="480" fill="none"/>
    <line x1="176" y1="160" x2="176" y2="640"/>
    <line x1="272" y1="160" x2="272" y2="640"/>
    <line x1="368" y1="160" x2="368" y2="640"/>
    <line x1="464" y1="160" x2="464" y2="640"/>
    <line x1="80" y1="220" x2="560" y2="220"/>
    <line x1="80" y1="280" x2="560" y2="280"/>
    <line x1="80" y1="340" x2="560" y2="340"/>
    <line x1="80" y1="400" x2="560" y2="400"/>
    <line x1="80" y1="460" x2="560" y2="460"/>
    <line x1="80" y1="520" x2="560" y2="520"/>
    <line x1="80" y1="580" x2="560" y2="580"/>
  </g>
  <g class="gn" text-anchor="middle">
    <text x="68" y="194">1</text><text x="68" y="254">2</text><text x="68" y="314">3</text><text x="68" y="374">4</text>
    <text x="68" y="434">5</text><text x="68" y="494">6</text><text x="68" y="554">7</text><text x="68" y="614">8</text>
  </g>
  <line x1="464" y1="150" x2="464" y2="646" stroke="#B07514" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="sm" x="476" y="330" transform="rotate(-90 476 330)">Seam reference</text>

  <!-- RIGHT: applied grid on shouldered bottle -->
  <rect x="620" y="90" width="550" height="620" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="650" y="124">Applied grid sleeve</text>

  <!-- bottle outline -->
  <path d="M870,150 h80 v45 C950,225 1040,255 1040,290 L1040,632 q0,18 -18,18 L798,650 q-18,0 -18,-18 L780,290 C780,255 870,225 870,195 Z"
        fill="none" stroke="#5B7186" stroke-width="2"/>

  <!-- applied grid rows -->
  <g stroke="#8FA9BE" stroke-width="1.4" fill="#E9F1F7" fill-opacity="0.55">
    <polygon points="864.7,200 955.3,200 984,227 836,227"/>
    <polygon points="836,227 984,227 1012.5,254 807.5,254"/>
    <polygon points="807.5,254 1012.5,254 1040,280 780,280"/>
    <polygon points="780,280 1040,280 1040,354 780,354"/>
    <polygon points="780,354 1040,354 1040,428 780,428"/>
    <polygon points="780,428 1040,428 1040,502 780,502"/>
    <polygon points="780,502 1040,502 1040,576 780,576"/>
    <polygon points="780,576 1040,576 1040,650 780,650"/>
  </g>
  <!-- highlighted regular wall cell B6 -->
  <polygon points="832,428 884,428 884,502 832,502" fill="#B9D9EC" stroke="#8FA9BE" stroke-width="1.4"/>
  <!-- highlighted compressed shoulder cell B2 -->
  <polygon points="865.6,227 895.2,227 889.5,254 848.5,254" fill="#F4D9A8" stroke="#B07514" stroke-width="1.6"/>

  <!-- column lines -->
  <g stroke="#8FA9BE" stroke-width="1.2">
    <line x1="882.8" y1="200" x2="865.6" y2="227"/><line x1="900.9" y1="200" x2="895.2" y2="227"/>
    <line x1="919" y1="200" x2="924.8" y2="227"/><line x1="937.1" y1="200" x2="954.4" y2="227"/>
    <line x1="865.6" y1="227" x2="848.5" y2="254"/><line x1="895.2" y1="227" x2="889.5" y2="254"/>
    <line x1="924.8" y1="227" x2="930.5" y2="254"/><line x1="954.4" y1="227" x2="971.5" y2="254"/>
    <line x1="848.5" y1="254" x2="832" y2="280"/><line x1="889.5" y1="254" x2="884" y2="280"/>
    <line x1="930.5" y1="254" x2="936" y2="280"/><line x1="971.5" y1="254" x2="988" y2="280"/>
    <line x1="832" y1="280" x2="832" y2="650"/><line x1="884" y1="280" x2="884" y2="650"/>
    <line x1="936" y1="280" x2="936" y2="650"/><line x1="988" y1="280" x2="988" y2="650"/>
  </g>

  <!-- seam on applied view -->
  <polyline points="937.1,200 954.4,227 971.5,254 988,280 988,646" fill="none"
            stroke="#B07514" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="sm" x="1000" y="470" transform="rotate(-90 1000 470)">Seam reference</text>

  <!-- row numbers and column letters -->
  <g class="gn" text-anchor="middle">
    <text x="856" y="218">1</text><text x="828" y="244">2</text><text x="798" y="270">3</text>
    <text x="768" y="321">4</text><text x="768" y="395">5</text><text x="768" y="469">6</text>
    <text x="768" y="543">7</text><text x="768" y="617">8</text>
    <text x="806" y="672">A</text><text x="858" y="672">B</text><text x="910" y="672">C</text>
    <text x="962" y="672">D</text><text x="1014" y="672">E</text>
  </g>
  <text class="sm" x="858" y="464" text-anchor="middle">B6</text>
  <text class="sm" x="872" y="243" text-anchor="middle">B2</text>

  <!-- copy-move arrow inside applied view -->
  <path d="M874,252 C900,300 872,380 864,448" fill="none" stroke="#C05621" stroke-width="2.4" marker-end="url(#ah)"/>
  <defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L8,4.5 L0,9 Z" fill="#C05621"/></marker></defs>
  <text class="acc" x="1050" y="352">Possible copy move</text>
  <line x1="1046" y1="348" x2="906" y2="340" stroke="#C05621" stroke-width="1.2"/>

  <!-- callouts -->
  <text class="lb" x="1050" y="222">Shoulder:</text>
  <text class="lb" x="1050" y="238">compressed cells</text>
  <line x1="1046" y1="228" x2="1010" y2="238" stroke="#8FA9BE" stroke-width="1"/>
  <text class="lb" x="1050" y="462">Wall: more</text>
  <text class="lb" x="1050" y="478">regular cells</text>
  <line x1="1046" y1="470" x2="1042" y2="470" stroke="#8FA9BE" stroke-width="1"/>

  <!-- footer -->
  <text class="ft" x="40" y="752">Matching rows 1–8 and columns A–E on both views; the dashed seam line is a position reference only.</text>
  <text class="ft" x="40" y="778">Compare the same bottle, sleeve film, seam orientation and packing line before checking the applied artwork.</text>
  <text class="acc" x="40" y="810">Next: applied artwork proof — this grid cannot stand in for the printed sample.</text>
</svg>
