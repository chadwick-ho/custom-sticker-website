<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .ft{font:13px Arial;fill:#35516B}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">Possible appearances after label removal — illustrative</text>
  <text class="sm" x="40" y="68">Matched trial parts · appearance routes follow-up, it does not diagnose · layer thickness exaggerated</text>

  <!-- layer legend -->
  <rect x="30" y="90" width="1140" height="110" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="56" y="120">Layers under the label</text>
  <rect x="60" y="136" width="34" height="22" fill="#DCE8F2" stroke="#5B7186"/>
  <text class="lb" x="102" y="152">Label facestock</text>
  <rect x="230" y="136" width="34" height="22" fill="#8FA9BE" stroke="#5B7186"/>
  <text class="lb" x="272" y="152">Adhesive</text>
  <rect x="370" y="136" width="34" height="22" fill="#F0E7C8" stroke="#B07514"/>
  <text class="lb" x="412" y="152">Cured coating</text>
  <rect x="540" y="136" width="34" height="22" fill="#C9CED4" stroke="#5B7186"/>
  <text class="lb" x="582" y="152">Metal</text>
  <!-- companion chip -->
  <rect x="720" y="128" width="60" height="10" fill="#F0E7C8" stroke="#B07514"/>
  <rect x="720" y="138" width="60" height="26" fill="#C9CED4" stroke="#5B7186"/>
  <text class="lb" x="792" y="146">Unlabeled companion</text>
  <text class="sm" x="792" y="164">same finish, no label</text>

  <!-- PANEL A: coating appears intact -->
  <rect x="30" y="220" width="560" height="420" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="56" y="254">A — Coating appears intact</text>
  <!-- tin cross-section -->
  <rect x="70" y="500" width="480" height="80" fill="#C9CED4" stroke="#5B7186" stroke-width="1.6"/>
  <rect x="70" y="470" width="480" height="30" fill="#F0E7C8" stroke="#B07514" stroke-width="1.6"/>
  <!-- peeling label -->
  <polygon points="120,470 330,470 330,455 150,405" fill="#DCE8F2" stroke="#16324F" stroke-width="1.8"/>
  <polygon points="150,405 330,455 330,470 150,420" fill="#8FA9BE" stroke="#5B7186" stroke-width="1.4"/>
  <text class="lb" x="160" y="398">lifted label</text>
  <!-- interface callout -->
  <circle cx="340" cy="470" r="5" fill="#C05621"/>
  <text class="lb" x="356" y="452">separation at the</text>
  <text class="lb" x="356" y="468">adhesive/coating line</text>
  <!-- companion inset -->
  <rect x="400" y="330" width="60" height="10" fill="#F0E7C8" stroke="#B07514"/>
  <rect x="400" y="340" width="60" height="26" fill="#C9CED4" stroke="#5B7186"/>
  <text class="sm" x="470" y="352">unlabeled companion:</text>
  <text class="sm" x="470" y="366">finish unchanged</text>
  <text class="sm" x="80" y="612">coating band continuous across the contact patch</text>

  <!-- PANEL B: possible coating transfer -->
  <rect x="610" y="220" width="560" height="420" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="636" y="254">B — Possible coating transfer</text>
  <!-- tin cross-section with gap -->
  <rect x="650" y="500" width="480" height="80" fill="#C9CED4" stroke="#5B7186" stroke-width="1.6"/>
  <rect x="650" y="470" width="200" height="30" fill="#F0E7C8" stroke="#B07514" stroke-width="1.6"/>
  <rect x="930" y="470" width="200" height="30" fill="#F0E7C8" stroke="#B07514" stroke-width="1.6"/>
  <rect x="850" y="470" width="80" height="30" fill="#C9CED4" stroke="#B07514" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- peeling label with fragment -->
  <polygon points="700,470 910,470 910,455 730,405" fill="#DCE8F2" stroke="#16324F" stroke-width="1.8"/>
  <polygon points="730,405 910,455 910,470 730,420" fill="#8FA9BE" stroke="#5B7186" stroke-width="1.4"/>
  <polygon points="850,470 900,470 898,488 852,488" fill="#F0E7C8" stroke="#B07514" stroke-width="1.6"/>
  <text class="lb" x="740" y="398">lifted label</text>
  <text class="lb" x="760" y="440">possible coating fragment</text>
  <line x1="852" y1="446" x2="862" y2="468" stroke="#B07514" stroke-width="1.2"/>
  <text class="lb" x="950" y="452">changed patch</text>
  <text class="lb" x="950" y="468">on the tin</text>
  <line x1="946" y1="460" x2="925" y2="478" stroke="#B07514" stroke-width="1.2"/>
  <!-- companion inset -->
  <rect x="980" y="330" width="60" height="10" fill="#F0E7C8" stroke="#B07514"/>
  <rect x="980" y="340" width="60" height="26" fill="#C9CED4" stroke="#5B7186"/>
  <text class="sm" x="900" y="352" text-anchor="end">unlabeled companion:</text>
  <text class="sm" x="900" y="366" text-anchor="end">finish unchanged</text>
  <text class="sm" x="660" y="612">coating gap under the lift point — record, then route to the coating owner</text>

  <!-- inspect strip -->
  <rect x="30" y="664" width="1140" height="50" rx="8" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.4"/>
  <text class="lb" x="56" y="696">Inspect both surfaces: label underside, tin patch and the unlabeled companion — together, in one record.</text>

  <!-- footer -->
  <text class="ft" x="40" y="752">Appearance is a routing clue — the coating owner or qualified lab selects and interprets any adhesion test.</text>
  <text class="ft" x="40" y="778">No force, coating-thickness, exposure or performance values are shown; the two interfaces are examples.</text>
</svg>
