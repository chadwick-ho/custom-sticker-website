<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1400" font-family="Arial,Helvetica,sans-serif">
  <rect width="360" height="1400" fill="#FFFFFF"/>
  <style>
    .t{font:700 15px Arial;fill:#16324F}
    .pt{font:700 13px Arial;fill:#16324F}
    .lb{font:11px Arial;fill:#16324F}
    .sm{font:10px Arial;fill:#4A6278}
    .id{font:700 12px Arial;fill:#16324F}
    .ft{font:11px Arial;fill:#35516B}
    .acc{font:700 11px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="14" y="30">DEMO IDs — the primary mark</text>
  <text class="t" x="14" y="50">stays with the box body</text>
  <text class="sm" x="14" y="70">Demonstration IDs only · not scannable</text>
  <text class="sm" x="14" y="84">codes · illustrated access workflow</text>

  <!-- rack panel -->
  <rect x="10" y="100" width="340" height="470" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="24" y="124">Loaded rack — access side</text>
  <rect x="40" y="145" width="280" height="390" fill="none" stroke="#5B7186" stroke-width="2"/>
  <rect x="60" y="170" width="240" height="120" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.4"/>
  <line x1="180" y1="170" x2="180" y2="290" stroke="#8FA9BE" stroke-width="1"/>
  <!-- front box -->
  <rect x="60" y="330" width="240" height="185" fill="#FFFFFF" stroke="#5B7186" stroke-width="1.8"/>
  <rect x="80" y="332" width="140" height="34" fill="none" stroke="#B9C6D4" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="sm" x="86" y="352">hidden position</text>
  <!-- rail -->
  <rect x="40" y="312" width="280" height="20" fill="#F0E7C8" stroke="#B07514" stroke-width="1.8"/>
  <text class="acc" x="326" y="327" text-anchor="end">Rack rail</text>
  <!-- primary label -->
  <rect x="80" y="390" width="200" height="90" fill="#FFFFFF" stroke="#16324F" stroke-width="1.8"/>
  <text class="lb" x="92" y="416">Primary body ID:</text>
  <text class="id" x="92" y="444">DEMO-BOX-K</text>
  <line x1="52" y1="440" x2="78" y2="440" stroke="#2E5F8A" stroke-width="2" marker-end="url(#ah2m)"/>
  <defs><marker id="ah2m" markerWidth="8" markerHeight="8" refX="5.5" refY="4" orient="auto">
    <path d="M0,0 L7,4 L0,8 Z" fill="#2E5F8A"/></marker></defs>
  <text class="sm" x="42" y="466">staff view</text>

  <!-- open box panel -->
  <rect x="10" y="592" width="340" height="400" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="24" y="616">Same box pulled out, lid lifted</text>
  <rect x="60" y="640" width="240" height="72" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.8"/>
  <rect x="72" y="650" width="216" height="52" fill="#FFFFFF" stroke="#16324F" stroke-width="1.4"/>
  <text class="lb" x="80" y="670">Optional lid mark:</text>
  <text class="id" x="80" y="692">DEMO-BOX-K</text>
  <line x1="180" y1="714" x2="180" y2="750" stroke="#B9C6D4" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="60" y="750" width="240" height="110" fill="#FFFFFF" stroke="#5B7186" stroke-width="1.8"/>
  <rect x="72" y="770" width="216" height="70" fill="#FFFFFF" stroke="#16324F" stroke-width="1.6"/>
  <text class="lb" x="80" y="796">Primary body ID:</text>
  <text class="id" x="80" y="824">DEMO-BOX-K</text>
  <path d="M40,880 C32,850 40,820 56,800" fill="none" stroke="#2E5F8A" stroke-width="1.8" marker-end="url(#ah2m)"/>
  <text class="sm" x="30" y="906">allowed</text>
  <text class="sm" x="30" y="920">withdrawal</text>
  <text class="sm" x="24" y="972">lid mark repeats the same ID only under a controlled lid rule</text>

  <!-- inventory panel -->
  <rect x="10" y="1014" width="340" height="200" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="24" y="1038">Inventory record</text>
  <rect x="24" y="1054" width="312" height="140" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="1.4"/>
  <text class="lb" x="38" y="1086">Location: DEMO-RACK-B</text>
  <line x1="38" y1="1102" x2="322" y2="1102" stroke="#DCE8F2" stroke-width="1.2"/>
  <text class="lb" x="38" y="1130">DEMO-VIAL-R → DEMO-SLOT-A1</text>
  <line x1="38" y1="1146" x2="322" y2="1146" stroke="#DCE8F2" stroke-width="1.2"/>
  <text class="sm" x="38" y="1174">box ID, rack location and vial slot</text>
  <text class="sm" x="38" y="1188">are separate fields</text>

  <!-- footer -->
  <text class="ft" x="14" y="1250">DEMO IDs: the primary mark stays on the</text>
  <text class="ft" x="14" y="1268">body; a lid mark repeats it only under a</text>
  <text class="ft" x="14" y="1286">controlled lid rule. No functional code,</text>
  <text class="ft" x="14" y="1304">real inventory record, lab branding or</text>
  <text class="ft" x="14" y="1322">temperature rating is shown.</text>
  <text class="acc" x="14" y="1350">Proof the readable face and the lid-check</text>
  <text class="acc" x="14" y="1368">step on the actual rack and box first.</text>
</svg>
