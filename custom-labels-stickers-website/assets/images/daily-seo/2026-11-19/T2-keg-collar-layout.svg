<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Top and side views of a keg distinguish the collar's fill field from a permanent keg mark and the brewery's approved warning location.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#16324F">Example keg layout</text>

  <!-- Top view panel -->
  <rect x="40" y="85" width="540" height="380" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="310" y="124" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">Top view</text>
  <circle cx="300" cy="290" r="145" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <circle cx="300" cy="290" r="140" fill="none" stroke="#C9B37E" stroke-width="1.5"/>
  <circle cx="300" cy="290" r="70" fill="#F4F7FA" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="300" cy="290" r="42" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="300" cy="290" r="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <!-- fill field on collar annulus, upper right -->
  <rect x="356" y="196" width="60" height="28" rx="4" fill="#FFFFFF" stroke="#C9B37E" stroke-width="2" transform="rotate(35 386 210)"/>
  <text x="425" y="158" font-size="18" font-weight="bold" fill="#16324F">Fill-specific field</text>
  <line x1="440" y1="165" x2="405" y2="200" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>
  <text x="70" y="160" font-size="18" font-weight="bold" fill="#16324F">Check neck fit</text>
  <line x1="140" y1="168" x2="262" y2="252" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>
  <text x="310" y="445" text-anchor="middle" font-size="15" font-style="italic" fill="#5B7186">collar around the fitting</text>

  <!-- Side view panel -->
  <rect x="620" y="85" width="540" height="380" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="890" y="124" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">Side view</text>
  <rect x="872" y="138" width="36" height="24" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="815" y="160" width="150" height="18" rx="6" fill="#9FB3C8" stroke="#4A7196" stroke-width="2"/>
  <rect x="820" y="178" width="140" height="204" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="815" y="382" width="150" height="18" rx="6" fill="#9FB3C8" stroke="#4A7196" stroke-width="2"/>
  <!-- permanent mark on upper body -->
  <rect x="838" y="196" width="52" height="20" fill="#FFFFFF" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="844" y1="206" x2="884" y2="206" stroke="#4A7196" stroke-width="1.5"/>
  <text x="648" y="200" font-size="18" font-weight="bold" fill="#16324F">Existing</text>
  <text x="648" y="221" font-size="18" font-weight="bold" fill="#16324F">permanent mark</text>
  <line x1="786" y1="212" x2="836" y2="208" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>
  <!-- approved warning location -->
  <rect x="838" y="290" width="104" height="52" fill="none" stroke="#6B5A2E" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="985" y="300" font-size="18" font-weight="bold" fill="#16324F">Approved warning</text>
  <text x="985" y="321" font-size="18" font-weight="bold" fill="#16324F">location</text>
  <line x1="980" y1="312" x2="946" y2="315" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stock format card A -->
  <rect x="40" y="510" width="550" height="290" rx="14" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="315" y="552" text-anchor="middle" font-size="22" font-weight="bold" fill="#16324F">Beer-specific print</text>
  <rect x="90" y="580" width="450" height="80" rx="8" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <rect x="105" y="596" width="70" height="48" fill="#FFFFFF" stroke="#C9B37E" stroke-width="1.5"/>
  <line x1="115" y1="612" x2="165" y2="612" stroke="#6B5A2E" stroke-width="2"/>
  <line x1="115" y1="624" x2="155" y2="624" stroke="#6B5A2E" stroke-width="2"/>
  <line x1="195" y1="606" x2="500" y2="606" stroke="#6B5A2E" stroke-width="3"/>
  <line x1="195" y1="622" x2="460" y2="622" stroke="#6B5A2E" stroke-width="3"/>
  <line x1="195" y1="638" x2="480" y2="638" stroke="#6B5A2E" stroke-width="3"/>
  <text x="315" y="705" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E5F8A">Select the correct version</text>
  <text x="315" y="735" text-anchor="middle" font-size="16" font-style="italic" fill="#5B7186">one printed version per beer</text>

  <!-- Stock format card B -->
  <rect x="610" y="510" width="550" height="290" rx="14" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="885" y="552" text-anchor="middle" font-size="22" font-weight="bold" fill="#16324F">Common collar</text>
  <rect x="660" y="580" width="450" height="80" rx="8" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <line x1="675" y1="606" x2="830" y2="606" stroke="#6B5A2E" stroke-width="3"/>
  <line x1="675" y1="622" x2="810" y2="622" stroke="#6B5A2E" stroke-width="3"/>
  <line x1="675" y1="638" x2="820" y2="638" stroke="#6B5A2E" stroke-width="3"/>
  <rect x="860" y="594" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#7A94A8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="975" y="626" text-anchor="middle" font-size="16" font-style="italic" fill="#5B7186">fill field</text>
  <text x="885" y="705" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E5F8A">Complete and check at filling</text>
  <text x="885" y="735" text-anchor="middle" font-size="16" font-style="italic" fill="#5B7186">same stock for each fill</text>

  <text x="600" y="836" text-anchor="middle" font-size="19" font-style="italic" fill="#5B7186">Schematic — wording, attachment and warning placement are approved by the brewery</text>
</svg>
