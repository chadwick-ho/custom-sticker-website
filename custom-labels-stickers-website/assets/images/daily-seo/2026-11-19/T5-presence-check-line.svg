<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A line diagram locates the presence check after application. Matched filled bottles show the proposed label feature and the same area on a bare control.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#FEFEFC"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#16324F">Locate the check, then challenge it</text>

  <!-- Conveyor -->
  <rect x="60" y="200" width="1080" height="14" rx="7" fill="#E4EBF2" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="1100" y1="207" x2="1135" y2="207" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Label roll and web-gap sensor -->
  <circle cx="130" cy="150" r="42" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="130" cy="150" r="14" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="172" y1="158" x2="330" y2="196" stroke="#9FB3C8" stroke-width="4"/>
  <rect x="215" y="130" width="26" height="20" rx="3" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="228" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Web-gap sensor</text>
  <line x1="228" y1="118" x2="228" y2="127" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Application point bottle -->
  <rect x="372" y="128" width="24" height="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="355" y="142" width="58" height="58" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="355" y="158" width="58" height="26" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="384" y="105" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Label applied</text>
  <line x1="384" y1="111" x2="384" y2="125" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Downstream bottle -->
  <rect x="687" y="128" width="24" height="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="670" y="142" width="58" height="58" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="670" y="158" width="58" height="26" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <!-- inspection station -->
  <rect x="668" y="88" width="62" height="30" rx="4" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <circle cx="699" cy="120" r="6" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <line x1="683" y1="126" x2="672" y2="142" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="715" y1="126" x2="726" y2="142" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="699" y="68" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Downstream presence check</text>
  <line x1="699" y1="74" x2="699" y2="84" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Reject point -->
  <rect x="895" y="148" width="14" height="52" fill="#9FB3C8" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="909" y1="170" x2="945" y2="170" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="948" y="182" width="70" height="20" rx="4" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="1.5"/>
  <text x="950" y="105" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Reject point</text>
  <line x1="950" y1="111" x2="912" y2="150" stroke="#4A7196" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Matched examples -->
  <text x="600" y="272" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Matched examples</text>
  <text x="600" y="298" text-anchor="middle" font-size="17" font-style="italic" fill="#5B7186">Same bottle, fill and background</text>

  <!-- Labeled card -->
  <rect x="40" y="320" width="550" height="470" rx="14" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="315" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Label present</text>
  <rect x="240" y="390" width="160" height="200" fill="#F4F7FA"/>
  <rect x="298" y="402" width="34" height="22" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="275" y="424" width="90" height="150" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="275" y="452" width="90" height="72" fill="#FFFFFF" fill-opacity="0.35" stroke="#2E5F8A" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="295" y="470" width="50" height="28" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="320" y="620" text-anchor="middle" font-size="15" font-style="italic" fill="#5B7186">candidate feature on clear film</text>
  <text x="70" y="672" font-size="19" font-weight="bold" fill="#16324F">Station decision</text>
  <line x1="245" y1="678" x2="560" y2="678" stroke="#B9C6D4" stroke-width="2"/>
  <text x="70" y="726" font-size="19" font-weight="bold" fill="#16324F">Observed bottle path</text>
  <line x1="285" y1="732" x2="560" y2="732" stroke="#B9C6D4" stroke-width="2"/>

  <!-- Bare card -->
  <rect x="650" y="320" width="510" height="470" rx="14" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="905" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Bare bottle</text>
  <rect x="830" y="390" width="160" height="200" fill="#F4F7FA"/>
  <rect x="888" y="402" width="34" height="22" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="865" y="424" width="90" height="150" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="865" y="452" width="90" height="72" fill="none" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="910" y="620" text-anchor="middle" font-size="15" font-style="italic" fill="#5B7186">same area, no label</text>
  <text x="680" y="672" font-size="19" font-weight="bold" fill="#16324F">Station decision</text>
  <line x1="855" y1="678" x2="1130" y2="678" stroke="#B9C6D4" stroke-width="2"/>
  <text x="680" y="726" font-size="19" font-weight="bold" fill="#16324F">Observed bottle path</text>
  <line x1="895" y1="732" x2="1130" y2="732" stroke="#B9C6D4" stroke-width="2"/>

  <text x="600" y="836" text-anchor="middle" font-size="19" font-style="italic" fill="#5B7186">Concept — the packer records what the station did with each challenge bottle</text>
</svg>
