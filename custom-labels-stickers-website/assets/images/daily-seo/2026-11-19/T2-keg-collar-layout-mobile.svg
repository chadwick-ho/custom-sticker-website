<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1260" viewBox="0 0 360 1260" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Top and side views of a keg distinguish the collar's fill field from a permanent keg mark and the brewery's approved warning location.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="360" height="1260" fill="#FEFEFC"/>
  <text x="180" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Example keg layout</text>

  <!-- Top view card -->
  <rect x="16" y="60" width="328" height="310" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Top view</text>
  <circle cx="180" cy="220" r="105" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="180" cy="220" r="52" fill="#F4F7FA" stroke="#C9B37E" stroke-width="1.5"/>
  <circle cx="180" cy="220" r="30" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1.5"/>
  <circle cx="180" cy="220" r="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="152" y="280" width="56" height="24" rx="4" fill="#FFFFFF" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="36" y="120" font-size="14" font-weight="bold" fill="#16324F">Check neck fit</text>
  <line x1="92" y1="126" x2="152" y2="192" stroke="#4A7196" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="180" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Fill-specific field</text>
  <line x1="180" y1="336" x2="180" y2="308" stroke="#4A7196" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="180" y="364" text-anchor="middle" font-size="11" font-style="italic" fill="#5B7186">collar around the fitting</text>

  <!-- Side view card -->
  <rect x="16" y="390" width="328" height="280" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="420" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Side view</text>
  <rect x="160" y="440" width="28" height="16" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="132" y="456" width="84" height="14" rx="5" fill="#9FB3C8" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="136" y="470" width="76" height="160" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="132" y="630" width="84" height="14" rx="5" fill="#9FB3C8" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="146" y="482" width="42" height="16" fill="#FFFFFF" stroke="#4A7196" stroke-width="1"/>
  <text x="30" y="486" font-size="13" font-weight="bold" fill="#16324F">Existing</text>
  <text x="30" y="502" font-size="13" font-weight="bold" fill="#16324F">perm. mark</text>
  <line x1="102" y1="492" x2="144" y2="490" stroke="#4A7196" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="146" y="540" width="60" height="42" fill="none" stroke="#6B5A2E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="222" y="548" font-size="13" font-weight="bold" fill="#16324F">Approved</text>
  <text x="222" y="564" font-size="13" font-weight="bold" fill="#16324F">warning</text>
  <text x="222" y="580" font-size="13" font-weight="bold" fill="#16324F">location</text>
  <line x1="218" y1="560" x2="208" y2="560" stroke="#4A7196" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card A: beer-specific print -->
  <rect x="16" y="690" width="328" height="240" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="180" y="722" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Beer-specific print</text>
  <rect x="36" y="742" width="288" height="62" rx="7" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <rect x="48" y="754" width="52" height="38" fill="#FFFFFF" stroke="#C9B37E" stroke-width="1"/>
  <line x1="56" y1="766" x2="92" y2="766" stroke="#6B5A2E" stroke-width="1.5"/>
  <line x1="56" y1="778" x2="86" y2="778" stroke="#6B5A2E" stroke-width="1.5"/>
  <line x1="116" y1="762" x2="310" y2="762" stroke="#6B5A2E" stroke-width="2.5"/>
  <line x1="116" y1="776" x2="290" y2="776" stroke="#6B5A2E" stroke-width="2.5"/>
  <line x1="116" y1="790" x2="300" y2="790" stroke="#6B5A2E" stroke-width="2.5"/>
  <text x="180" y="848" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E5F8A">Select the correct version</text>
  <text x="180" y="872" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">one printed version per beer</text>

  <!-- Card B: common collar -->
  <rect x="16" y="950" width="328" height="240" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="180" y="982" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Common collar</text>
  <rect x="36" y="1002" width="288" height="62" rx="7" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <line x1="50" y1="1022" x2="170" y2="1022" stroke="#6B5A2E" stroke-width="2.5"/>
  <line x1="50" y1="1036" x2="155" y2="1036" stroke="#6B5A2E" stroke-width="2.5"/>
  <line x1="50" y1="1050" x2="165" y2="1050" stroke="#6B5A2E" stroke-width="2.5"/>
  <rect x="190" y="1014" width="120" height="40" rx="5" fill="#FFFFFF" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="250" y="1040" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">fill field</text>
  <text x="180" y="1108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E5F8A">Complete and check at filling</text>
  <text x="180" y="1132" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">same stock for each fill</text>

  <text x="180" y="1230" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">Schematic — the brewery approves wording,</text>
  <text x="180" y="1246" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">attachment and warning placement</text>
</svg>
