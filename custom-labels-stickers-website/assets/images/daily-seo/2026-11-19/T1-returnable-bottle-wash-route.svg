<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A returnable glass bottle passes through service and washing. Separate outlet checks record residue on the glass and where the detached label goes.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#16324F">One returnable bottle through service and washing</text>

  <!-- Flow card 1: filled and labeled -->
  <rect x="40" y="95" width="240" height="200" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="160" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">Filled and labeled</text>
  <rect x="145" y="150" width="30" height="18" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="120" y="168" width="80" height="105" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="120" y="195" width="80" height="42" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>

  <!-- Flow card 2: in service -->
  <rect x="320" y="95" width="240" height="200" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="440" y="135" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">In service</text>
  <rect x="425" y="150" width="30" height="18" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="400" y="168" width="80" height="105" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="400" y="195" width="80" height="42" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="412" cy="180" r="3" fill="#9FB3C8"/>
  <circle cx="470" cy="250" r="3" fill="#9FB3C8"/>
  <circle cx="455" cy="176" r="3" fill="#9FB3C8"/>
  <rect x="392" y="262" width="96" height="14" fill="#9FB3C8" stroke="#4A7196" stroke-width="1.5"/>

  <!-- Flow card 3: at return -->
  <rect x="600" y="95" width="260" height="200" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="730" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">At return:</text>
  <text x="730" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">label still on?</text>
  <rect x="715" y="168" width="30" height="18" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="690" y="186" width="80" height="105" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="690" y="213" width="80" height="42" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <path d="M770,213 L782,205 L782,221 Z" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>

  <!-- Flow card 4: washer -->
  <rect x="920" y="95" width="240" height="200" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="1040" y="128" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Operator&#8217;s</text>
  <text x="1040" y="152" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">wash cycle</text>
  <rect x="970" y="170" width="140" height="90" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="985" y1="182" x2="985" y2="205" stroke="#2E5F8A" stroke-width="3"/>
  <line x1="1040" y1="182" x2="1040" y2="205" stroke="#2E5F8A" stroke-width="3"/>
  <line x1="1095" y1="182" x2="1095" y2="205" stroke="#2E5F8A" stroke-width="3"/>
  <circle cx="985" cy="222" r="4" fill="#2E5F8A"/>
  <circle cx="1040" cy="232" r="4" fill="#2E5F8A"/>
  <circle cx="1095" cy="222" r="4" fill="#2E5F8A"/>

  <!-- Flow arrows -->
  <line x1="284" y1="195" x2="316" y2="195" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="564" y1="195" x2="596" y2="195" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="864" y1="195" x2="916" y2="195" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Unwashed reference, kept aside -->
  <rect x="40" y="320" width="240" height="95" rx="12" fill="#FFFFFF" stroke="#7A94A8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="56" y="352" font-size="16" font-weight="bold" fill="#16324F">Unwashed</text>
  <text x="56" y="372" font-size="16" font-weight="bold" fill="#16324F">reference</text>
  <rect x="213" y="332" width="14" height="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="200" y="342" width="40" height="58" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="200" y="358" width="40" height="20" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <line x1="160" y1="295" x2="160" y2="318" stroke="#7A94A8" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- Branch split from washer -->
  <line x1="1040" y1="295" x2="1040" y2="360" stroke="#4A7196" stroke-width="3"/>
  <line x1="1040" y1="360" x2="330" y2="424" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="1040" y1="360" x2="880" y2="424" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <text x="520" y="405" font-size="17" font-style="italic" fill="#5B7186">bottle outlet</text>
  <text x="920" y="400" font-size="17" font-style="italic" fill="#5B7186">collection path</text>

  <!-- Left outlet panel: clean bottle -->
  <rect x="40" y="430" width="560" height="390" rx="14" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="320" y="474" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Clean-bottle outlet</text>
  <rect x="298" y="492" width="34" height="20" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="270" y="512" width="90" height="120" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="285" y1="525" x2="285" y2="620" stroke="#FFFFFF" stroke-width="4" opacity="0.7"/>
  <text x="320" y="672" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Any label or adhesive left?</text>
  <line x1="130" y1="712" x2="510" y2="712" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="130" y1="750" x2="510" y2="750" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="130" y1="788" x2="510" y2="788" stroke="#B9C6D4" stroke-width="2"/>

  <!-- Right outlet panel: collection point -->
  <rect x="640" y="430" width="520" height="390" rx="14" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="900" y="474" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Collection point</text>
  <rect x="805" y="560" width="190" height="50" rx="6" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="830" y="500" width="95" height="34" rx="4" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2" transform="rotate(-10 877 517)"/>
  <rect x="940" y="522" width="30" height="18" rx="3" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5" transform="rotate(14 955 531)"/>
  <rect x="815" y="540" width="24" height="14" rx="3" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5" transform="rotate(-20 827 547)"/>
  <text x="900" y="672" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Where did the label go?</text>
  <line x1="720" y1="712" x2="1080" y2="712" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="720" y1="750" x2="1080" y2="750" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="720" y1="788" x2="1080" y2="788" stroke="#B9C6D4" stroke-width="2"/>

  <text x="600" y="856" text-anchor="middle" font-size="19" font-style="italic" fill="#5B7186">Concept diagram — the washer operator fills the blank fields under its own trial</text>
</svg>
