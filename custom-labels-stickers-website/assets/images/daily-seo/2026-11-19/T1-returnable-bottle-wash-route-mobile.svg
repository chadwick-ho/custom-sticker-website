<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1300" viewBox="0 0 360 1300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A returnable glass bottle passes through service and washing. Separate outlet checks record residue on the glass and where the detached label goes.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="360" height="1300" fill="#FEFEFC"/>
  <text x="180" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">One returnable bottle</text>
  <text x="180" y="58" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">through service and washing</text>

  <!-- Card 1: filled and labeled -->
  <rect x="16" y="80" width="236" height="140" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="134" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Filled and labeled</text>
  <rect x="123" y="120" width="22" height="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="104" y="132" width="60" height="76" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="104" y="152" width="60" height="30" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>

  <!-- Unwashed reference, aside -->
  <rect x="260" y="80" width="84" height="140" rx="10" fill="#FFFFFF" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="302" y="104" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">Unwashed</text>
  <text x="302" y="119" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">reference</text>
  <rect x="294" y="128" width="16" height="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1"/>
  <rect x="285" y="138" width="34" height="66" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1"/>
  <rect x="285" y="156" width="34" height="22" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1"/>

  <line x1="134" y1="220" x2="134" y2="238" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Card 2: in service -->
  <rect x="16" y="242" width="236" height="140" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="134" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">In service</text>
  <rect x="123" y="282" width="22" height="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="104" y="294" width="60" height="76" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="104" y="314" width="60" height="30" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <circle cx="113" cy="302" r="2.5" fill="#9FB3C8"/>
  <circle cx="156" cy="362" r="2.5" fill="#9FB3C8"/>
  <rect x="98" y="364" width="72" height="10" fill="#9FB3C8" stroke="#4A7196" stroke-width="1"/>

  <line x1="134" y1="382" x2="134" y2="398" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Card 3: at return -->
  <rect x="16" y="402" width="236" height="140" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="134" y="426" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">At return:</text>
  <text x="134" y="444" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">label still on?</text>
  <rect x="123" y="456" width="22" height="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="104" y="468" width="60" height="66" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="104" y="488" width="60" height="28" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <path d="M164,488 L173,482 L173,494 Z" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>

  <line x1="134" y1="542" x2="134" y2="558" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Card 4: washer -->
  <rect x="16" y="562" width="236" height="150" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="134" y="590" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Operator&#8217;s wash cycle</text>
  <rect x="74" y="606" width="120" height="80" rx="7" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <line x1="92" y1="616" x2="92" y2="636" stroke="#2E5F8A" stroke-width="2.5"/>
  <line x1="134" y1="616" x2="134" y2="636" stroke="#2E5F8A" stroke-width="2.5"/>
  <line x1="176" y1="616" x2="176" y2="636" stroke="#2E5F8A" stroke-width="2.5"/>
  <circle cx="92" cy="650" r="3.5" fill="#2E5F8A"/>
  <circle cx="134" cy="658" r="3.5" fill="#2E5F8A"/>
  <circle cx="176" cy="650" r="3.5" fill="#2E5F8A"/>

  <!-- Branch split -->
  <line x1="134" y1="712" x2="134" y2="735" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="134" y1="735" x2="352" y2="735" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="170" y1="735" x2="170" y2="758" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <polyline points="352,735 352,1030 346,1030" fill="none" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="186" y="752" font-size="11" font-style="italic" fill="#5B7186">bottle outlet</text>
  <text x="272" y="728" font-size="11" font-style="italic" fill="#5B7186">collection path</text>

  <!-- Outlet card 1: clean bottle -->
  <rect x="16" y="764" width="328" height="230" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="180" y="792" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Clean-bottle outlet</text>
  <rect x="163" y="806" width="26" height="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="140" y="820" width="72" height="92" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <line x1="152" y1="830" x2="152" y2="902" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
  <text x="180" y="938" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Any label or adhesive left?</text>
  <line x1="56" y1="960" x2="304" y2="960" stroke="#B9C6D4" stroke-width="1.5"/>
  <line x1="56" y1="978" x2="304" y2="978" stroke="#B9C6D4" stroke-width="1.5"/>

  <!-- Outlet card 2: collection point -->
  <rect x="16" y="1018" width="328" height="230" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="180" y="1046" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Collection point</text>
  <rect x="110" y="1110" width="140" height="36" rx="5" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="1.5"/>
  <rect x="128" y="1068" width="76" height="26" rx="3" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5" transform="rotate(-9 166 1081)"/>
  <rect x="215" y="1085" width="24" height="14" rx="2" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1" transform="rotate(13 227 1092)"/>
  <rect x="105" y="1096" width="18" height="11" rx="2" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1" transform="rotate(-18 114 1101)"/>
  <text x="180" y="1182" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Where did the label go?</text>
  <line x1="56" y1="1204" x2="304" y2="1204" stroke="#B9C6D4" stroke-width="1.5"/>
  <line x1="56" y1="1222" x2="304" y2="1222" stroke="#B9C6D4" stroke-width="1.5"/>

  <text x="180" y="1278" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">Concept diagram — blank fields recorded</text>
  <text x="180" y="1294" text-anchor="middle" font-size="12" font-style="italic" fill="#5B7186">by the washer operator</text>
</svg>
