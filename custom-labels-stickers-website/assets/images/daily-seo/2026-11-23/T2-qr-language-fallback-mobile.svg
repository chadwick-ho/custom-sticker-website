<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 860" font-family="Arial,Helvetica,sans-serif">
  <rect width="360" height="860" fill="#FFFFFF"/>
  <style>
    .t{font:700 19px Arial;fill:#16324F}
    .pt{font:700 14px Arial;fill:#16324F}
    .lb{font:11px Arial;fill:#16324F}
    .sm{font:10px Arial;fill:#4A6278}
    .gn{font:700 11px Arial;fill:#16324F}
    .acc{font:700 12px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="20" y="32">Illustrative language paths</text>
  <text class="sm" x="20" y="52">One printed code, same product.</text>
  <text class="sm" x="20" y="66">Square placeholder is not scannable.</text>

  <!-- pack -->
  <text class="pt" x="180" y="96" text-anchor="middle">Pack — one printed code</text>
  <g>
    <polygon points="120,112 220,112 238,98 138,98" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
    <polygon points="220,112 220,214 238,200 238,98" fill="#C4D6E4" stroke="#5B7186" stroke-width="1.2"/>
    <rect x="120" y="112" width="100" height="102" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
    <rect x="148" y="128" width="44" height="44" fill="#16324F"/>
    <text class="sm" x="170" y="192" text-anchor="middle">Printed QR</text>
    <text class="sm" x="170" y="204" text-anchor="middle">placeholder</text>
  </g>

  <!-- route down to English card -->
  <line x1="180" y1="216" x2="180" y2="252" stroke="#5B7186" stroke-width="2"/>
  <polygon points="175,250 180,260 185,250" fill="#5B7186"/>
  <text class="sm" x="196" y="242">decode → approved destination</text>

  <!-- English default card -->
  <rect x="56" y="264" width="294" height="150" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="80" y="292">English default</text>
  <g>
    <rect x="84" y="308" width="30" height="13" rx="2" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.1"/>
    <rect x="88" y="321" width="22" height="8" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.1"/>
    <path d="M88,329 L64,341 L64,388 Q64,394 70,394 L128,394 Q134,394 134,388 L134,341 L110,329 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.1"/>
    <rect x="80" y="356" width="38" height="14" fill="none" stroke="#9A5B12" stroke-width="1.1" stroke-dasharray="3 2"/>
  </g>
  <rect x="170" y="310" width="104" height="28" rx="14" fill="#DCE8F2" stroke="#8FA9BE"/>
  <text class="gn" x="222" y="328" text-anchor="middle">Same SKU</text>
  <text class="sm" x="170" y="362">approved product page</text>
  <text class="sm" x="170" y="376">language: English</text>
  <text class="sm" x="170" y="396">first landing on a matching</text>
  <text class="sm" x="170" y="409">preference</text>

  <!-- manual switch -->
  <g stroke="#2E5F8A" stroke-width="2" fill="none">
    <line x1="170" y1="418" x2="170" y2="474"/>
    <polygon points="165,426 170,418 175,426" fill="#2E5F8A" stroke="none"/>
    <polygon points="165,466 170,474 175,466" fill="#2E5F8A" stroke="none"/>
  </g>
  <text class="gn" x="188" y="442">Switch language</text>
  <text class="gn" x="188" y="456">when available</text>

  <!-- Español card -->
  <rect x="56" y="478" width="294" height="150" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="80" y="506">Español</text>
  <g>
    <rect x="84" y="522" width="30" height="13" rx="2" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.1"/>
    <rect x="88" y="535" width="22" height="8" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.1"/>
    <path d="M88,543 L64,555 L64,602 Q64,608 70,608 L128,608 Q134,608 134,602 L134,555 L110,543 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.1"/>
    <rect x="80" y="570" width="38" height="14" fill="none" stroke="#9A5B12" stroke-width="1.1" stroke-dasharray="3 2"/>
  </g>
  <rect x="170" y="524" width="104" height="28" rx="14" fill="#DCE8F2" stroke="#8FA9BE"/>
  <text class="gn" x="222" y="542" text-anchor="middle">Same SKU</text>
  <text class="sm" x="170" y="576">same product page,</text>
  <text class="sm" x="170" y="590">language: Español</text>
  <text class="sm" x="170" y="610">manual selection keeps</text>
  <text class="sm" x="170" y="623">the product</text>

  <!-- fallback boxes with left-margin arrows up to English card -->
  <text class="pt" x="60" y="664">Fallback → English default</text>
  <rect x="56" y="676" width="294" height="40" rx="8" fill="#F7FAFC" stroke="#B07514" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="lb" x="203" y="700" text-anchor="middle">Unsupported preference</text>
  <rect x="56" y="728" width="294" height="40" rx="8" fill="#F7FAFC" stroke="#B07514" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text class="lb" x="203" y="752" text-anchor="middle">Spanish page unavailable</text>

  <g stroke="#B07514" stroke-width="1.6" fill="none" stroke-dasharray="5 4">
    <path d="M56,696 L38,696 L38,410 L54,410"/>
    <path d="M56,748 L22,748 L22,396 L54,396"/>
  </g>
  <polygon points="52,404 58,410 52,416" fill="#B07514"/>
  <polygon points="52,390 58,396 52,402" fill="#B07514"/>
  <text class="sm" x="64" y="430">to English default</text>
</svg>
