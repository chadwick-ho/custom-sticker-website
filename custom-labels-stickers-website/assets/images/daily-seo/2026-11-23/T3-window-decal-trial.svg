<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .gn{font:700 12px Arial;fill:#16324F}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">Illustrative decal trial</text>
  <text class="sm" x="40" y="68">Both samples on the same glass, same viewing side and same campaign steps. No residue, reuse or compatibility outcome implied.</text>

  <!-- shared glass condition -->
  <rect x="40" y="96" width="230" height="188" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="155" y="122" text-anchor="middle">Same glass and side</text>
  <rect x="90" y="136" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.6"/>
  <line x1="102" y1="136" x2="102" y2="246" stroke="#C4D6E4" stroke-width="4"/>
  <line x1="206" y1="136" x2="206" y2="246" stroke="#C4D6E4" stroke-width="4"/>
  <rect x="125" y="161" width="60" height="60" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="sm" x="155" y="272" text-anchor="middle">viewing side fixed</text>

  <!-- step headers -->
  <text class="pt" x="435" y="130" text-anchor="middle">1 · Install</text>
  <text class="pt" x="745" y="130" text-anchor="middle">2 · Cold, condensation, wipe</text>
  <text class="pt" x="1035" y="130" text-anchor="middle">3 · Remove and inspect</text>

  <!-- lane A label -->
  <text class="pt" x="155" y="330" text-anchor="middle">Static cling</text>
  <text class="sm" x="155" y="352" text-anchor="middle">same decal,</text>
  <text class="sm" x="155" y="366" text-anchor="middle">same pane area</text>
  <!-- lane B label -->
  <text class="pt" x="155" y="540" text-anchor="middle">Removable</text>
  <text class="pt" x="155" y="558" text-anchor="middle">adhesive</text>
  <text class="sm" x="155" y="582" text-anchor="middle">same decal,</text>
  <text class="sm" x="155" y="596" text-anchor="middle">same pane area</text>

  <!-- lane A step cells -->
  <g>
    <rect x="300" y="150" width="270" height="240" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <rect x="370" y="180" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="405" y="205" width="60" height="60" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="335" y1="235" x2="395" y2="235" stroke="#5B7186" stroke-width="2"/>
    <polygon points="393,229 407,235 393,241" fill="#5B7186"/>
    <text class="sm" x="435" y="330" text-anchor="middle">approved method,</text>
    <text class="sm" x="435" y="346" text-anchor="middle">documented</text>
  </g>
  <g>
    <rect x="610" y="150" width="270" height="240" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <rect x="680" y="180" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="715" y="205" width="60" height="60" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="5 4"/>
    <path d="M696,200 q6,10 0,20 q-6,10 0,20" fill="none" stroke="#2E5F8A" stroke-width="1.6"/>
    <path d="M706,196 q6,10 0,20 q-6,10 0,20" fill="none" stroke="#2E5F8A" stroke-width="1.6"/>
    <line x1="700" y1="288" x2="790" y2="288" stroke="#5B7186" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="788,282 802,288 788,294" fill="#5B7186"/>
    <text class="sm" x="745" y="330" text-anchor="middle">cold or condensation period</text>
    <text class="sm" x="745" y="346" text-anchor="middle">plus routine wipe-down</text>
  </g>
  <g>
    <rect x="900" y="150" width="270" height="240" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <rect x="970" y="180" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <path d="M1005,205 L1065,205 L1065,240 L1040,240 Q1020,240 1005,225 Z" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="1000" y1="230" x2="985" y2="215" stroke="#5B7186" stroke-width="2"/>
    <polygon points="981,219 978,207 990,211" fill="#5B7186"/>
    <circle cx="1045" cy="270" r="14" fill="none" stroke="#5B7186" stroke-width="2"/>
    <line x1="1055" y1="280" x2="1068" y2="293" stroke="#5B7186" stroke-width="2.4"/>
    <text class="sm" x="1035" y="330" text-anchor="middle">staff remove,</text>
    <text class="sm" x="1035" y="346" text-anchor="middle">inspect glass after cleanup</text>
  </g>

  <!-- lane B step cells -->
  <g>
    <rect x="300" y="420" width="270" height="240" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <rect x="370" y="450" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="405" y="475" width="60" height="60" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="335" y1="505" x2="395" y2="505" stroke="#5B7186" stroke-width="2"/>
    <polygon points="393,499 407,505 393,511" fill="#5B7186"/>
    <text class="sm" x="435" y="600" text-anchor="middle">approved method,</text>
    <text class="sm" x="435" y="616" text-anchor="middle">documented</text>
  </g>
  <g>
    <rect x="610" y="420" width="270" height="240" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <rect x="680" y="450" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="715" y="475" width="60" height="60" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="5 4"/>
    <path d="M696,470 q6,10 0,20 q-6,10 0,20" fill="none" stroke="#2E5F8A" stroke-width="1.6"/>
    <path d="M706,466 q6,10 0,20 q-6,10 0,20" fill="none" stroke="#2E5F8A" stroke-width="1.6"/>
    <line x1="700" y1="558" x2="790" y2="558" stroke="#5B7186" stroke-width="2" stroke-dasharray="6 4"/>
    <polygon points="788,552 802,558 788,564" fill="#5B7186"/>
    <text class="sm" x="745" y="600" text-anchor="middle">cold or condensation period</text>
    <text class="sm" x="745" y="616" text-anchor="middle">plus routine wipe-down</text>
  </g>
  <g>
    <rect x="900" y="420" width="270" height="240" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <rect x="970" y="450" width="130" height="110" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <path d="M1005,475 L1065,475 L1065,510 L1040,510 Q1020,510 1005,495 Z" fill="#DCE8F2" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="1000" y1="500" x2="985" y2="485" stroke="#5B7186" stroke-width="2"/>
    <polygon points="981,489 978,477 990,481" fill="#5B7186"/>
    <circle cx="1045" cy="540" r="14" fill="none" stroke="#5B7186" stroke-width="2"/>
    <line x1="1055" y1="550" x2="1068" y2="563" stroke="#5B7186" stroke-width="2.4"/>
    <text class="sm" x="1035" y="600" text-anchor="middle">staff remove,</text>
    <text class="sm" x="1035" y="616" text-anchor="middle">inspect glass after cleanup</text>
  </g>

  <!-- shared checkpoint -> optional reuse -->
  <circle cx="1035" cy="695" r="7" fill="#F0E7C8" stroke="#B07514" stroke-width="1.6"/>
  <line x1="1035" y1="660" x2="1035" y2="688" stroke="#B07514" stroke-width="1.8"/>
  <line x1="1035" y1="390" x2="1035" y2="420" stroke="#B07514" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="1035" y1="702" x2="1035" y2="736" stroke="#B07514" stroke-width="1.8"/>
  <polygon points="1029,734 1035,748 1041,734" fill="#B07514"/>
  <rect x="905" y="752" width="260" height="46" rx="23" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
  <text class="acc" x="1035" y="781" text-anchor="middle">If reuse is planned</text>
  <rect x="905" y="812" width="260" height="52" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="gn" x="1035" y="843" text-anchor="middle">Store and reapply</text>

  <text class="sm" x="40" y="830">Only for a candidate the buyer intends to reuse — record approval</text>
  <text class="sm" x="40" y="846">only for the tested material and cycle.</text>
</svg>
