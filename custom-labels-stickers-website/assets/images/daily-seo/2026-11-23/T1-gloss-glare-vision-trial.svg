<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .gn{font:700 12px Arial;fill:#16324F}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">Illustrative trial</text>
  <text class="sm" x="40" y="68">Same bottle, artwork and inspection task in every cell. Finishes and lighting are the only variables. No settings or results shown.</text>

  <!-- column headers -->
  <text class="pt" x="430" y="116" text-anchor="middle">Current light</text>
  <text class="pt" x="930" y="116" text-anchor="middle">Alternate light</text>

  <!-- row labels -->
  <text class="pt" x="105" y="270" text-anchor="middle">Gloss</text>
  <text class="pt" x="105" y="525" text-anchor="middle">Gloss with</text>
  <text class="pt" x="105" y="543" text-anchor="middle">matte area</text>

  <!-- grid cells -->
  <g fill="#F7FAFC" stroke="#B9C6D4">
    <rect x="200" y="140" width="460" height="250" rx="8"/>
    <rect x="700" y="140" width="460" height="250" rx="8"/>
    <rect x="200" y="410" width="460" height="250" rx="8"/>
    <rect x="700" y="410" width="460" height="250" rx="8"/>
  </g>

  <!-- bottle: gloss, current light -->
  <g>
    <rect x="405" y="160" width="50" height="22" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="412" y="182" width="36" height="12" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <path d="M412,194 L368,214 L368,352 Q368,362 378,362 L482,362 Q492,362 492,352 L492,214 L448,194 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="402" y="216" width="14" height="120" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="385" y="262" width="90" height="30" fill="none" stroke="#9A5B12" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="gn" x="430" y="282" text-anchor="middle">LOT</text>
  </g>
  <!-- bottle: gloss, alternate light -->
  <g>
    <rect x="905" y="160" width="50" height="22" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="912" y="182" width="36" height="12" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <path d="M912,194 L868,214 L868,352 Q868,362 878,362 L982,362 Q992,362 992,352 L992,214 L948,194 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="902" y="216" width="14" height="120" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="885" y="262" width="90" height="30" fill="none" stroke="#9A5B12" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="gn" x="930" y="282" text-anchor="middle">LOT</text>
  </g>
  <!-- bottle: gloss + matte area, current light -->
  <g>
    <rect x="405" y="430" width="50" height="22" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="412" y="452" width="36" height="12" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <path d="M412,464 L368,484 L368,622 Q368,632 378,632 L482,632 Q492,632 492,622 L492,484 L448,464 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="402" y="486" width="14" height="56" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="402" y="576" width="14" height="40" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="370" y="512" width="120" height="64" fill="#F0E7C8" fill-opacity="0.55" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="4 4"/>
    <rect x="385" y="532" width="90" height="30" fill="#F7FAFC" stroke="#9A5B12" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="gn" x="430" y="552" text-anchor="middle">LOT</text>
    <text class="sm" x="430" y="592" text-anchor="middle">matte area (placement)</text>
  </g>
  <!-- bottle: gloss + matte area, alternate light -->
  <g>
    <rect x="905" y="430" width="50" height="22" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="912" y="452" width="36" height="12" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <path d="M912,464 L868,484 L868,622 Q868,632 878,632 L982,632 Q992,632 992,622 L992,484 L948,464 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="902" y="486" width="14" height="56" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="902" y="576" width="14" height="40" rx="7" fill="#FFFFFF" opacity="0.65"/>
    <rect x="870" y="512" width="120" height="64" fill="#F0E7C8" fill-opacity="0.55" stroke="#9A5B12" stroke-width="1.4" stroke-dasharray="4 4"/>
    <rect x="885" y="532" width="90" height="30" fill="#F7FAFC" stroke="#9A5B12" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text class="gn" x="930" y="552" text-anchor="middle">LOT</text>
    <text class="sm" x="930" y="592" text-anchor="middle">matte area (placement)</text>
  </g>

  <!-- sample and log cards -->
  <text class="pt" x="200" y="706">Samples and logs — the same cards apply to every cell</text>

  <g>
    <rect x="200" y="724" width="200" height="112" rx="8" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.4"/>
    <text class="gn" x="300" y="752" text-anchor="middle">Known good</text>
    <rect x="282" y="766" width="36" height="46" rx="6" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="289" y="784" width="22" height="12" fill="none" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="410" y1="780" x2="452" y2="780" stroke="#5B7186" stroke-width="2"/>
    <polygon points="452,774 466,780 452,786" fill="#5B7186"/>
    <rect x="472" y="724" width="180" height="112" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <text class="acc" x="562" y="752" text-anchor="middle">False rejects</text>
    <g stroke="#B9C6D4" stroke-width="2">
      <line x1="500" y1="772" x2="624" y2="772"/>
      <line x1="500" y1="790" x2="624" y2="790"/>
      <line x1="500" y1="808" x2="624" y2="808"/>
    </g>
  </g>
  <g>
    <rect x="700" y="724" width="200" height="112" rx="8" fill="#F0E7C8" stroke="#B07514" stroke-width="1.4"/>
    <text class="gn" x="800" y="752" text-anchor="middle">Known defect</text>
    <rect x="782" y="766" width="36" height="46" rx="6" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="789" y="784" width="22" height="12" fill="none" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="910" y1="780" x2="952" y2="780" stroke="#5B7186" stroke-width="2"/>
    <polygon points="952,774 966,780 952,786" fill="#5B7186"/>
    <rect x="972" y="724" width="188" height="112" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <text class="acc" x="1066" y="752" text-anchor="middle">Missed defects</text>
    <g stroke="#B9C6D4" stroke-width="2">
      <line x1="1000" y1="772" x2="1132" y2="772"/>
      <line x1="1000" y1="790" x2="1132" y2="790"/>
      <line x1="1000" y1="808" x2="1132" y2="808"/>
    </g>
  </g>

  <text class="sm" x="200" y="862">Quality identifies each sample without the camera. Log the good and defective groups separately for every cell.</text>
</svg>
