<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1300" font-family="Arial,Helvetica,sans-serif">
  <rect width="360" height="1300" fill="#FFFFFF"/>
  <style>
    .t{font:700 19px Arial;fill:#16324F}
    .pt{font:700 14px Arial;fill:#16324F}
    .lb{font:11px Arial;fill:#16324F}
    .sm{font:10px Arial;fill:#4A6278}
    .gn{font:700 11px Arial;fill:#16324F}
    .acc{font:700 12px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="20" y="34">Illustrative rotation trial</text>
  <text class="sm" x="20" y="54">Internal date on a reusable container.</text>
  <text class="sm" x="20" y="68">Flow only — no cleanliness claim.</text>

  <!-- shared steps -->
  <rect x="40" y="84" width="280" height="104" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="gn" x="180" y="110" text-anchor="middle">Apply and enter date</text>
  <path d="M120,126 L240,126 L233,166 L127,166 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
  <rect x="117" y="121" width="126" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="155" y="140" width="50" height="18" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="sm" x="180" y="153" text-anchor="middle">date</text>

  <line x1="180" y1="188" x2="180" y2="214" stroke="#5B7186" stroke-width="1.8"/>
  <polygon points="175,212 180,222 185,212" fill="#5B7186"/>

  <rect x="40" y="222" width="280" height="104" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="gn" x="180" y="248" text-anchor="middle">Store and handle</text>
  <path d="M120,264 L240,264 L233,304 L127,304 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
  <rect x="117" y="259" width="126" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="155" y="278" width="50" height="18" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M262,268 q4,7 0,14 q-4,7 0,14" fill="none" stroke="#2E5F8A" stroke-width="1.4"/>

  <line x1="180" y1="326" x2="180" y2="352" stroke="#5B7186" stroke-width="1.8"/>
  <polygon points="175,350 180,360 185,350" fill="#5B7186"/>

  <rect x="40" y="360" width="280" height="118" rx="8" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
  <text class="gn" x="180" y="386" text-anchor="middle">Read old date</text>
  <path d="M120,402 L240,402 L233,442 L127,442 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
  <rect x="117" y="397" width="126" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="155" y="416" width="50" height="18" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="256" cy="424" r="11" fill="none" stroke="#5B7186" stroke-width="1.6"/>
  <line x1="264" y1="432" x2="272" y2="440" stroke="#5B7186" stroke-width="2"/>
  <text class="sm" x="180" y="466" text-anchor="middle">last read before removal</text>

  <!-- branch into removal routes -->
  <g stroke="#5B7186" stroke-width="1.8" fill="none">
    <line x1="180" y1="478" x2="180" y2="500"/>
    <line x1="180" y1="500" x2="90" y2="540"/>
    <line x1="180" y1="500" x2="270" y2="540"/>
  </g>
  <polygon points="84,532 92,544 77,543" fill="#5B7186"/>
  <polygon points="276,532 283,544 268,542" fill="#5B7186"/>

  <rect x="15" y="500" width="330" height="420" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="180" y="904" text-anchor="middle">Assigned removal route</text>

  <rect x="35" y="548" width="135" height="330" rx="8" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.3"/>
  <text class="gn" x="102" y="574" text-anchor="middle">Peel,</text>
  <text class="gn" x="102" y="589" text-anchor="middle">then wash</text>
  <path d="M55,610 L145,610 L139,648 L61,648 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.3"/>
  <rect x="52" y="605" width="96" height="9" rx="3" fill="#C4D6E4" stroke="#5B7186" stroke-width="1.1"/>
  <path d="M70,622 L100,622 L100,638 L90,638 Q82,638 76,631 Z" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="68" y1="618" x2="58" y2="608" stroke="#5B7186" stroke-width="1.6"/>
  <polygon points="55,611 52,601 62,605" fill="#5B7186"/>
  <g stroke="#2E5F8A" stroke-width="1.4" fill="none">
    <path d="M70,700 q7,9 0,18 q-7,9 0,18"/>
    <path d="M90,696 q7,9 0,18 q-7,9 0,18"/>
    <path d="M110,700 q7,9 0,18 q-7,9 0,18"/>
  </g>
  <text class="sm" x="102" y="776" text-anchor="middle">assigned person</text>
  <text class="sm" x="102" y="790" text-anchor="middle">removes label,</text>
  <text class="sm" x="102" y="804" text-anchor="middle">then the normal</text>
  <text class="sm" x="102" y="818" text-anchor="middle">wash runs</text>
  <text class="sm" x="102" y="846" text-anchor="middle">route A</text>

  <rect x="190" y="548" width="135" height="330" rx="8" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.3"/>
  <text class="gn" x="257" y="574" text-anchor="middle">Wash</text>
  <text class="gn" x="257" y="589" text-anchor="middle">with label</text>
  <path d="M210,610 L300,610 L294,648 L216,648 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.3"/>
  <rect x="207" y="605" width="96" height="9" rx="3" fill="#C4D6E4" stroke="#5B7186" stroke-width="1.1"/>
  <rect x="230" y="622" width="50" height="20" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.1" stroke-dasharray="3 3"/>
  <g stroke="#2E5F8A" stroke-width="1.4" fill="none">
    <path d="M225,700 q7,9 0,18 q-7,9 0,18"/>
    <path d="M245,696 q7,9 0,18 q-7,9 0,18"/>
    <path d="M265,700 q7,9 0,18 q-7,9 0,18"/>
  </g>
  <text class="sm" x="257" y="776" text-anchor="middle">label stays on</text>
  <text class="sm" x="257" y="790" text-anchor="middle">through the</text>
  <text class="sm" x="257" y="804" text-anchor="middle">approved wash</text>
  <text class="sm" x="257" y="818" text-anchor="middle">program</text>
  <text class="sm" x="257" y="846" text-anchor="middle">route B</text>

  <!-- merge to inspection -->
  <g stroke="#5B7186" stroke-width="1.8" fill="none">
    <line x1="90" y1="878" x2="90" y2="920"/>
    <line x1="270" y1="878" x2="270" y2="920"/>
    <line x1="90" y1="920" x2="180" y2="948"/>
    <line x1="270" y1="920" x2="180" y2="948"/>
  </g>
  <polygon points="174,943 180,954 186,943" fill="#5B7186"/>

  <rect x="40" y="954" width="280" height="118" rx="8" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
  <text class="gn" x="180" y="978" text-anchor="middle">Inspect for old date</text>
  <text class="gn" x="180" y="993" text-anchor="middle">and residue</text>
  <path d="M120,1010 L240,1010 L233,1046 L127,1046 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
  <rect x="117" y="1005" width="126" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <circle cx="262" cy="1028" r="11" fill="none" stroke="#5B7186" stroke-width="1.6"/>
  <line x1="270" y1="1036" x2="278" y2="1044" stroke="#5B7186" stroke-width="2"/>
  <text class="sm" x="180" y="1064" text-anchor="middle">check the label area</text>

  <line x1="180" y1="1072" x2="180" y2="1098" stroke="#5B7186" stroke-width="1.8"/>
  <polygon points="175,1096 180,1106 185,1096" fill="#5B7186"/>

  <rect x="40" y="1106" width="280" height="118" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="gn" x="180" y="1130" text-anchor="middle">Apply and read new label</text>
  <path d="M120,1146 L240,1146 L233,1182 L127,1182 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
  <rect x="117" y="1141" width="126" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="155" y="1160" width="50" height="18" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="262" cy="1168" r="11" fill="none" stroke="#5B7186" stroke-width="1.6"/>
  <line x1="270" y1="1176" x2="278" y2="1184" stroke="#5B7186" stroke-width="2"/>
  <text class="sm" x="180" y="1204" text-anchor="middle">different test date, next cycle</text>
</svg>
