<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .gn{font:700 12px Arial;fill:#16324F}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">Illustrative rotation trial</text>
  <text class="sm" x="40" y="68">Internal date on the outside of a reusable container. Flow only — no cleanliness, dissolution or food-contact claim.</text>

  <!-- shared steps left -->
  <g>
    <rect x="40" y="150" width="270" height="120" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <text class="gn" x="175" y="178" text-anchor="middle">Apply and enter date</text>
    <path d="M120,200 L230,200 L222,246 L128,246 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="116" y="194" width="118" height="10" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="150" y="212" width="50" height="22" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text class="sm" x="175" y="227" text-anchor="middle">date</text>
  </g>
  <line x1="175" y1="270" x2="175" y2="298" stroke="#5B7186" stroke-width="2"/>
  <polygon points="170,296 175,306 180,296" fill="#5B7186"/>
  <g>
    <rect x="40" y="306" width="270" height="120" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <text class="gn" x="175" y="334" text-anchor="middle">Store and handle</text>
    <path d="M120,356 L230,356 L222,402 L128,402 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="116" y="350" width="118" height="10" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="150" y="368" width="50" height="22" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
    <path d="M250,352 q4,7 0,14 q-4,7 0,14" fill="none" stroke="#2E5F8A" stroke-width="1.4"/>
  </g>
  <line x1="175" y1="426" x2="175" y2="454" stroke="#5B7186" stroke-width="2"/>
  <polygon points="170,452 175,462 180,452" fill="#5B7186"/>
  <g>
    <rect x="40" y="462" width="270" height="130" rx="8" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
    <text class="gn" x="175" y="490" text-anchor="middle">Read old date</text>
    <path d="M120,512 L230,512 L222,558 L128,558 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="116" y="506" width="118" height="10" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="150" y="524" width="50" height="22" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
    <circle cx="216" cy="532" r="12" fill="none" stroke="#5B7186" stroke-width="1.8"/>
    <line x1="224" y1="540" x2="234" y2="550" stroke="#5B7186" stroke-width="2.2"/>
    <text class="sm" x="175" y="580" text-anchor="middle">last read before removal</text>
  </g>

  <!-- branch arrows to removal routes -->
  <g stroke="#5B7186" stroke-width="2" fill="none">
    <line x1="310" y1="500" x2="430" y2="270"/>
    <line x1="310" y1="540" x2="430" y2="700"/>
  </g>
  <polygon points="424,260 438,266 423,275" fill="#5B7186"/>
  <polygon points="423,696 437,702 422,710" fill="#5B7186"/>

  <!-- route A -->
  <g>
    <rect x="440" y="180" width="290" height="160" rx="8" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.4"/>
    <text class="gn" x="585" y="208" text-anchor="middle">Peel, then wash</text>
    <path d="M500,230 L600,230 L593,272 L507,272 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="497" y="225" width="106" height="9" rx="3" fill="#C4D6E4" stroke="#5B7186" stroke-width="1.2"/>
    <path d="M520,244 L556,244 L556,262 L544,262 Q534,262 528,255 Z" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="516" y1="240" x2="504" y2="228" stroke="#5B7186" stroke-width="1.8"/>
    <polygon points="501,231 498,220 509,224" fill="#5B7186"/>
    <g stroke="#2E5F8A" stroke-width="1.6" fill="none">
      <path d="M630,240 q8,10 0,20 q-8,10 0,20"/>
      <path d="M648,236 q8,10 0,20 q-8,10 0,20"/>
      <path d="M666,240 q8,10 0,20 q-8,10 0,20"/>
    </g>
    <text class="sm" x="585" y="306" text-anchor="middle">assigned person removes label,</text>
    <text class="sm" x="585" y="322" text-anchor="middle">then the normal wash runs</text>
  </g>

  <!-- route B -->
  <g>
    <rect x="440" y="640" width="290" height="160" rx="8" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.4"/>
    <text class="gn" x="585" y="668" text-anchor="middle">Wash with label</text>
    <path d="M500,690 L600,690 L593,732 L507,732 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="497" y="685" width="106" height="9" rx="3" fill="#C4D6E4" stroke="#5B7186" stroke-width="1.2"/>
    <rect x="525" y="706" width="50" height="22" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
    <g stroke="#2E5F8A" stroke-width="1.6" fill="none">
      <path d="M630,700 q8,10 0,20 q-8,10 0,20"/>
      <path d="M648,696 q8,10 0,20 q-8,10 0,20"/>
      <path d="M666,700 q8,10 0,20 q-8,10 0,20"/>
    </g>
    <text class="sm" x="585" y="766" text-anchor="middle">label stays on through the</text>
    <text class="sm" x="585" y="782" text-anchor="middle">approved wash program</text>
  </g>

  <!-- merge arrows -->
  <g stroke="#5B7186" stroke-width="2" fill="none">
    <line x1="730" y1="270" x2="840" y2="430"/>
    <line x1="730" y1="700" x2="840" y2="490"/>
  </g>
  <polygon points="833,421 846,433 826,434" fill="#5B7186"/>
  <polygon points="832,484 846,491 829,499" fill="#5B7186"/>

  <!-- inspection + next cycle -->
  <g>
    <rect x="850" y="380" width="310" height="160" rx="8" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
    <text class="gn" x="1005" y="408" text-anchor="middle">Inspect for old date</text>
    <text class="gn" x="1005" y="424" text-anchor="middle">and residue</text>
    <path d="M920,446 L1020,446 L1013,488 L927,488 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="917" y="441" width="106" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
    <circle cx="1060" cy="462" r="13" fill="none" stroke="#5B7186" stroke-width="1.8"/>
    <line x1="1069" y1="471" x2="1080" y2="482" stroke="#5B7186" stroke-width="2.2"/>
    <text class="sm" x="1005" y="516" text-anchor="middle">check the label area after</text>
    <text class="sm" x="1005" y="530" text-anchor="middle">the assigned removal route</text>
  </g>
  <line x1="1005" y1="540" x2="1005" y2="576" stroke="#5B7186" stroke-width="2"/>
  <polygon points="1000,574 1005,584 1010,574" fill="#5B7186"/>
  <g>
    <rect x="850" y="584" width="310" height="160" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
    <text class="gn" x="1005" y="612" text-anchor="middle">Apply and read new label</text>
    <path d="M920,634 L1020,634 L1013,676 L927,676 Z" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.4"/>
    <rect x="917" y="629" width="106" height="9" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
    <rect x="945" y="650" width="50" height="20" fill="#FFFFFF" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="1060" cy="656" r="13" fill="none" stroke="#5B7186" stroke-width="1.8"/>
    <line x1="1069" y1="665" x2="1080" y2="676" stroke="#5B7186" stroke-width="2.2"/>
    <text class="sm" x="1005" y="716" text-anchor="middle">different test date, read after</text>
    <text class="sm" x="1005" y="730" text-anchor="middle">the next handling interval</text>
  </g>
</svg>
