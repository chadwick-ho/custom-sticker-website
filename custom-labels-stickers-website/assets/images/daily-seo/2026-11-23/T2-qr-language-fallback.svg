<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" font-family="Arial,Helvetica,sans-serif">
  <rect width="1200" height="880" fill="#FFFFFF"/>
  <style>
    .t{font:700 22px Arial;fill:#16324F}
    .pt{font:700 16px Arial;fill:#16324F}
    .lb{font:12px Arial;fill:#16324F}
    .sm{font:11px Arial;fill:#4A6278}
    .gn{font:700 12px Arial;fill:#16324F}
    .acc{font:700 13px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="40" y="44">Illustrative language paths</text>
  <text class="sm" x="40" y="68">One printed code leads to the same product. The solid square is a placeholder and is not scannable.</text>

  <!-- pack -->
  <text class="pt" x="165" y="130" text-anchor="middle">Pack — one printed code</text>
  <g>
    <polygon points="80,170 240,170 265,150 105,150" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.5"/>
    <polygon points="240,170 240,320 265,300 265,150" fill="#C4D6E4" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="80" y="170" width="160" height="150" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.5"/>
    <rect x="118" y="200" width="54" height="54" fill="#16324F"/>
    <text class="sm" x="160" y="278" text-anchor="middle">Printed QR</text>
    <text class="sm" x="160" y="292" text-anchor="middle">placeholder</text>
    <text class="sm" x="160" y="310" text-anchor="middle">(not scannable)</text>
  </g>

  <!-- route arrows pack -> cards -->
  <g stroke="#5B7186" stroke-width="2" fill="none">
    <line x1="266" y1="215" x2="712" y2="278"/>
    <polygon points="713,271 732,279 713,286" fill="#5B7186" stroke="none"/>
    <line x1="266" y1="290" x2="712" y2="640"/>
    <polygon points="714,633 731,643 711,647" fill="#5B7186" stroke="none"/>
  </g>
  <text class="sm" x="470" y="200" text-anchor="middle">decode → approved destination</text>

  <!-- fallback condition boxes between the two routes -->
  <g>
    <rect x="360" y="292" width="140" height="64" rx="8" fill="#F7FAFC" stroke="#B07514" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="lb" x="430" y="319" text-anchor="middle">Unsupported</text>
    <text class="lb" x="430" y="335" text-anchor="middle">preference</text>
    <rect x="520" y="292" width="140" height="64" rx="8" fill="#F7FAFC" stroke="#B07514" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="lb" x="590" y="319" text-anchor="middle">Spanish page</text>
    <text class="lb" x="590" y="335" text-anchor="middle">unavailable</text>
  </g>
  <!-- dashed fallback arrows to the English default card -->
  <g stroke="#B07514" stroke-width="1.8" fill="none" stroke-dasharray="5 4">
    <line x1="500" y1="322" x2="700" y2="392"/>
    <line x1="660" y1="322" x2="706" y2="378"/>
  </g>
  <polygon points="701,385 716,397 696,400" fill="#B07514"/>
  <polygon points="707,371 720,382 700,384" fill="#B07514"/>
  <text class="sm" x="560" y="376">to English default</text>

  <!-- legend -->
  <g>
    <line x1="60" y1="640" x2="100" y2="640" stroke="#5B7186" stroke-width="2"/>
    <text class="sm" x="108" y="644">printed route</text>
    <line x1="60" y1="664" x2="100" y2="664" stroke="#B07514" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text class="sm" x="108" y="668">fallback to default</text>
  </g>

  <!-- English default card -->
  <rect x="720" y="140" width="440" height="280" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="756" y="178">English default</text>
  <g>
    <rect x="770" y="210" width="42" height="18" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="776" y="228" width="30" height="10" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <path d="M776,238 L742,254 L742,364 Q742,372 750,372 L832,372 Q840,372 840,364 L840,254 L806,238 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="764" y="284" width="54" height="18" fill="none" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <rect x="880" y="216" width="130" height="36" rx="18" fill="#DCE8F2" stroke="#8FA9BE"/>
  <text class="gn" x="945" y="239" text-anchor="middle">Same SKU</text>
  <text class="sm" x="880" y="286">approved product page</text>
  <text class="sm" x="880" y="304">language: English</text>
  <text class="sm" x="880" y="340">first landing on</text>
  <text class="sm" x="880" y="356">a matching preference</text>

  <!-- Español card -->
  <rect x="720" y="500" width="440" height="280" rx="10" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="756" y="538">Español</text>
  <g>
    <rect x="770" y="570" width="42" height="18" rx="3" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="776" y="588" width="30" height="10" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.3"/>
    <path d="M776,598 L742,614 L742,724 Q742,732 750,732 L832,732 Q840,732 840,724 L840,614 L806,598 Z"
          fill="#E9F1F7" stroke="#5B7186" stroke-width="1.3"/>
    <rect x="764" y="644" width="54" height="18" fill="none" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <rect x="880" y="576" width="130" height="36" rx="18" fill="#DCE8F2" stroke="#8FA9BE"/>
  <text class="gn" x="945" y="599" text-anchor="middle">Same SKU</text>
  <text class="sm" x="880" y="646">same product page,</text>
  <text class="sm" x="880" y="664">language: Español</text>
  <text class="sm" x="880" y="700">manual selection</text>
  <text class="sm" x="880" y="716">keeps the product</text>

  <!-- manual switch connector between cards -->
  <g stroke="#2E5F8A" stroke-width="2.2" fill="none">
    <line x1="1050" y1="422" x2="1050" y2="498"/>
    <polygon points="1044,428 1050,418 1056,428" fill="#2E5F8A" stroke="none"/>
    <polygon points="1044,492 1050,502 1056,492" fill="#2E5F8A" stroke="none"/>
  </g>
  <text class="gn" x="1066" y="452">Switch language</text>
  <text class="gn" x="1066" y="468">when available</text>
</svg>
