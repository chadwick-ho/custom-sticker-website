<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1120" font-family="Arial,Helvetica,sans-serif">
  <rect width="360" height="1120" fill="#FFFFFF"/>
  <style>
    .t{font:700 19px Arial;fill:#16324F}
    .pt{font:700 14px Arial;fill:#16324F}
    .lb{font:11px Arial;fill:#16324F}
    .sm{font:10px Arial;fill:#4A6278}
    .gn{font:700 11px Arial;fill:#16324F}
    .acc{font:700 12px Arial;fill:#9A5B12}
  </style>

  <text class="t" x="20" y="34">Illustrative trial</text>
  <text class="sm" x="20" y="54">Same bottle and task in every cell.</text>
  <text class="sm" x="20" y="68">No settings or results shown.</text>

  <!-- Current light panel -->
  <rect x="15" y="84" width="330" height="300" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="180" y="110" text-anchor="middle">Current light</text>

  <!-- tile: gloss -->
  <rect x="30" y="126" width="140" height="240" rx="6" fill="#FFFFFF" stroke="#B9C6D4"/>
  <text class="gn" x="100" y="146" text-anchor="middle">Gloss</text>
  <rect x="87" y="158" width="26" height="12" rx="2" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="91" y="170" width="18" height="7" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <path d="M91,177 L68,190 L68,284 Q68,291 74,291 L126,291 Q132,291 132,284 L132,190 L109,177 Z"
        fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="72" y="192" width="8" height="80" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="70" y="216" width="60" height="20" fill="none" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="gn" x="100" y="230" text-anchor="middle">LOT</text>

  <!-- tile: gloss with matte area -->
  <rect x="190" y="126" width="140" height="240" rx="6" fill="#FFFFFF" stroke="#B9C6D4"/>
  <text class="gn" x="260" y="142" text-anchor="middle">Gloss with</text>
  <text class="gn" x="260" y="155" text-anchor="middle">matte area</text>
  <rect x="247" y="164" width="26" height="12" rx="2" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="251" y="176" width="18" height="7" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <path d="M251,183 L228,196 L228,290 Q228,297 234,297 L286,297 Q292,297 292,290 L292,196 L269,183 Z"
        fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="232" y="198" width="8" height="36" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="232" y="252" width="8" height="26" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="226" y="228" width="68" height="42" fill="#F0E7C8" fill-opacity="0.55" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="230" y="240" width="60" height="20" fill="#F7FAFC" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="gn" x="260" y="254" text-anchor="middle">LOT</text>
  <text class="sm" x="260" y="316" text-anchor="middle">matte area</text>
  <text class="sm" x="260" y="328" text-anchor="middle">(placement)</text>
  <text class="sm" x="100" y="316" text-anchor="middle">same LOT field</text>
  <text class="sm" x="100" y="328" text-anchor="middle">and position</text>

  <!-- Alternate light panel -->
  <rect x="15" y="404" width="330" height="300" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="pt" x="180" y="430" text-anchor="middle">Alternate light</text>

  <rect x="30" y="446" width="140" height="240" rx="6" fill="#FFFFFF" stroke="#B9C6D4"/>
  <text class="gn" x="100" y="466" text-anchor="middle">Gloss</text>
  <rect x="87" y="478" width="26" height="12" rx="2" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="91" y="490" width="18" height="7" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <path d="M91,497 L68,510 L68,604 Q68,611 74,611 L126,611 Q132,611 132,604 L132,510 L109,497 Z"
        fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="72" y="512" width="8" height="80" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="70" y="536" width="60" height="20" fill="none" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="gn" x="100" y="550" text-anchor="middle">LOT</text>

  <rect x="190" y="446" width="140" height="240" rx="6" fill="#FFFFFF" stroke="#B9C6D4"/>
  <text class="gn" x="260" y="462" text-anchor="middle">Gloss with</text>
  <text class="gn" x="260" y="475" text-anchor="middle">matte area</text>
  <rect x="247" y="484" width="26" height="12" rx="2" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="251" y="496" width="18" height="7" fill="#DCE8F2" stroke="#5B7186" stroke-width="1.2"/>
  <path d="M251,503 L228,516 L228,610 Q228,617 234,617 L286,617 Q292,617 292,610 L292,516 L269,503 Z"
        fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="232" y="518" width="8" height="36" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="232" y="572" width="8" height="26" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="226" y="548" width="68" height="42" fill="#F0E7C8" fill-opacity="0.55" stroke="#9A5B12" stroke-width="1.2" stroke-dasharray="3 3"/>
  <rect x="230" y="560" width="60" height="20" fill="#F7FAFC" stroke="#9A5B12" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="gn" x="260" y="574" text-anchor="middle">LOT</text>
  <text class="sm" x="260" y="636" text-anchor="middle">matte area</text>
  <text class="sm" x="260" y="648" text-anchor="middle">(placement)</text>
  <text class="sm" x="100" y="636" text-anchor="middle">same LOT field</text>
  <text class="sm" x="100" y="648" text-anchor="middle">and position</text>

  <!-- sample and log cards -->
  <text class="pt" x="20" y="736">Samples and logs — apply to every cell</text>

  <rect x="20" y="754" width="150" height="96" rx="8" fill="#DCE8F2" stroke="#8FA9BE" stroke-width="1.4"/>
  <text class="gn" x="95" y="780" text-anchor="middle">Known good</text>
  <rect x="82" y="792" width="26" height="36" rx="5" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="87" y="806" width="16" height="9" fill="none" stroke="#9A5B12" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="176" y1="802" x2="196" y2="802" stroke="#5B7186" stroke-width="2"/>
  <polygon points="196,797 208,802 196,807" fill="#5B7186"/>
  <rect x="212" y="754" width="133" height="96" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="acc" x="278" y="780" text-anchor="middle">False rejects</text>
  <g stroke="#B9C6D4" stroke-width="2">
    <line x1="232" y1="798" x2="326" y2="798"/>
    <line x1="232" y1="814" x2="326" y2="814"/>
    <line x1="232" y1="830" x2="326" y2="830"/>
  </g>

  <rect x="20" y="874" width="150" height="96" rx="8" fill="#F0E7C8" stroke="#B07514" stroke-width="1.4"/>
  <text class="gn" x="95" y="900" text-anchor="middle">Known defect</text>
  <rect x="82" y="912" width="26" height="36" rx="5" fill="#E9F1F7" stroke="#5B7186" stroke-width="1.2"/>
  <rect x="87" y="926" width="16" height="9" fill="none" stroke="#9A5B12" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="176" y1="922" x2="196" y2="922" stroke="#5B7186" stroke-width="2"/>
  <polygon points="196,917 208,922 196,927" fill="#5B7186"/>
  <rect x="212" y="874" width="133" height="96" rx="8" fill="#F7FAFC" stroke="#B9C6D4"/>
  <text class="acc" x="278" y="898" text-anchor="middle">Missed defects</text>
  <g stroke="#B9C6D4" stroke-width="2">
    <line x1="232" y1="918" x2="326" y2="918"/>
    <line x1="232" y1="934" x2="326" y2="934"/>
    <line x1="232" y1="950" x2="326" y2="950"/>
  </g>

  <text class="sm" x="20" y="1004">Quality identifies each sample</text>
  <text class="sm" x="20" y="1018">without the camera.</text>
  <text class="sm" x="20" y="1032">Log the good and defective</text>
  <text class="sm" x="20" y="1046">groups separately per cell.</text>
</svg>
