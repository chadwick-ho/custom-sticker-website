<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Comparison of static vial identity, event or cumulative exposure indication and a time-stamped logger record with data still required.">
  <rect width="1200" height="700" fill="#FEFEFC"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Three kinds of evidence for a shipment</text>

  <!-- Column 1: Identity -->
  <rect x="40" y="92" width="340" height="52" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="210" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Identity</text>
  <g>
    <rect x="160" y="170" width="64" height="30" rx="6" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
    <path d="M 168 200 L 168 216 L 216 216 L 216 200" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <rect x="152" y="216" width="80" height="150" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
    <rect x="164" y="252" width="56" height="70" rx="6" fill="#FEFEFC" stroke="#B9C6D4" stroke-width="1.5"/>
    <line x1="172" y1="272" x2="212" y2="272" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="172" y1="288" x2="212" y2="288" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="172" y1="304" x2="200" y2="304" stroke="#B9C6D4" stroke-width="4"/>
    <text x="192" y="388" text-anchor="middle" font-size="13" fill="#5B7186">vial + printed label</text>
  </g>
  <rect x="60" y="410" width="300" height="80" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Static print records</text>
  <text x="210" y="464" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">no temperature</text>

  <!-- Column 2: Exposure indication -->
  <rect x="410" y="92" width="340" height="52" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="580" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Exposure indication</text>
  <rect x="430" y="170" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="580" y="204" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Defined event response</text>
  <text x="580" y="228" text-anchor="middle" font-size="13" fill="#5B7186">signals the specified event under</text>
  <text x="580" y="246" text-anchor="middle" font-size="13" fill="#5B7186">its stated conditions</text>
  <rect x="430" y="300" width="300" height="90" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="580" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Cumulative response</text>
  <text x="580" y="358" text-anchor="middle" font-size="13" fill="#5B7186">progression under stated conditions —</text>
  <text x="580" y="376" text-anchor="middle" font-size="13" fill="#5B7186">not a trip timeline</text>
  <text x="580" y="430" text-anchor="middle" font-size="13" fill="#5B7186">distinct mechanisms —</text>
  <text x="580" y="448" text-anchor="middle" font-size="13" fill="#5B7186">not interchangeable</text>

  <!-- Column 3: Time-stamped record -->
  <rect x="780" y="92" width="380" height="52" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="970" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Time-stamped record</text>
  <rect x="810" y="170" width="320" height="250" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <!-- blank axes, no data -->
  <line x1="860" y1="380" x2="860" y2="210" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT4up)"/>
  <line x1="860" y1="380" x2="1090" y2="380" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT4)"/>
  <line x1="890" y1="380" x2="890" y2="372" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="940" y1="380" x2="940" y2="372" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="990" y1="380" x2="990" y2="372" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="1040" y1="380" x2="1040" y2="372" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="860" y1="340" x2="868" y2="340" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="860" y1="300" x2="868" y2="300" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="860" y1="260" x2="868" y2="260" stroke="#4A7196" stroke-width="1.5"/>
  <text x="970" y="290" text-anchor="middle" font-size="20" font-weight="bold" fill="#5B7186">Data required</text>
  <text x="970" y="406" text-anchor="middle" font-size="12" fill="#5B7186">time</text>
  <text x="845" y="196" text-anchor="middle" font-size="12" fill="#5B7186">temperature</text>
  <text x="970" y="452" text-anchor="middle" font-size="13" fill="#5B7186">recoverable record — device-specific</text>
  <text x="970" y="470" text-anchor="middle" font-size="13" fill="#5B7186">download or live per proposal</text>

  <!-- Shared requirements strip -->
  <rect x="40" y="530" width="1120" height="56" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
  <text x="600" y="565" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Activation + location + receiving review — required for any device</text>

  <text x="600" y="655" text-anchor="middle" font-size="15" fill="#5B7186">Conceptual evidence types — no stability limit, monitoring result, pass signal or measured trace is shown</text>
  <defs>
    <marker id="arrT4" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
    <marker id="arrT4up" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
