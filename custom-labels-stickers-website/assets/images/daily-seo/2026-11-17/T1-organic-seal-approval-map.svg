<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Decision map separating ingredient evidence, certifier label review and reproduction of approved organic artwork for two example SKUs.">
  <rect width="1200" height="700" fill="#FEFEFC"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Ingredient evidence is not finished-product approval</text>

  <!-- Left: three evidence stages -->
  <rect x="40" y="84" width="500" height="66" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="290" y="110" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Ingredient evidence</text>
  <text x="290" y="133" text-anchor="middle" font-size="14" fill="#5B7186">a certificate names an ingredient</text>
  <line x1="290" y1="150" x2="290" y2="182" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1)"/>

  <rect x="40" y="182" width="500" height="78" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="290" y="208" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Finished-product + certifier label review</text>
  <text x="290" y="231" text-anchor="middle" font-size="14" fill="#5B7186">product team and accredited certifier decide category and label</text>
  <text x="290" y="249" text-anchor="middle" font-size="13" fill="#5B7186">(an ingredient certificate alone does not authorize the seal)</text>
  <line x1="290" y1="260" x2="290" y2="292" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1)"/>

  <rect x="40" y="292" width="500" height="70" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="290" y="318" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Approved artwork reproduction</text>
  <text x="290" y="341" text-anchor="middle" font-size="14" fill="#5B7186">prepress matches the approved presentation</text>

  <!-- Official file input -->
  <line x1="430" y1="392" x2="430" y2="365" stroke="#4A7196" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrT1)"/>
  <rect x="40" y="392" width="500" height="58" rx="10" fill="#F4F7FA" stroke="#4A7196" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="290" y="427" text-anchor="middle" font-size="17" fill="#16324F">Official seal file — supplied after approval</text>
  <text x="290" y="470" text-anchor="middle" font-size="13" fill="#5B7186">blank placeholder — no seal artwork is reproduced in this figure</text>

  <!-- Connector from review to per-SKU panel -->
  <line x1="540" y1="221" x2="585" y2="221" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1)"/>
  <text x="563" y="206" text-anchor="middle" font-size="12" fill="#5B7186">per SKU</text>

  <!-- Right: two same-size SKU cards -->
  <rect x="585" y="84" width="575" height="400" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="872" y="112" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Two same-size SKUs — same bottle and label size</text>

  <rect x="615" y="132" width="255" height="264" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <rect x="640" y="156" width="205" height="110" rx="6" fill="#FEFEFC" stroke="#B9C6D4" stroke-width="1.5"/>
  <line x1="660" y1="186" x2="825" y2="186" stroke="#B9C6D4" stroke-width="6"/>
  <line x1="660" y1="210" x2="825" y2="210" stroke="#B9C6D4" stroke-width="6"/>
  <line x1="660" y1="234" x2="780" y2="234" stroke="#B9C6D4" stroke-width="6"/>
  <text x="742" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">DEMO-O1</text>
  <text x="742" y="326" text-anchor="middle" font-size="15" fill="#16324F">approval assumed supplied</text>
  <text x="742" y="352" text-anchor="middle" font-size="13" fill="#5B7186">editorial premise —</text>
  <text x="742" y="370" text-anchor="middle" font-size="13" fill="#5B7186">proceed to proof match</text>

  <rect x="875" y="132" width="255" height="264" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <rect x="900" y="156" width="205" height="110" rx="6" fill="#FEFEFC" stroke="#B9C6D4" stroke-width="1.5"/>
  <line x1="920" y1="186" x2="1085" y2="186" stroke="#B9C6D4" stroke-width="6"/>
  <line x1="920" y1="210" x2="1085" y2="210" stroke="#B9C6D4" stroke-width="6"/>
  <line x1="920" y1="234" x2="1040" y2="234" stroke="#B9C6D4" stroke-width="6"/>
  <text x="1002" y="300" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">DEMO-O2</text>
  <text x="1002" y="326" text-anchor="middle" font-size="15" fill="#16324F">category + label decision</text>
  <text x="1002" y="346" text-anchor="middle" font-size="15" fill="#16324F">unresolved</text>
  <text x="1002" y="370" text-anchor="middle" font-size="13" fill="#5B7186">no seal permission —</text>
  <text x="1002" y="388" text-anchor="middle" font-size="13" fill="#5B7186">return to product team</text>

  <text x="872" y="436" text-anchor="middle" font-size="20" font-weight="bold" fill="#2E5F8A">Shared size does not share permission</text>

  <text x="600" y="660" text-anchor="middle" font-size="16" fill="#5B7186">Editorial decision map — no USDA seal, certification mark or completed approval is shown</text>
  <defs>
    <marker id="arrT1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
