<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1200" viewBox="0 0 420 1200" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Packaging scope map distinguishing vial and product-carton identity from outer-shipper transport artwork and separate purchase-order lines.">
  <rect width="420" height="1200" fill="#FEFEFC"/>
  <text x="210" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Which package does each</text>
  <text x="210" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">print request identify?</text>

  <!-- Vial -->
  <g>
    <rect x="85" y="84" width="60" height="30" rx="6" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
    <line x1="85" y1="95" x2="145" y2="95" stroke="#4A7196" stroke-width="1.5"/>
    <line x1="85" y1="105" x2="145" y2="105" stroke="#4A7196" stroke-width="1.5"/>
    <path d="M 92 114 L 92 132 L 138 132 L 138 114" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <rect x="75" y="132" width="80" height="140" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
    <rect x="88" y="162" width="54" height="72" rx="6" fill="#FEFEFC" stroke="#B9C6D4" stroke-width="1.5"/>
    <line x1="96" y1="182" x2="134" y2="182" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="96" y1="198" x2="134" y2="198" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="96" y1="214" x2="122" y2="214" stroke="#B9C6D4" stroke-width="4"/>
    <text x="115" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Vial</text>
  </g>
  <rect x="185" y="150" width="205" height="76" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <text x="287" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Product identity</text>
  <text x="287" y="204" text-anchor="middle" font-size="12" fill="#5B7186">approved artwork per SKU</text>

  <!-- Product carton -->
  <g>
    <rect x="60" y="330" width="180" height="140" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
    <line x1="60" y1="366" x2="240" y2="366" stroke="#4A7196" stroke-width="2"/>
    <rect x="80" y="384" width="140" height="66" rx="6" fill="#FEFEFC" stroke="#B9C6D4" stroke-width="1.5"/>
    <line x1="92" y1="406" x2="208" y2="406" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="92" y1="426" x2="208" y2="426" stroke="#B9C6D4" stroke-width="4"/>
    <text x="150" y="496" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Product carton</text>
  </g>
  <rect x="255" y="340" width="135" height="130" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <text x="322" y="378" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Identity layer —</text>
  <text x="322" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">not the</text>
  <text x="322" y="418" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">transport outer</text>

  <!-- Outer shipper -->
  <g>
    <rect x="60" y="530" width="300" height="160" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
    <line x1="60" y1="562" x2="360" y2="562" stroke="#4A7196" stroke-width="2"/>
    <rect x="85" y="580" width="250" height="86" rx="8" fill="#F4F7FA" stroke="#4A7196" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="210" y="610" text-anchor="middle" font-size="13" fill="#16324F">Transport marks/labels —</text>
    <text x="210" y="628" text-anchor="middle" font-size="13" fill="#16324F">shipping-owner instructions</text>
    <text x="210" y="648" text-anchor="middle" font-size="11" fill="#5B7186">blank placeholder —</text>
    <text x="210" y="662" text-anchor="middle" font-size="11" fill="#5B7186">no dangerous-goods artwork</text>
    <text x="210" y="712" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Outer shipper</text>
  </g>
  <rect x="135" y="724" width="150" height="40" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <text x="210" y="749" text-anchor="middle" font-size="13" fill="#16324F">Transport package</text>

  <!-- Route lines: vial -> PO A (left margin), shipper -> PO B (right margin), carton -> note (left margin dashed) -->
  <line x1="185" y1="188" x2="45" y2="188" stroke="#4A7196" stroke-width="2"/>
  <line x1="45" y1="188" x2="45" y2="800" stroke="#4A7196" stroke-width="2" marker-end="url(#arrT5m)"/>
  <line x1="360" y1="620" x2="400" y2="620" stroke="#4A7196" stroke-width="2"/>
  <line x1="400" y1="620" x2="400" y2="1060" stroke="#4A7196" stroke-width="2"/>
  <line x1="400" y1="1060" x2="392" y2="1060" stroke="#4A7196" stroke-width="2" marker-end="url(#arrT5m)"/>
  <line x1="60" y1="400" x2="35" y2="400" stroke="#4A7196" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="35" y1="400" x2="35" y2="944" stroke="#4A7196" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="35" y1="944" x2="38" y2="944" stroke="#4A7196" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrT5m)"/>

  <!-- PO A -->
  <rect x="30" y="800" width="350" height="96" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="205" y="832" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">PO A: vial identification print</text>
  <text x="205" y="856" text-anchor="middle" font-size="12" fill="#5B7186">approved artwork revision, actual vial,</text>
  <text x="205" y="873" text-anchor="middle" font-size="12" fill="#5B7186">quantity per design, handling</text>

  <!-- Carton note -->
  <rect x="40" y="912" width="350" height="64" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="215" y="936" text-anchor="middle" font-size="14" fill="#16324F">Carton labels named separately in the order</text>
  <text x="215" y="958" text-anchor="middle" font-size="12" fill="#5B7186">product identity, not transport marking</text>

  <!-- PO B -->
  <rect x="30" y="1010" width="360" height="100" rx="10" fill="#F4F7FA" stroke="#4A7196" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="210" y="1042" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">PO B: outer-shipper print scope</text>
  <text x="210" y="1066" text-anchor="middle" font-size="12" fill="#5B7186">shipping artwork + variable-entry plan required</text>
  <text x="210" y="1086" text-anchor="middle" font-size="12" fill="#5B7186">unreleased until shipping owner confirms</text>

  <text x="210" y="1148" text-anchor="middle" font-size="13" fill="#5B7186">Scope diagram only — not shipping instructions</text>
  <text x="210" y="1168" text-anchor="middle" font-size="13" fill="#5B7186">or approved dangerous-goods artwork</text>
  <defs>
    <marker id="arrT5m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
