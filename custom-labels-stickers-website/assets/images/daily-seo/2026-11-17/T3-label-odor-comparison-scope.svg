<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Proposed comparison objects including a label roll, inner packing, an unlabeled bottle and a labeled bottle, with separate sensory and package-safety review questions.">
  <rect width="1200" height="700" fill="#FEFEFC"/>
  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Identified comparison objects, two separate questions</text>

  <!-- Identity cards -->
  <rect x="40" y="96" width="330" height="78" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="205" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Label roll</text>
  <text x="205" y="152" text-anchor="middle" font-size="14" fill="#5B7186">identified construction</text>
  <line x1="370" y1="135" x2="515" y2="250" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>

  <rect x="40" y="196" width="330" height="78" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="205" y="228" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Inner packing</text>
  <text x="205" y="252" text-anchor="middle" font-size="14" fill="#5B7186">identified batch</text>
  <line x1="370" y1="235" x2="515" y2="265" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>

  <rect x="40" y="296" width="330" height="78" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="205" y="328" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Unlabeled bottle</text>
  <text x="205" y="352" text-anchor="middle" font-size="14" fill="#5B7186">reference — same bottle + closure</text>
  <line x1="370" y1="335" x2="515" y2="300" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>

  <rect x="40" y="396" width="330" height="78" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="205" y="428" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Labeled bottle</text>
  <text x="205" y="452" text-anchor="middle" font-size="14" fill="#5B7186">candidate — comparable assembly</text>
  <line x1="370" y1="435" x2="515" y2="315" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>

  <text x="205" y="506" text-anchor="middle" font-size="13" fill="#5B7186">Unprinted stock — include if available;</text>
  <text x="205" y="524" text-anchor="middle" font-size="13" fill="#5B7186">record gaps instead of filling rows</text>
  <text x="205" y="560" text-anchor="middle" font-size="13" font-style="italic" fill="#5B7186">arrows = review inputs, not migration paths</text>

  <!-- Central scope box -->
  <rect x="520" y="230" width="320" height="110" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="680" y="272" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Agree comparison scope</text>
  <text x="680" y="298" text-anchor="middle" font-size="14" fill="#5B7186">what changes across each pair,</text>
  <text x="680" y="318" text-anchor="middle" font-size="14" fill="#5B7186">with the assessor and quality team</text>

  <!-- Two independent questions -->
  <line x1="840" y1="265" x2="900" y2="195" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>
  <rect x="900" y="120" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="1035" y="160" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Sensory acceptance?</text>
  <text x="1035" y="186" text-anchor="middle" font-size="13" fill="#5B7186">agreed method + acceptance</text>
  <text x="1035" y="204" text-anchor="middle" font-size="13" fill="#5B7186">criterion for the item</text>

  <line x1="840" y1="305" x2="900" y2="375" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>
  <rect x="900" y="340" width="270" height="110" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="1035" y="375" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Package-safety</text>
  <text x="1035" y="397" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">assessment?</text>
  <text x="1035" y="423" text-anchor="middle" font-size="13" fill="#5B7186">assembled package — decided by</text>
  <text x="1035" y="441" text-anchor="middle" font-size="13" fill="#5B7186">the responsible quality owner</text>

  <text x="1035" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E5F8A">independent questions</text>
  <text x="1035" y="312" text-anchor="middle" font-size="13" fill="#5B7186">separate evidence</text>

  <rect x="300" y="560" width="600" height="52" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="600" y="592" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Proposed comparisons; no results</text>

  <text x="600" y="662" text-anchor="middle" font-size="15" fill="#5B7186">No diagnosed source, migration path, instrument reading or safe/unsafe verdict is shown</text>
  <defs>
    <marker id="arrT3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
