<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1120" viewBox="0 0 420 1120" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Comparison of static vial identity, event or cumulative exposure indication and a time-stamped logger record with data still required.">
  <rect width="420" height="1120" fill="#FEFEFC"/>
  <text x="210" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Three kinds of evidence</text>
  <text x="210" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">for a shipment</text>

  <!-- Identity -->
  <rect x="30" y="88" width="360" height="46" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Identity</text>
  <g>
    <rect x="100" y="152" width="60" height="28" rx="6" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
    <path d="M 108 180 L 108 196 L 152 196 L 152 180" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <rect x="92" y="196" width="76" height="140" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
    <rect x="104" y="228" width="52" height="64" rx="6" fill="#FEFEFC" stroke="#B9C6D4" stroke-width="1.5"/>
    <line x1="112" y1="246" x2="148" y2="246" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="112" y1="262" x2="148" y2="262" stroke="#B9C6D4" stroke-width="4"/>
    <line x1="112" y1="278" x2="136" y2="278" stroke="#B9C6D4" stroke-width="4"/>
    <text x="130" y="356" text-anchor="middle" font-size="12" fill="#5B7186">vial + printed label</text>
  </g>
  <rect x="200" y="160" width="190" height="176" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="295" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Static print</text>
  <text x="295" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">records no</text>
  <text x="295" y="274" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">temperature</text>

  <!-- Exposure indication -->
  <rect x="30" y="396" width="360" height="46" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="210" y="426" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Exposure indication</text>
  <rect x="30" y="456" width="175" height="120" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="117" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Defined event</text>
  <text x="117" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">response</text>
  <text x="117" y="536" text-anchor="middle" font-size="11" fill="#5B7186">signals the specified</text>
  <text x="117" y="552" text-anchor="middle" font-size="11" fill="#5B7186">event under its stated</text>
  <text x="117" y="568" text-anchor="middle" font-size="11" fill="#5B7186">conditions</text>
  <rect x="215" y="456" width="175" height="120" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="302" y="490" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Cumulative</text>
  <text x="302" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">response</text>
  <text x="302" y="536" text-anchor="middle" font-size="11" fill="#5B7186">progression under</text>
  <text x="302" y="552" text-anchor="middle" font-size="11" fill="#5B7186">stated conditions —</text>
  <text x="302" y="568" text-anchor="middle" font-size="11" fill="#5B7186">not a trip timeline</text>
  <text x="210" y="606" text-anchor="middle" font-size="12" fill="#5B7186">distinct mechanisms — not interchangeable</text>

  <!-- Time-stamped record -->
  <rect x="30" y="636" width="360" height="46" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="210" y="666" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Time-stamped record</text>
  <rect x="60" y="696" width="300" height="190" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <line x1="105" y1="850" x2="105" y2="730" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT4m)"/>
  <line x1="105" y1="850" x2="330" y2="850" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT4m)"/>
  <line x1="150" y1="850" x2="150" y2="843" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="195" y1="850" x2="195" y2="843" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="240" y1="850" x2="240" y2="843" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="285" y1="850" x2="285" y2="843" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="105" y1="815" x2="112" y2="815" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="105" y1="780" x2="112" y2="780" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="105" y1="745" x2="112" y2="745" stroke="#4A7196" stroke-width="1.5"/>
  <text x="210" y="796" text-anchor="middle" font-size="18" font-weight="bold" fill="#5B7186">Data required</text>
  <text x="210" y="874" text-anchor="middle" font-size="11" fill="#5B7186">time</text>
  <text x="92" y="716" text-anchor="middle" font-size="11" fill="#5B7186">temp</text>
  <text x="210" y="918" text-anchor="middle" font-size="12" fill="#5B7186">recoverable record — download or live per proposal</text>

  <!-- Shared requirements -->
  <rect x="30" y="948" width="360" height="74" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2.5"/>
  <text x="210" y="976" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Activation + location + receiving review</text>
  <text x="210" y="1000" text-anchor="middle" font-size="13" fill="#5B7186">required for any device</text>

  <text x="210" y="1064" text-anchor="middle" font-size="13" fill="#5B7186">Conceptual evidence types — no stability limit,</text>
  <text x="210" y="1084" text-anchor="middle" font-size="13" fill="#5B7186">result, pass signal or measured trace shown</text>
  <defs>
    <marker id="arrT4m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
