<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept handoff linking brand artwork, converter label specification and molder acceptance, with existing finished tubs routed to a separate decoration review.">
  <rect width="1200" height="810" fill="#FEFEFC"/>
  <text x="600" y="48" text-anchor="middle" font-size="32" font-weight="bold" fill="#16324F">IML: agree the handoff before ordering</text>

  <!-- Three independent parties -->
  <rect x="60" y="85" width="1080" height="195" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="600" y="118" text-anchor="middle" font-size="23" font-weight="bold" fill="#5B7186">three independent approvals — parallel inputs</text>

  <rect x="90" y="140" width="290" height="115" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="235" y="185" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Brand</text>
  <text x="235" y="218" text-anchor="middle" font-size="22" fill="#5B7186">release artwork</text>

  <rect x="455" y="140" width="290" height="115" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="600" y="185" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Converter</text>
  <text x="600" y="218" text-anchor="middle" font-size="22" fill="#5B7186">confirm label + packing</text>

  <rect x="820" y="140" width="290" height="115" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="965" y="185" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Molder</text>
  <text x="965" y="214" text-anchor="middle" font-size="22" fill="#5B7186">accept tool + label</text>
  <text x="965" y="238" text-anchor="middle" font-size="22" fill="#5B7186">specification</text>

  <!-- Converging arrows to controlled specification -->
  <line x1="235" y1="258" x2="565" y2="310" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>
  <line x1="600" y1="258" x2="600" y2="305" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>
  <line x1="965" y1="258" x2="635" y2="310" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>

  <rect x="400" y="310" width="400" height="80" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="600" y="358" text-anchor="middle" font-size="27" font-weight="bold" fill="#16324F">One controlled specification</text>

  <line x1="600" y1="390" x2="600" y2="430" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>

  <!-- In-mold sequence -->
  <rect x="45" y="432" width="1110" height="150" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="70" y="465" font-size="22" font-weight="bold" fill="#5B7186">In-mold sequence</text>

  <rect x="70" y="478" width="240" height="85" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="190" y="528" text-anchor="middle" font-size="22" fill="#16324F">Label inside mold</text>
  <line x1="310" y1="520" x2="348" y2="520" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>

  <rect x="350" y="478" width="240" height="85" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="470" y="528" text-anchor="middle" font-size="22" fill="#16324F">Container molding</text>
  <line x1="590" y1="520" x2="628" y2="520" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>

  <rect x="630" y="478" width="240" height="85" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="750" y="512" text-anchor="middle" font-size="22" fill="#16324F">Identified molded</text>
  <text x="750" y="538" text-anchor="middle" font-size="22" fill="#16324F">sample</text>
  <line x1="870" y1="520" x2="908" y2="520" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2)"/>

  <rect x="910" y="478" width="225" height="85" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="1022" y="528" text-anchor="middle" font-size="22" fill="#16324F">Release decision</text>

  <!-- Detached existing-stock route -->
  <rect x="60" y="625" width="1080" height="125" rx="14" fill="#FBF6EA" stroke="#C9B37E" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="85" y="658" font-size="22" font-weight="bold" fill="#6B5A2E">Separate existing-stock route — not part of IML</text>

  <rect x="150" y="672" width="300" height="60" rx="10" fill="#FFFFFF" stroke="#8A7A4A" stroke-width="2"/>
  <text x="300" y="709" text-anchor="middle" font-size="22" fill="#16324F">Finished empty tubs</text>
  <line x1="450" y1="702" x2="600" y2="702" stroke="#8A7A4A" stroke-width="2.5" marker-end="url(#arrT2b)"/>
  <rect x="605" y="672" width="370" height="60" rx="10" fill="#FFFFFF" stroke="#8A7A4A" stroke-width="2"/>
  <text x="790" y="709" text-anchor="middle" font-size="22" fill="#16324F">Post-mold decoration review</text>

  <text x="600" y="788" text-anchor="middle" font-size="20" font-style="italic" fill="#5B7186">Process concept; no approved sample shown</text>

  <defs>
    <marker id="arrT2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
    <marker id="arrT2b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#8A7A4A"/>
    </marker>
  </defs>
</svg>
