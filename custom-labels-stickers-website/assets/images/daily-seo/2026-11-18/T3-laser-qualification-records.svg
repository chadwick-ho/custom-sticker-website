<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept distinction between toner printing and inline laser marking, with equipment, finished construction, marked sample and release records.">
  <rect width="1200" height="810" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#16324F">Which laser process?</text>

  <!-- Two independent processes -->
  <rect x="60" y="95" width="530" height="140" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="325" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Toner printing</text>
  <text x="325" y="180" text-anchor="middle" font-size="23" fill="#5B7186">toner applied to</text>
  <text x="325" y="210" text-anchor="middle" font-size="23" fill="#5B7186">compatible media</text>

  <rect x="610" y="95" width="530" height="140" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="875" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Inline laser marking</text>
  <text x="875" y="180" text-anchor="middle" font-size="23" fill="#5B7186">laser interacts with</text>
  <text x="875" y="210" text-anchor="middle" font-size="23" fill="#5B7186">specified material</text>

  <text x="600" y="272" text-anchor="middle" font-size="22" font-style="italic" fill="#5B7186">independent processes — not interchangeable</text>

  <!-- Qualification records -->
  <text x="600" y="325" text-anchor="middle" font-size="28" font-weight="bold" fill="#16324F">Qualification records</text>

  <rect x="60" y="350" width="530" height="105" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="325" y="392" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Equipment reference</text>
  <text x="325" y="426" text-anchor="middle" font-size="23" fill="#5B7186">model + laser type</text>

  <rect x="610" y="350" width="530" height="105" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="875" y="392" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Finished construction</text>
  <text x="875" y="426" text-anchor="middle" font-size="23" fill="#5B7186">face + preprint + protection</text>

  <line x1="325" y1="458" x2="545" y2="505" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>
  <line x1="875" y1="458" x2="655" y2="505" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>

  <rect x="350" y="508" width="500" height="95" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="600" y="550" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Identified marked sample</text>
  <text x="600" y="580" text-anchor="middle" font-size="23" fill="#5B7186">trial + observations</text>

  <line x1="600" y1="603" x2="600" y2="645" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3)"/>

  <rect x="400" y="648" width="400" height="95" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="600" y="690" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Owner decision</text>
  <text x="600" y="720" text-anchor="middle" font-size="23" fill="#5B7186">accepted scope or hold</text>

  <text x="600" y="785" text-anchor="middle" font-size="20" font-style="italic" fill="#5B7186">No settings or results shown</text>

  <defs>
    <marker id="arrT3" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
