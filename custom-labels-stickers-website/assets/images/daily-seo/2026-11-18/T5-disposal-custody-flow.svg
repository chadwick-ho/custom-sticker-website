<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept custody flow for obsolete branded labels, distinguishing collected stock from documented final disposition and separately retained references.">
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#16324F">Before stock leaves controlled custody</text>

  <!-- Authorization review at top -->
  <rect x="430" y="85" width="340" height="80" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="600" y="133" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Authorization review</text>

  <!-- Branch arrows: left to retained references, right to disposal chain -->
  <line x1="500" y1="165" x2="255" y2="208" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5)"/>
  <line x1="700" y1="165" x2="960" y2="201" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5)"/>

  <!-- Detached retained-references branch -->
  <rect x="60" y="210" width="380" height="225" rx="14" fill="#FBF6EA" stroke="#C9B37E" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="250" y="242" text-anchor="middle" font-size="20" font-weight="bold" fill="#6B5A2E">separate — outside</text>
  <text x="250" y="264" text-anchor="middle" font-size="20" font-weight="bold" fill="#6B5A2E">the disposal quantity</text>

  <rect x="90" y="280" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#8A7A4A" stroke-width="2"/>
  <text x="250" y="316" text-anchor="middle" font-size="23" font-weight="bold" fill="#16324F">Retained references</text>
  <line x1="250" y1="338" x2="250" y2="362" stroke="#8A7A4A" stroke-width="2.5" marker-end="url(#arrT5b)"/>
  <rect x="90" y="365" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#8A7A4A" stroke-width="2"/>
  <text x="250" y="401" text-anchor="middle" font-size="23" font-weight="bold" fill="#16324F">Named custodian</text>

  <!-- Main disposal chain (right column) -->
  <rect x="760" y="205" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="960" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Authorized disposal</text>
  <text x="960" y="264" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">stock</text>
  <line x1="960" y1="285" x2="960" y2="318" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5)"/>

  <rect x="760" y="322" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="960" y="360" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Controlled custody</text>
  <line x1="960" y1="402" x2="960" y2="435" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5)"/>

  <rect x="760" y="438" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="960" y="470" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Collected</text>
  <text x="960" y="497" text-anchor="middle" font-size="20" fill="#5B7186">pickup record</text>

  <!-- Dashed link: completion evidence required; label sits left of the arrow -->
  <line x1="960" y1="518" x2="960" y2="562" stroke="#8A7A4A" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrT5b)"/>
  <text x="930" y="548" text-anchor="end" font-size="20" font-style="italic" fill="#6B5A2E">Completion evidence required</text>

  <rect x="760" y="568" width="400" height="85" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="960" y="605" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Final disposition</text>
  <text x="960" y="633" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">documented</text>

  <line x1="760" y1="610" x2="728" y2="610" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5)"/>

  <rect x="340" y="568" width="380" height="85" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="530" y="605" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Match records +</text>
  <text x="530" y="633" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">resolve exceptions</text>

  <!-- Open exception branch -->
  <line x1="530" y1="653" x2="530" y2="700" stroke="#8A7A4A" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrT5b)"/>
  <rect x="340" y="705" width="380" height="80" rx="12" fill="#FBF6EA" stroke="#C9B37E" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="530" y="740" text-anchor="middle" font-size="23" font-weight="bold" fill="#6B5A2E">Unmatched item:</text>
  <text x="530" y="766" text-anchor="middle" font-size="23" font-weight="bold" fill="#6B5A2E">keep open</text>

  <text x="600" y="845" text-anchor="middle" font-size="22" font-style="italic" font-weight="bold" fill="#2E5F8A">Collection is not completion</text>

  <defs>
    <marker id="arrT5" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
    <marker id="arrT5b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#8A7A4A"/>
    </marker>
  </defs>
</svg>
