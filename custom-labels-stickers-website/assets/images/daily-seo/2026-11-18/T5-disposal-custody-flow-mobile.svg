<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept custody flow for obsolete branded labels, distinguishing collected stock from documented final disposition and separately retained references.">
  <rect width="360" height="900" fill="#FEFEFC"/>
  <text x="180" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Before stock leaves</text>
  <text x="180" y="54" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">controlled custody</text>

  <!-- Authorization review -->
  <rect x="30" y="75" width="300" height="70" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="180" y="117" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Authorization review</text>

  <!-- Two branches -->
  <line x1="90" y1="145" x2="90" y2="180" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5m)"/>
  <line x1="267" y1="145" x2="267" y2="180" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5m)"/>

  <!-- Left: detached retained-references branch -->
  <rect x="10" y="185" width="160" height="205" rx="10" fill="#FBF6EA" stroke="#C9B37E" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="90" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B5A2E">separate — outside</text>
  <text x="90" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#6B5A2E">disposal quantity</text>

  <rect x="20" y="238" width="140" height="58" rx="8" fill="#FFFFFF" stroke="#8A7A4A" stroke-width="2"/>
  <text x="90" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Retained</text>
  <text x="90" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">references</text>
  <line x1="90" y1="296" x2="90" y2="316" stroke="#8A7A4A" stroke-width="2.5" marker-end="url(#arrT5mb)"/>
  <rect x="20" y="320" width="140" height="58" rx="8" fill="#FFFFFF" stroke="#8A7A4A" stroke-width="2"/>
  <text x="90" y="344" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Named</text>
  <text x="90" y="364" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">custodian</text>

  <!-- Right: main disposal chain -->
  <rect x="190" y="185" width="160" height="75" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="270" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Authorized</text>
  <text x="270" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">disposal stock</text>
  <line x1="270" y1="260" x2="270" y2="288" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5m)"/>

  <rect x="190" y="292" width="160" height="75" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="270" y="319" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Controlled</text>
  <text x="270" y="339" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">custody</text>
  <line x1="270" y1="367" x2="270" y2="395" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5m)"/>

  <rect x="190" y="400" width="160" height="75" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="270" y="427" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Collected</text>
  <text x="270" y="449" text-anchor="middle" font-size="13" fill="#5B7186">pickup record</text>

  <!-- Dashed link: completion evidence required; label sits right of the arrow -->
  <line x1="240" y1="475" x2="240" y2="505" stroke="#8A7A4A" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrT5mb)"/>
  <text x="252" y="487" text-anchor="start" font-size="13" font-style="italic" fill="#6B5A2E">Completion</text>
  <text x="252" y="502" text-anchor="start" font-size="13" font-style="italic" fill="#6B5A2E">evidence required</text>

  <rect x="30" y="512" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="180" y="542" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Final disposition</text>
  <text x="180" y="564" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">documented</text>

  <line x1="180" y1="587" x2="180" y2="618" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT5m)"/>

  <rect x="30" y="622" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="180" y="652" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Match records +</text>
  <text x="180" y="674" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">resolve exceptions</text>

  <line x1="180" y1="697" x2="180" y2="728" stroke="#8A7A4A" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrT5mb)"/>

  <rect x="55" y="733" width="250" height="72" rx="10" fill="#FBF6EA" stroke="#C9B37E" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="180" y="762" text-anchor="middle" font-size="15" font-weight="bold" fill="#6B5A2E">Unmatched item:</text>
  <text x="180" y="784" text-anchor="middle" font-size="15" font-weight="bold" fill="#6B5A2E">keep open</text>

  <text x="180" y="855" text-anchor="middle" font-size="14" font-style="italic" font-weight="bold" fill="#2E5F8A">Collection is not completion</text>

  <defs>
    <marker id="arrT5m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
    <marker id="arrT5mb" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#8A7A4A"/>
    </marker>
  </defs>
</svg>
