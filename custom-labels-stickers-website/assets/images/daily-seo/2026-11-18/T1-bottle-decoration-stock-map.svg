<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept comparison of direct bottle ink and a separate adhesive label, showing which undecorated and decorated stocks carry an artwork version.">
  <rect width="1200" height="800" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#16324F">Same bottle reference + artwork revision</text>

  <!-- Left construction: direct screen print -->
  <rect x="60" y="95" width="525" height="375" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="322" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Direct screen print</text>
  <rect x="105" y="225" width="435" height="80" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="322" y="273" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Bottle wall</text>
  <rect x="105" y="305" width="435" height="60" fill="#2E5F8A" stroke="#2E5F8A" stroke-width="2"/>
  <text x="322" y="342" text-anchor="middle" font-size="24" fill="#FFFFFF">Direct ink</text>

  <!-- Right construction: separate adhesive label -->
  <rect x="615" y="95" width="525" height="375" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="877" y="140" text-anchor="middle" font-size="26" font-weight="bold" fill="#16324F">Separate adhesive label</text>
  <rect x="660" y="165" width="435" height="80" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="877" y="213" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Bottle wall</text>
  <rect x="660" y="245" width="435" height="42" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="877" y="273" text-anchor="middle" font-size="23" fill="#6B5A2E">Adhesive</text>
  <rect x="660" y="287" width="435" height="42" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="877" y="315" text-anchor="middle" font-size="23" fill="#16324F">Face material</text>
  <rect x="660" y="329" width="435" height="42" fill="#9FB3C8" stroke="#4A7196" stroke-width="2"/>
  <text x="877" y="357" text-anchor="middle" font-size="23" fill="#16324F">Printed layer</text>
  <rect x="660" y="371" width="435" height="42" fill="#FFFFFF" stroke="#7A94A8" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="877" y="399" text-anchor="middle" font-size="23" font-style="italic" fill="#5B7186">Optional protection</text>

  <text x="600" y="497" text-anchor="middle" font-size="22" font-style="italic" fill="#5B7186">Simplified layers; confirm actual construction</text>

  <!-- Independent stock states -->
  <text x="600" y="555" text-anchor="middle" font-size="28" font-weight="bold" fill="#16324F">Stock at the next revision</text>

  <rect x="60" y="580" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="230" y="622" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Plain bottles</text>
  <text x="230" y="652" text-anchor="middle" font-size="22" fill="#5B7186">no old printed identity</text>

  <rect x="430" y="580" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="600" y="622" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Decorated bottles</text>
  <text x="600" y="652" text-anchor="middle" font-size="22" fill="#5B7186">old copy present</text>

  <rect x="800" y="580" width="340" height="100" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="970" y="622" text-anchor="middle" font-size="25" font-weight="bold" fill="#16324F">Unapplied labels</text>
  <text x="970" y="652" text-anchor="middle" font-size="22" fill="#5B7186">old copy present</text>

  <text x="600" y="712" text-anchor="middle" font-size="22" font-style="italic" fill="#5B7186">independent stock states — not a production sequence</text>
  <text x="600" y="748" text-anchor="middle" font-size="24" font-weight="bold" fill="#2E5F8A">Rework requires its own acceptance</text>

  <text x="600" y="785" text-anchor="middle" font-size="20" fill="#5B7186">Concept comparison; neither route shown as superior</text>
</svg>
