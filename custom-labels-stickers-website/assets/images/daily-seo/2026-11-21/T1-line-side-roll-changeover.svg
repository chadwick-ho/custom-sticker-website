<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Old and new label rolls join at a line-side splicer before the sensor and applicator, with affected products held for review.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#16324F">Line-side changeover: joining two rolls at the machine</text>

  <!-- Old roll -->
  <text x="140" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">OLD ROLL</text>
  <text x="140" y="132" text-anchor="middle" font-size="12" fill="#5B7186">nearly empty</text>
  <circle cx="140" cy="205" r="60" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="140" cy="205" r="16" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <line x1="140" y1="145" x2="140" y2="265" stroke="#2E5F8A" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="205" x2="200" y2="205" stroke="#2E5F8A" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="200" y1="205" x2="445" y2="315" stroke="#4A7196" stroke-width="5" marker-end="url(#arr)"/>
  <text x="300" y="222" font-size="14" fill="#16324F">old roll tail</text>

  <!-- New roll -->
  <text x="140" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">NEW ROLL</text>
  <text x="140" y="490" text-anchor="middle" font-size="12" fill="#5B7186">staged and prepared</text>
  <circle cx="140" cy="560" r="60" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="140" cy="560" r="16" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="105" y="516" width="70" height="18" rx="4" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1"/>
  <text x="140" y="529" text-anchor="middle" font-size="11" fill="#5B7186">leader</text>
  <line x1="200" y1="560" x2="445" y2="405" stroke="#4A7196" stroke-width="5" marker-end="url(#arr)"/>
  <text x="290" y="525" font-size="14" fill="#16324F">new roll leader</text>
  <text x="290" y="545" font-size="11" fill="#5B7186">blank leader per equipment</text>

  <!-- Splice unit -->
  <rect x="445" y="300" width="190" height="120" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="540" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">LINE-SIDE</text>
  <text x="540" y="358" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">SPLICE</text>
  <rect x="505" y="372" width="70" height="18" rx="4" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="540" y="385" text-anchor="middle" font-size="11" fill="#16324F">join zone</text>
  <text x="540" y="442" text-anchor="middle" font-size="12" fill="#5B7186">made at the packaging line</text>

  <!-- Joined web with labels -->
  <line x1="635" y1="360" x2="1010" y2="360" stroke="#4A7196" stroke-width="5"/>
  <rect x="662" y="342" width="52" height="20" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="730" y="342" width="52" height="20" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="798" y="342" width="52" height="20" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="760" y="330" text-anchor="middle" font-size="12" fill="#5B7186">joined web continues</text>

  <!-- Sensor -->
  <circle cx="895" cy="360" r="24" fill="#F4F7FA" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="895" cy="360" r="7" fill="#2E5F8A"/>
  <text x="895" y="310" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">SENSOR</text>
  <text x="895" y="412" text-anchor="middle" font-size="11" fill="#5B7186">response set by</text>
  <text x="895" y="427" text-anchor="middle" font-size="11" fill="#5B7186">the line owner</text>

  <!-- Applicator -->
  <rect x="1020" y="300" width="70" height="110" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="1035" y1="320" x2="1075" y2="390" stroke="#4A7196" stroke-width="3"/>
  <text x="1055" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">APPLICATOR</text>
  <text x="1055" y="296" text-anchor="middle" font-size="11" fill="#5B7186">dispensing edge</text>
  <line x1="1055" y1="410" x2="1055" y2="500" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Conveyor and products -->
  <line x1="830" y1="615" x2="1160" y2="615" stroke="#B9C6D4" stroke-width="4"/>
  <rect x="862" y="552" width="54" height="62" rx="8" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="870" y="568" width="38" height="18" rx="2" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="946" y="552" width="54" height="62" rx="8" fill="#FFFFFF" stroke="#C9B37E" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="954" y="568" width="38" height="18" rx="2" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <rect x="1030" y="552" width="54" height="62" rx="8" fill="#FFFFFF" stroke="#C9B37E" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="1038" y="568" width="38" height="18" rx="2" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <rect x="1114" y="552" width="54" height="62" rx="8" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="1122" y="568" width="38" height="18" rx="2" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="1010" y="640" text-anchor="middle" font-size="12" fill="#5B7186">products around the join = affected interval</text>

  <!-- Hold box -->
  <line x1="1010" y1="655" x2="1010" y2="688" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="780" y="694" width="390" height="72" rx="12" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="975" y="724" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">IDENTIFY AND HOLD AFFECTED PRODUCTS</text>
  <text x="975" y="748" text-anchor="middle" font-size="12" fill="#5B7186">interval and disposition agreed with the line owner</text>

  <!-- Footnote -->
  <rect x="40" y="795" width="1120" height="62" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="600" y="821" text-anchor="middle" font-size="13" fill="#16324F">A different event: a converter splice can sit inside a delivered roll and is handled by the incoming-roll agreement.</text>
  <text x="600" y="843" text-anchor="middle" font-size="13" fill="#5B7186">Concept diagram only &#8212; detection, rejection and hold behavior are not assumed to be installed.</text>
</svg>
