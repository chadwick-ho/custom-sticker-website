<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Two label-roll routes compare matrix removal before overprinting with removal afterward at an agreed finishing station.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#F0E7C8"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#C9B37E" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#16324F">When does the waste matrix come off?</text>

  <!-- Legend: web cross-section -->
  <rect x="40" y="90" width="1120" height="105" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="70" y="122" font-size="14" font-weight="bold" fill="#16324F">web</text>
  <text x="70" y="140" font-size="14" font-weight="bold" fill="#16324F">cross-section</text>
  <rect x="210" y="152" width="640" height="20" fill="#E8EDF2" stroke="#B9C6D4" stroke-width="1.5"/>
  <rect x="210" y="124" width="40" height="28" fill="url(#hatch)" stroke="#C9B37E" stroke-width="1.5"/>
  <rect x="250" y="124" width="90" height="28" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="340" y="124" width="50" height="28" fill="url(#hatch)" stroke="#C9B37E" stroke-width="1.5"/>
  <rect x="390" y="124" width="90" height="28" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="480" y="124" width="50" height="28" fill="url(#hatch)" stroke="#C9B37E" stroke-width="1.5"/>
  <rect x="530" y="124" width="90" height="28" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="620" y="124" width="230" height="28" fill="url(#hatch)" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="295" y="112" font-size="13" fill="#16324F">label</text>
  <line x1="295" y1="116" x2="295" y2="122" stroke="#5B7186" stroke-width="1.5"/>
  <text x="700" y="112" font-size="13" fill="#16324F">waste matrix</text>
  <line x1="700" y1="116" x2="700" y2="122" stroke="#5B7186" stroke-width="1.5"/>
  <text x="880" y="168" font-size="13" fill="#16324F">liner</text>
  <line x1="874" y1="162" x2="852" y2="162" stroke="#5B7186" stroke-width="1.5"/>
  <text x="920" y="140" font-size="11" fill="#5B7186">matrix = surrounding face</text>
  <text x="920" y="156" font-size="11" fill="#5B7186">material after kiss-cut</text>

  <!-- Route A -->
  <rect x="40" y="215" width="1120" height="235" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="70" y="250" font-size="17" font-weight="bold" fill="#16324F">ROUTE A &#8212; strip matrix before overprint</text>

  <circle cx="115" cy="335" r="36" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="115" cy="335" r="11" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="115" y="405" text-anchor="middle" font-size="12" fill="#5B7186">die-cut roll</text>

  <line x1="155" y1="335" x2="200" y2="335" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="205" y="300" width="135" height="70" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="222" y="312" width="42" height="16" fill="url(#hatch)" stroke="#C9B37E" stroke-width="1"/>
  <path d="M 264 318 L 296 306" stroke="#C9B37E" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="272" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">STRIP</text>
  <text x="272" y="396" text-anchor="middle" font-size="11" fill="#5B7186">before overprint</text>

  <line x1="345" y1="335" x2="390" y2="335" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>

  <line x1="395" y1="340" x2="485" y2="340" stroke="#B9C6D4" stroke-width="8"/>
  <rect x="400" y="316" width="36" height="18" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="444" y="316" width="36" height="18" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="440" y="396" text-anchor="middle" font-size="11" fill="#5B7186">labels on liner only</text>

  <line x1="490" y1="335" x2="535" y2="335" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="540" y="300" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="620" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">OVERPRINT</text>
  <text x="620" y="350" text-anchor="middle" font-size="11" fill="#5B7186">full bleed possible</text>
  <text x="620" y="396" text-anchor="middle" font-size="11" fill="#5B7186">past the edge can reach liner</text>

  <line x1="705" y1="335" x2="945" y2="335" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>
  <text x="825" y="322" text-anchor="middle" font-size="11" fill="#5B7186">finished roll</text>

  <rect x="950" y="300" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="1025" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">FINAL</text>
  <text x="1025" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">APPLICATOR</text>
  <text x="1025" y="396" text-anchor="middle" font-size="11" fill="#5B7186">intended machine</text>

  <!-- Route B -->
  <rect x="40" y="480" width="1120" height="235" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="70" y="515" font-size="17" font-weight="bold" fill="#16324F">ROUTE B &#8212; retain matrix through overprint</text>

  <circle cx="115" cy="600" r="36" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="115" cy="600" r="11" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="115" y="670" text-anchor="middle" font-size="12" fill="#5B7186">die-cut roll</text>

  <line x1="155" y1="600" x2="200" y2="600" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="205" y="565" width="155" height="70" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="218" y="577" width="50" height="16" fill="url(#hatch)" stroke="#C9B37E" stroke-width="1"/>
  <rect x="270" y="577" width="30" height="16" rx="2" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1"/>
  <text x="282" y="616" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">OVERPRINT</text>
  <text x="282" y="661" text-anchor="middle" font-size="11" fill="#5B7186">matrix still on the web</text>

  <line x1="365" y1="600" x2="410" y2="600" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>

  <rect x="415" y="565" width="195" height="70" rx="10" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="512" y="592" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">CONFIRM STRIPPING</text>
  <text x="512" y="612" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">STATION + OWNER</text>
  <text x="512" y="661" text-anchor="middle" font-size="11" fill="#5B7186">a real station must exist</text>
  <text x="512" y="678" text-anchor="middle" font-size="11" fill="#5B7186">and be agreed first</text>

  <line x1="615" y1="600" x2="660" y2="600" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>

  <line x1="665" y1="605" x2="750" y2="605" stroke="#B9C6D4" stroke-width="8"/>
  <rect x="670" y="581" width="36" height="18" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="712" y="581" width="36" height="18" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="707" y="661" text-anchor="middle" font-size="11" fill="#5B7186">matrix removed</text>

  <line x1="755" y1="600" x2="945" y2="600" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>
  <text x="850" y="587" text-anchor="middle" font-size="11" fill="#5B7186">finished roll</text>

  <rect x="950" y="565" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="1025" y="593" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">FINAL</text>
  <text x="1025" y="615" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">APPLICATOR</text>
  <text x="1025" y="661" text-anchor="middle" font-size="11" fill="#5B7186">intended machine</text>

  <!-- Footnote -->
  <rect x="40" y="755" width="1120" height="100" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="600" y="787" text-anchor="middle" font-size="13" fill="#16324F">Either route works only if the print, stripping and dispensing equipment handle the actual construction.</text>
  <text x="600" y="811" text-anchor="middle" font-size="13" fill="#5B7186">Whether a retained-matrix roll can be supplied, and who removes it, is a project question &#8212; no finishing service is implied.</text>
  <text x="600" y="835" text-anchor="middle" font-size="13" fill="#5B7186">Concept diagram only &#8212; not a production route, press capability or accepted result.</text>
</svg>
