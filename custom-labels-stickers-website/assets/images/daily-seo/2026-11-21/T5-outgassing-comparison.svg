<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A controlled comparison records bubbles immediately and later on containers of different known ages, with trapped air and outgassing shown as hypotheses.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="bold" fill="#16324F">A controlled comparison, not a diagnosis</text>

  <!-- conditions strip -->
  <rect x="190" y="80" width="820" height="56" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="600" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">same container spec &#183; same label construction &#183; same application &#183; agreed conditions</text>

  <!-- column headers -->
  <text x="510" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Immediately after application</text>
  <text x="945" y="176" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Later agreed observation</text>

  <!-- Group A row -->
  <rect x="40" y="200" width="245" height="175" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="162" y="258" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">GROUP A</text>
  <text x="162" y="288" text-anchor="middle" font-size="13" fill="#5B7186">shorter interval</text>
  <text x="162" y="308" text-anchor="middle" font-size="13" fill="#5B7186">since molding</text>
  <text x="162" y="344" text-anchor="middle" font-size="12" fill="#16324F">known molding time</text>

  <rect x="300" y="200" width="430" height="175" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="330" y="245" width="26" height="14" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="322" y="259" width="44" height="78" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="329" y="282" width="30" height="26" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="390" y="225" width="315" height="130" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="547" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">photograph + record</text>
  <line x1="425" y1="282" x2="670" y2="282" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="425" y1="306" x2="670" y2="306" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="425" y1="330" x2="610" y2="330" stroke="#B9C6D4" stroke-width="2"/>

  <rect x="730" y="200" width="430" height="175" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="760" y="245" width="26" height="14" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="752" y="259" width="44" height="78" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="759" y="282" width="30" height="26" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="820" y="225" width="315" height="130" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="977" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">photograph + record</text>
  <line x1="855" y1="282" x2="1100" y2="282" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="855" y1="306" x2="1100" y2="306" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="855" y1="330" x2="1040" y2="330" stroke="#B9C6D4" stroke-width="2"/>

  <!-- Group B row -->
  <rect x="40" y="395" width="245" height="175" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="162" y="453" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">GROUP B</text>
  <text x="162" y="483" text-anchor="middle" font-size="13" fill="#5B7186">longer interval</text>
  <text x="162" y="503" text-anchor="middle" font-size="13" fill="#5B7186">since molding</text>
  <text x="162" y="539" text-anchor="middle" font-size="12" fill="#16324F">known molding time</text>

  <rect x="300" y="395" width="430" height="175" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="330" y="440" width="26" height="14" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="322" y="454" width="44" height="78" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="329" y="477" width="30" height="26" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="390" y="420" width="315" height="130" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="547" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">photograph + record</text>
  <line x1="425" y1="477" x2="670" y2="477" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="425" y1="501" x2="670" y2="501" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="425" y1="525" x2="610" y2="525" stroke="#B9C6D4" stroke-width="2"/>

  <rect x="730" y="395" width="430" height="175" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="760" y="440" width="26" height="14" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="752" y="454" width="44" height="78" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="759" y="477" width="30" height="26" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="820" y="420" width="315" height="130" rx="10" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="977" y="451" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">photograph + record</text>
  <line x1="855" y1="477" x2="1100" y2="477" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="855" y1="501" x2="1100" y2="501" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="855" y1="525" x2="1040" y2="525" stroke="#B9C6D4" stroke-width="2"/>

  <text x="600" y="600" text-anchor="middle" font-size="12" fill="#5B7186">cells hold agreed observations, not predicted results</text>

  <!-- Hypotheses -->
  <rect x="120" y="630" width="350" height="90" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="295" y="664" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">TRAPPED AIR?</text>
  <text x="295" y="690" text-anchor="middle" font-size="12" fill="#5B7186">consider when bubbles are seen immediately</text>

  <rect x="730" y="630" width="350" height="90" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="905" y="664" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">POSSIBLE OUTGASSING?</text>
  <text x="905" y="690" text-anchor="middle" font-size="12" fill="#5B7186">one hypothesis among others for later change</text>

  <line x1="330" y1="720" x2="520" y2="766" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="870" y1="720" x2="680" y2="766" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="430" y="770" width="340" height="66" rx="12" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="600" y="797" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">BOTH REQUIRE INVESTIGATION</text>
  <text x="600" y="819" text-anchor="middle" font-size="11" fill="#5B7186">agree the next comparison before reordering</text>

  <text x="600" y="862" text-anchor="middle" font-size="12" fill="#5B7186">Timing alone does not prove cause or gas composition &#8212; illustrative trial design, not a measured result.</text>
</svg>
