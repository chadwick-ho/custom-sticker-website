<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1420" viewBox="0 0 360 1420" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A controlled comparison records bubbles immediately and later on containers of different known ages, with trapped air and outgassing shown as hypotheses.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="360" height="1420" fill="#FEFEFC"/>
  <text x="180" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">A controlled comparison,</text>
  <text x="180" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">not a diagnosis</text>

  <!-- conditions strip -->
  <rect x="16" y="78" width="328" height="92" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="180" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">same container spec &#183; same label</text>
  <text x="180" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">construction &#183; same application</text>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#5B7186">agreed conditions for every group</text>

  <!-- Group A -->
  <rect x="16" y="190" width="328" height="430" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">GROUP A</text>
  <text x="180" y="244" text-anchor="middle" font-size="11" fill="#5B7186">shorter interval since molding</text>
  <text x="180" y="264" text-anchor="middle" font-size="11" fill="#16324F">known molding time</text>

  <rect x="36" y="286" width="288" height="148" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Immediately after application</text>
  <rect x="60" y="340" width="24" height="12" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="53" y="352" width="40" height="66" rx="9" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="60" y="373" width="26" height="22" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="110" y="330" width="196" height="90" rx="8" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="208" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">photograph +</text>
  <text x="208" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">record</text>
  <line x1="128" y1="392" x2="288" y2="392" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="128" y1="408" x2="288" y2="408" stroke="#B9C6D4" stroke-width="2"/>

  <rect x="36" y="452" width="288" height="148" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Later agreed observation</text>
  <rect x="60" y="506" width="24" height="12" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="53" y="518" width="40" height="66" rx="9" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="60" y="539" width="26" height="22" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="110" y="496" width="196" height="90" rx="8" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="208" y="520" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">photograph +</text>
  <text x="208" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">record</text>
  <line x1="128" y1="558" x2="288" y2="558" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="128" y1="574" x2="288" y2="574" stroke="#B9C6D4" stroke-width="2"/>

  <!-- Group B -->
  <rect x="16" y="640" width="328" height="430" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="672" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">GROUP B</text>
  <text x="180" y="694" text-anchor="middle" font-size="11" fill="#5B7186">longer interval since molding</text>
  <text x="180" y="714" text-anchor="middle" font-size="11" fill="#16324F">known molding time</text>

  <rect x="36" y="736" width="288" height="148" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="762" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Immediately after application</text>
  <rect x="60" y="790" width="24" height="12" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="53" y="802" width="40" height="66" rx="9" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="60" y="823" width="26" height="22" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="110" y="780" width="196" height="90" rx="8" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="208" y="804" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">photograph +</text>
  <text x="208" y="820" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">record</text>
  <line x1="128" y1="842" x2="288" y2="842" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="128" y1="858" x2="288" y2="858" stroke="#B9C6D4" stroke-width="2"/>

  <rect x="36" y="902" width="288" height="148" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="928" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Later agreed observation</text>
  <rect x="60" y="956" width="24" height="12" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="53" y="968" width="40" height="66" rx="9" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="60" y="989" width="26" height="22" rx="3" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="110" y="946" width="196" height="90" rx="8" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="208" y="970" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">photograph +</text>
  <text x="208" y="986" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">record</text>
  <line x1="128" y1="1008" x2="288" y2="1008" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="128" y1="1024" x2="288" y2="1024" stroke="#B9C6D4" stroke-width="2"/>

  <text x="180" y="1090" text-anchor="middle" font-size="11" fill="#5B7186">cells hold agreed observations,</text>
  <text x="180" y="1106" text-anchor="middle" font-size="11" fill="#5B7186">not predicted results</text>

  <!-- Hypotheses -->
  <rect x="30" y="1126" width="140" height="104" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="100" y="1158" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">TRAPPED</text>
  <text x="100" y="1176" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">AIR?</text>
  <text x="100" y="1200" text-anchor="middle" font-size="9" fill="#5B7186">seen immediately</text>
  <text x="100" y="1214" text-anchor="middle" font-size="9" fill="#5B7186">after application</text>

  <rect x="190" y="1126" width="140" height="104" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="260" y="1158" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">POSSIBLE</text>
  <text x="260" y="1176" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">OUTGASSING?</text>
  <text x="260" y="1200" text-anchor="middle" font-size="9" fill="#5B7186">one hypothesis for</text>
  <text x="260" y="1214" text-anchor="middle" font-size="9" fill="#5B7186">later change</text>

  <line x1="110" y1="1230" x2="155" y2="1262" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="250" y1="1230" x2="205" y2="1262" stroke="#4A7196" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="45" y="1266" width="270" height="70" rx="12" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="180" y="1294" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">BOTH REQUIRE</text>
  <text x="180" y="1312" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">INVESTIGATION</text>
  <text x="180" y="1330" text-anchor="middle" font-size="9" fill="#5B7186">agree next comparison first</text>

  <text x="180" y="1372" text-anchor="middle" font-size="10" fill="#5B7186">Timing alone does not prove cause or</text>
  <text x="180" y="1388" text-anchor="middle" font-size="10" fill="#5B7186">gas composition &#8212; illustrative design,</text>
  <text x="180" y="1404" text-anchor="middle" font-size="10" fill="#5B7186">not a measured result.</text>
</svg>
