<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1450" viewBox="0 0 360 1450" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Bottle, case and pallet are shown as separate objects with item identity, case identity and a pallet SSCC, linked to a lot record.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="360" height="1450" fill="#FEFEFC"/>
  <text x="180" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Bottle, case and pallet</text>
  <text x="180" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">are different objects</text>

  <!-- Bottle -->
  <rect x="16" y="80" width="328" height="290" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">BOTTLE</text>
  <text x="180" y="132" text-anchor="middle" font-size="11" fill="#5B7186">one sellable unit</text>
  <rect x="162" y="148" width="36" height="14" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="150" y="162" width="60" height="104" rx="12" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="157" y="192" width="46" height="34" rx="4" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="180" y="213" text-anchor="middle" font-size="10" fill="#16324F">item label</text>
  <rect x="50" y="280" width="260" height="72" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">item GTIN</text>
  <text x="180" y="324" text-anchor="middle" font-size="10" fill="#5B7186">identifies the item type, not this</text>
  <text x="180" y="339" text-anchor="middle" font-size="10" fill="#5B7186">physical bottle</text>

  <line x1="180" y1="370" x2="180" y2="402" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>
  <text x="200" y="392" font-size="11" fill="#5B7186">packed into</text>

  <!-- Case -->
  <rect x="16" y="410" width="328" height="330" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">SHIPPING CASE</text>
  <text x="180" y="462" text-anchor="middle" font-size="11" fill="#5B7186">a defined configuration of units</text>
  <rect x="60" y="478" width="240" height="120" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <rect x="76" y="494" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="112" y="494" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="148" y="494" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="184" y="494" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="76" y="546" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="112" y="546" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="148" y="546" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="184" y="546" width="26" height="42" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="240" y="545" font-size="11" fill="#5B7186">8 units</text>
  <rect x="50" y="614" width="260" height="106" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="640" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">case GTIN + lot</text>
  <text x="180" y="660" text-anchor="middle" font-size="10" fill="#5B7186">identifies the configuration,</text>
  <text x="180" y="675" text-anchor="middle" font-size="10" fill="#5B7186">not each physical case</text>
  <text x="180" y="700" text-anchor="middle" font-size="10" fill="#16324F">links identifier and lot</text>
  <text x="180" y="714" text-anchor="middle" font-size="10" fill="#16324F">to actual contents</text>

  <line x1="180" y1="740" x2="180" y2="772" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>
  <text x="200" y="762" font-size="11" fill="#5B7186">stacked onto</text>

  <!-- Pallet -->
  <rect x="16" y="780" width="328" height="330" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="812" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">PALLET</text>
  <text x="180" y="832" text-anchor="middle" font-size="11" fill="#5B7186">a logistic unit, when one is built</text>
  <rect x="66" y="848" width="108" height="56" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="186" y="848" width="108" height="56" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="66" y="912" width="108" height="56" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="186" y="912" width="108" height="56" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="60" y="974" width="240" height="12" rx="3" fill="#C9B37E" stroke="#B9C6D4" stroke-width="1.5"/>
  <rect x="76" y="986" width="18" height="12" fill="#C9B37E" stroke="#B9C6D4" stroke-width="1.5"/>
  <rect x="170" y="986" width="18" height="12" fill="#C9B37E" stroke="#B9C6D4" stroke-width="1.5"/>
  <rect x="266" y="986" width="18" height="12" fill="#C9B37E" stroke="#B9C6D4" stroke-width="1.5"/>
  <rect x="50" y="1012" width="260" height="84" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="1038" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">SSCC when assigned</text>
  <text x="180" y="1058" text-anchor="middle" font-size="10" fill="#5B7186">identifies this logistic unit &#8212;</text>
  <text x="180" y="1073" text-anchor="middle" font-size="10" fill="#5B7186">an SSCC is not a case GTIN</text>

  <!-- Lot record -->
  <line x1="180" y1="1110" x2="180" y2="1140" stroke="#4A7196" stroke-width="4" marker-end="url(#arr)"/>
  <text x="200" y="1130" font-size="11" fill="#5B7186">lot record &#8594; actual case</text>
  <rect x="16" y="1146" width="328" height="120" rx="12" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <rect x="40" y="1168" width="56" height="72" rx="6" fill="#FFFFFF" stroke="#C9B37E" stroke-width="2"/>
  <line x1="50" y1="1186" x2="86" y2="1186" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="50" y1="1200" x2="86" y2="1200" stroke="#B9C6D4" stroke-width="2"/>
  <line x1="50" y1="1214" x2="86" y2="1214" stroke="#B9C6D4" stroke-width="2"/>
  <text x="215" y="1188" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">LOT RECORD</text>
  <text x="215" y="1210" text-anchor="middle" font-size="11" fill="#16324F">production data linked to</text>
  <text x="215" y="1226" text-anchor="middle" font-size="11" fill="#16324F">the case contents</text>

  <!-- Footnote -->
  <rect x="16" y="1290" width="328" height="140" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="1318" text-anchor="middle" font-size="11" fill="#16324F">Dashed boxes mark where approved</text>
  <text x="180" y="1334" text-anchor="middle" font-size="11" fill="#16324F">data would go &#8212; placeholders only,</text>
  <text x="180" y="1350" text-anchor="middle" font-size="11" fill="#16324F">no production code or symbol.</text>
  <text x="180" y="1380" text-anchor="middle" font-size="11" fill="#5B7186">Concept diagram only &#8212; not a GS1</text>
  <text x="180" y="1396" text-anchor="middle" font-size="11" fill="#5B7186">assignment or receiving record.</text>
</svg>
