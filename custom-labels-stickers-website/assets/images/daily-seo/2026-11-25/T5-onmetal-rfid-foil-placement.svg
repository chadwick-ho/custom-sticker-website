<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="Foil pouch sketches compare a non-metal offset and a specialty on-metal tag while preserving separate printed barcode quiet zones and showing two case orientations.">
 <defs>
  <pattern id="foilHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
   <rect width="9" height="9" fill="#F0E7C8"/>
   <line x1="0" y1="0" x2="0" y2="9" stroke="#B07514" stroke-width="1.6"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#16324F"/>
  </marker>
  <style>
   .t{font:700 27px Arial,Helvetica,sans-serif;fill:#16324F}
   .h{font:700 20px Arial,Helvetica,sans-serif;fill:#16324F}
   .l{font:16px Arial,Helvetica,sans-serif;fill:#16324F}
   .lb{font:700 16px Arial,Helvetica,sans-serif;fill:#16324F}
   .s{font:14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .sb{font:700 14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .tag{font:700 14px Arial,Helvetica,sans-serif;fill:#B07514}
   .card{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:2}
   .panel{fill:#FFFFFF;stroke:#B9C6D4;stroke-width:2}
   .leader{stroke:#16324F;stroke-width:1.4;fill:none;marker-end:url(#arr)}
   .pouch{fill:#FFFFFF;stroke:#16324F;stroke-width:2}
   .seam{fill:#DCE8F2;stroke:#16324F;stroke-width:1.6}
   .fillp{fill:#DCE8F2;stroke:#16324F;stroke-width:1.2}
   .tagbox{fill:#FDF6E3;stroke:#B07514;stroke-width:2}
   .qz{fill:none;stroke:#16324F;stroke-width:2;stroke-dasharray:8 5}
  </style>
 </defs>

 <rect width="1200" height="880" fill="#FFFFFF"/>
 <text class="t" x="40" y="52">Illustrative only: confirm partner rules</text>
 <rect x="830" y="26" width="330" height="34" rx="17" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
 <text class="tag" x="995" y="48" text-anchor="middle">Concept — placements, not approvals</text>

 <!-- ============ Card A: permitted offset ============ -->
 <rect class="card" x="40" y="80" width="540" height="480" rx="10"/>
 <text class="h" x="66" y="118">Permitted offset candidate</text>
 <text class="s" x="66" y="140">Filled, unbranded pouch — front and wall section</text>

 <!-- pouch front -->
 <rect class="pouch" x="90" y="160" width="240" height="330" rx="8"/>
 <rect class="seam" x="90" y="160" width="240" height="26" rx="8"/>
 <text class="lb" x="210" y="178" text-anchor="middle">Seam</text>
 <line x1="90" y1="186" x2="330" y2="186" stroke="#16324F" stroke-width="1.6"/>
 <rect class="fillp" x="92" y="380" width="236" height="108"/>
 <text class="s" x="210" y="440" text-anchor="middle">fill level</text>
 <rect class="qz" x="120" y="300" width="130" height="60"/>
 <text class="sb" x="185" y="324" text-anchor="middle">Barcode</text>
 <text class="sb" x="185" y="344" text-anchor="middle">quiet zone</text>
 <rect class="tagbox" x="252" y="212" width="52" height="52" rx="4"/>
 <path class="leader" d="M278 264 L 278 276"/>
 <text class="lb" x="278" y="292" text-anchor="middle">Tag</text>

 <!-- foil extent section inset -->
 <rect class="panel" x="360" y="180" width="196" height="200" rx="8"/>
 <text class="sb" x="376" y="208">Wall section</text>
 <rect x="400" y="224" width="24" height="140" fill="#FFFFFF" stroke="#16324F" stroke-width="1.6"/>
 <rect x="424" y="224" width="24" height="140" fill="url(#foilHatch)" stroke="#B07514" stroke-width="1.6"/>
 <rect x="448" y="224" width="24" height="140" fill="#DCE8F2" stroke="#16324F" stroke-width="1.6"/>
 <text class="s" x="478" y="244">print / film</text>
 <text class="s" x="478" y="298">foil extent</text>
 <text class="s" x="478" y="350">inner layer</text>
 <line x1="424" y1="250" x2="474" y2="242" stroke="#16324F" stroke-width="1.2"/>
 <line x1="448" y1="294" x2="474" y2="294" stroke="#16324F" stroke-width="1.2"/>
 <line x1="472" y1="346" x2="474" y2="346" stroke="#16324F" stroke-width="1.2"/>

 <text class="s" x="66" y="520">Tag sits in a partner-permitted non-metal region,</text>
 <text class="s" x="66" y="540">offset from the foil after filling and closing.</text>

 <!-- ============ Card B: specialty on-metal ============ -->
 <rect class="card" x="620" y="80" width="540" height="480" rx="10"/>
 <text class="h" x="646" y="118">Specialty on-metal candidate</text>
 <text class="s" x="646" y="140">Only if the program allows this alternative</text>

 <rect class="pouch" x="670" y="160" width="240" height="330" rx="8"/>
 <rect class="seam" x="670" y="160" width="240" height="26" rx="8"/>
 <text class="lb" x="790" y="178" text-anchor="middle">Seam</text>
 <line x1="670" y1="186" x2="910" y2="186" stroke="#16324F" stroke-width="1.6"/>
 <rect class="fillp" x="672" y="380" width="236" height="108"/>
 <text class="s" x="790" y="440" text-anchor="middle">fill level</text>
 <rect class="qz" x="700" y="300" width="130" height="60"/>
 <text class="sb" x="765" y="324" text-anchor="middle">Barcode</text>
 <text class="sb" x="765" y="344" text-anchor="middle">quiet zone</text>
 <rect class="tagbox" x="770" y="216" width="52" height="52" rx="4" stroke-dasharray="6 4"/>
 <path class="leader" d="M796 268 L 796 276"/>
 <text class="lb" x="796" y="292" text-anchor="middle">Tag</text>

 <rect class="panel" x="940" y="180" width="196" height="200" rx="8"/>
 <text class="sb" x="956" y="208">Wall section</text>
 <rect x="980" y="224" width="24" height="140" fill="#FFFFFF" stroke="#16324F" stroke-width="1.6"/>
 <rect x="1004" y="224" width="24" height="140" fill="url(#foilHatch)" stroke="#B07514" stroke-width="1.6"/>
 <rect x="1028" y="224" width="24" height="140" fill="#DCE8F2" stroke="#16324F" stroke-width="1.6"/>
 <text class="s" x="1058" y="244">print / film</text>
 <text class="s" x="1058" y="298">foil extent</text>
 <text class="s" x="1058" y="350">inner layer</text>
 <line x1="1004" y1="250" x2="1054" y2="242" stroke="#16324F" stroke-width="1.2"/>
 <line x1="1028" y1="294" x2="1054" y2="294" stroke="#16324F" stroke-width="1.2"/>
 <line x1="1052" y1="346" x2="1054" y2="346" stroke="#16324F" stroke-width="1.2"/>

 <text class="s" x="646" y="520">Exact construction and placement come from the</text>
 <text class="s" x="646" y="540">RFID provider — subject to partner approval.</text>

 <!-- ============ case orientation strip ============ -->
 <text class="h" x="40" y="596">Check actual case orientations</text>
 <rect class="panel" x="40" y="612" width="540" height="150" rx="8"/>
 <rect x="70" y="632" width="200" height="110" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
 <rect x="90" y="646" width="40" height="82" fill="#DCE8F2" stroke="#16324F" stroke-width="1.4"/>
 <rect x="150" y="646" width="40" height="82" fill="#DCE8F2" stroke="#16324F" stroke-width="1.4"/>
 <rect x="210" y="646" width="40" height="82" fill="#DCE8F2" stroke="#16324F" stroke-width="1.4"/>
 <text class="lb" x="290" y="660">View A</text>
 <text class="s" x="290" y="684">units upright,</text>
 <text class="s" x="290" y="704">side by side</text>
 <rect class="panel" x="620" y="612" width="540" height="150" rx="8"/>
 <rect x="650" y="632" width="200" height="110" fill="#FFFFFF" stroke="#16324F" stroke-width="2"/>
 <rect x="668" y="650" width="164" height="22" fill="#DCE8F2" stroke="#16324F" stroke-width="1.4"/>
 <rect x="668" y="680" width="164" height="22" fill="#DCE8F2" stroke="#16324F" stroke-width="1.4"/>
 <rect x="668" y="710" width="164" height="22" fill="#DCE8F2" stroke="#16324F" stroke-width="1.4"/>
 <text class="lb" x="870" y="660">View B</text>
 <text class="s" x="870" y="684">units flat,</text>
 <text class="s" x="870" y="704">face to face</text>

 <!-- ============ bottom note ============ -->
 <rect x="40" y="780" width="1120" height="76" rx="8" fill="#F7FAFC" stroke="#B9C6D4" stroke-width="1.5"/>
 <text class="s" x="60" y="804">Illustrative placement options, not approvals or read results — no offset dimension, read range,</text>
 <text class="s" x="60" y="826">hardware endorsement or barcode pattern is shown. Inspect the optical code independently.</text>
</svg>
