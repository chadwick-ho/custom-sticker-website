<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="Blank slide sketches compare the ID area and rack clearance for laminate-free and self-laminating labels, using the same dummy ID in both.">
 <defs>
  <pattern id="kcHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
   <rect width="8" height="8" fill="#FFFFFF"/>
   <line x1="0" y1="0" x2="0" y2="8" stroke="#5B7186" stroke-width="1.2"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#16324F"/>
  </marker>
  <style>
   .t{font:700 27px Arial,Helvetica,sans-serif;fill:#16324F}
   .h{font:700 20px Arial,Helvetica,sans-serif;fill:#16324F}
   .l{font:16px Arial,Helvetica,sans-serif;fill:#16324F}
   .lb{font:700 16px Arial,Helvetica,sans-serif;fill:#16324F}
   .s{font:14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .sb{font:700 14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .tag{font:700 14px Arial,Helvetica,sans-serif;fill:#B07514}
   .id{font:700 18px 'Courier New',monospace;fill:#16324F}
   .card{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:2}
   .panel{fill:#FFFFFF;stroke:#B9C6D4;stroke-width:2}
   .leader{stroke:#16324F;stroke-width:1.4;fill:none;marker-end:url(#arr)}
   .blank{stroke:#5B7186;stroke-width:1.4}
   .glass{fill:#DCE8F2;stroke:#16324F;stroke-width:2}
   .labl{fill:#FFFFFF;stroke:#16324F;stroke-width:1.6}
   .ovl{fill:none;stroke:#B07514;stroke-width:2;stroke-dasharray:7 5}
  </style>
 </defs>

 <rect width="1200" height="880" fill="#FFFFFF"/>
 <text class="t" x="40" y="52">Illustrative blank slides</text>
 <rect x="780" y="26" width="380" height="34" rx="17" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
 <text class="tag" x="970" y="48" text-anchor="middle">Concept — fit check, not a solvent test</text>

 <!-- ============ Left card: laminate-free ============ -->
 <rect class="card" x="40" y="80" width="540" height="540" rx="10"/>
 <text class="h" x="66" y="118">Laminate-free</text>
 <text class="s" x="66" y="140">Plan view — not to scale</text>

 <rect class="glass" x="90" y="170" width="440" height="110" rx="10"/>
 <rect class="labl" x="102" y="182" width="180" height="86" rx="4"/>
 <text class="id" x="192" y="232" text-anchor="middle">DEMO-42</text>
 <rect x="440" y="170" width="90" height="110" fill="url(#kcHatch)" stroke="#16324F" stroke-width="1.6"/>
 <path class="leader" d="M282 200 L 390 156"/>
 <text class="lb" x="394" y="150">Usable ID area</text>
 <path class="leader" d="M470 280 L 470 330"/>
 <text class="lb" x="560" y="352" text-anchor="end">Rack keep-clear zone</text>

 <!-- cross-section inset -->
 <rect class="panel" x="66" y="380" width="488" height="170" rx="8"/>
 <text class="sb" x="86" y="408">Section at label / rack interface</text>
 <rect x="110" y="470" width="340" height="18" fill="#DCE8F2" stroke="#16324F" stroke-width="1.6"/>
 <rect x="150" y="456" width="120" height="14" fill="#FFFFFF" stroke="#16324F" stroke-width="1.6"/>
 <path class="leader" d="M270 463 L 380 434"/>
 <text class="lb" x="386" y="430">Label edge</text>
 <rect x="420" y="442" width="14" height="60" fill="url(#kcHatch)" stroke="#5B7186" stroke-width="1.4"/>
 <text class="s" x="442" y="520">rack wall</text>
 <text class="s" x="86" y="520">Record any drag, contact or lift</text>
 <text class="s" x="86" y="540">on insertion and removal.</text>

 <!-- ============ Right card: self-laminating ============ -->
 <rect class="card" x="620" y="80" width="540" height="540" rx="10"/>
 <text class="h" x="646" y="118">Self-laminating</text>
 <text class="s" x="646" y="140">Plan view — not to scale</text>

 <rect class="glass" x="670" y="170" width="440" height="110" rx="10"/>
 <rect class="labl" x="682" y="182" width="180" height="86" rx="4"/>
 <rect class="ovl" x="682" y="182" width="230" height="86" rx="4"/>
 <text class="id" x="772" y="232" text-anchor="middle">DEMO-42</text>
 <rect x="1020" y="170" width="90" height="110" fill="url(#kcHatch)" stroke="#16324F" stroke-width="1.6"/>
 <path class="leader" d="M862 200 L 970 156"/>
 <text class="lb" x="974" y="150">Overlay edge</text>
 <path class="leader" d="M1050 280 L 1050 330"/>
 <text class="lb" x="900" y="352">Rack keep-clear zone</text>

 <!-- cross-section inset -->
 <rect class="panel" x="646" y="380" width="488" height="170" rx="8"/>
 <text class="sb" x="666" y="408">Section at label / rack interface</text>
 <rect x="690" y="470" width="340" height="18" fill="#DCE8F2" stroke="#16324F" stroke-width="1.6"/>
 <rect x="730" y="456" width="120" height="14" fill="#FFFFFF" stroke="#16324F" stroke-width="1.6"/>
 <rect x="730" y="442" width="170" height="14" fill="#FDF6E3" stroke="#B07514" stroke-width="1.6"/>
 <path class="leader" d="M900 449 L 990 424"/>
 <text class="lb" x="996" y="420">Overlay edge</text>
 <rect x="1000" y="442" width="14" height="60" fill="url(#kcHatch)" stroke="#5B7186" stroke-width="1.4"/>
 <text class="s" x="986" y="520">rack wall</text>
 <text class="s" x="666" y="520">Overlay must cover the whole ID</text>
 <text class="s" x="666" y="540">and clear the keep-clear zone.</text>

 <!-- ============ handoff record ============ -->
 <text class="h" x="40" y="660">Compare the same ID at handoff</text>
 <rect class="panel" x="40" y="676" width="1120" height="80" rx="8"/>
 <text class="lb" x="66" y="708">Expected ID:</text>
 <text class="id" x="196" y="710">DEMO-42</text>
 <text class="lb" x="420" y="708">Read at handoff:</text>
 <line class="blank" x1="566" y1="708" x2="800" y2="708"/>
 <text class="lb" x="830" y="708">Scanner returns:</text>
 <line class="blank" x1="982" y1="708" x2="1140" y2="708"/>
 <text class="s" x="66" y="740">One fictional plain-text ID, no patient or lab identifiers — record readability and attachment separately.</text>

 <!-- ============ bottom note ============ -->
 <rect x="40" y="776" width="1120" height="80" rx="8" fill="#F7FAFC" stroke="#B9C6D4" stroke-width="1.5"/>
 <text class="s" x="60" y="802">Illustrative fit check, not a tested result — no solvent step, clinical claim or resistance rating is</text>
 <text class="s" x="60" y="824">shown. A label that stays attached but loses readable characters, or fouls the rack, stays on hold.</text>
</svg>
