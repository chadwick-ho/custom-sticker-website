<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="After B drops to 1,000 units, the brite order leaves 1,000 blank bodies and 1,000 B labels. The printed order leaves 1,000 B bodies. Both leave 1,000 ends.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#16324F">One fill change, two possible can orders</text>

  <!-- Fill plan band -->
  <rect x="40" y="88" width="1120" height="130" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="600" y="124" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">Illustrative fill plan</text>
  <rect x="300" y="140" width="270" height="56" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="435" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">A: 8,000 &#8594; 8,000</text>
  <rect x="630" y="140" width="270" height="56" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="765" y="175" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">B: 2,000 &#8594; 1,000</text>
  <text x="70" y="162" font-size="14" fill="#5B7186">Change happens</text>
  <text x="70" y="182" font-size="14" fill="#5B7186">before labeling</text>
  <text x="935" y="162" font-size="14" fill="#5B7186">Exact orders,</text>
  <text x="935" y="182" font-size="14" fill="#5B7186">zero losses</text>

  <!-- Left panel: shared brite order -->
  <rect x="40" y="248" width="550" height="450" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="315" y="286" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">Shared brite order</text>
  <text x="315" y="312" text-anchor="middle" font-size="14" fill="#5B7186">Ordered: 10,000 bodies + 8,000 A + 2,000 B labels</text>

  <rect x="70" y="332" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="190" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Plain bodies</text>
  <rect x="120" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="120" y1="392" x2="152" y2="392" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="162" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="162" y1="392" x2="194" y2="392" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="204" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="204" y1="392" x2="236" y2="392" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="190" y="470" text-anchor="middle" font-size="15" fill="#5B7186">9,000 filled</text>
  <text x="190" y="502" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">1,000 blank</text>
  <text x="190" y="524" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">bodies left</text>

  <rect x="330" y="332" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Label rolls</text>
  <circle cx="416" cy="410" r="26" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="416" cy="410" r="9" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="470" y="398" font-size="14" fill="#5B7186">A: 0 left</text>
  <circle cx="416" cy="470" r="26" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="416" cy="470" r="9" fill="#FEFEFC" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="470" y="464" font-size="14" font-weight="bold" fill="#16324F">B: 1,000</text>
  <text x="470" y="482" font-size="14" font-weight="bold" fill="#16324F">labels left</text>

  <rect x="70" y="552" width="500" height="96" rx="10" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="320" y="590" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">After both fills:</text>
  <text x="320" y="618" text-anchor="middle" font-size="17" fill="#16324F">1,000 blank bodies + 1,000 B labels</text>
  <text x="315" y="676" text-anchor="middle" font-size="14" fill="#5B7186">Later B run uses the labels; later A run needs new A labels</text>

  <!-- Right panel: dedicated printed order -->
  <rect x="610" y="248" width="550" height="450" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="885" y="286" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">Dedicated printed order</text>
  <text x="885" y="312" text-anchor="middle" font-size="14" fill="#5B7186">Ordered: 8,000 printed A + 2,000 printed B bodies</text>

  <rect x="640" y="332" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="760" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Printed A bodies</text>
  <rect x="700" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="700" y="396" width="32" height="22" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="716" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">A</text>
  <rect x="742" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="742" y="396" width="32" height="22" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="758" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">A</text>
  <rect x="784" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="784" y="396" width="32" height="22" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="800" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">A</text>
  <text x="760" y="470" text-anchor="middle" font-size="15" fill="#5B7186">8,000 filled</text>
  <text x="760" y="502" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">0 left</text>

  <rect x="900" y="332" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="1020" y="360" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Printed B bodies</text>
  <rect x="1004" y="378" width="32" height="62" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="1004" y="396" width="32" height="22" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <text x="1020" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">B</text>
  <text x="1020" y="470" text-anchor="middle" font-size="15" fill="#5B7186">1,000 filled</text>
  <text x="1020" y="502" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">1,000 B bodies left</text>
  <text x="1020" y="524" text-anchor="middle" font-size="13" fill="#5B7186">artwork already on can</text>

  <rect x="640" y="552" width="500" height="96" rx="10" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="890" y="590" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">After both fills:</text>
  <text x="890" y="618" text-anchor="middle" font-size="17" fill="#16324F">1,000 B bodies (fixed artwork)</text>
  <text x="885" y="676" text-anchor="middle" font-size="14" fill="#5B7186">Reusable only for a compatible B fill while art is current</text>

  <!-- Shared ends footer -->
  <rect x="40" y="728" width="1120" height="74" rx="12" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="120" cy="765" r="24" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="120" cy="765" r="16" fill="none" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="620" y="774" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Either order: 1,000 ends left</text>
  <text x="620" y="795" text-anchor="middle" font-size="14" fill="#5B7186">(ends counted once per route: 10,000 ordered, 9,000 used)</text>

  <text x="600" y="838" text-anchor="middle" font-size="13" fill="#5B7186">Illustrative arithmetic only — replace quantities with actual order increments and the filler&#8217;s allowance</text>
</svg>
