<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A die-cut tag passes over a finished cap, rests above the bottle's flavor name and sits beside a case divider where the flap can catch.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#16324F">Try the same die-cut tag in three positions</text>

  <!-- Scene 1: over the cap -->
  <rect x="40" y="90" width="360" height="680" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="220" y="128" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">1 &#183; Over the cap</text>

  <!-- tag lifted above cap -->
  <rect x="145" y="160" width="150" height="115" rx="10" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="220" cy="196" r="30" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="80" y="192" font-size="14" font-weight="bold" fill="#16324F">Die</text>
  <text x="80" y="210" font-size="14" font-weight="bold" fill="#16324F">opening</text>
  <line x1="118" y1="196" x2="186" y2="196" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- descent arrow -->
  <line x1="220" y1="282" x2="220" y2="358" stroke="#4A7196" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/>

  <!-- capped bottle -->
  <rect x="192" y="368" width="56" height="32" rx="7" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="208" y="400" width="24" height="20" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="170" y="420" width="100" height="210" rx="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>

  <text x="290" y="392" font-size="14" font-weight="bold" fill="#16324F">Widest closure</text>
  <text x="290" y="410" font-size="14" font-weight="bold" fill="#16324F">point</text>
  <line x1="288" y1="404" x2="250" y2="392" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="220" y="700" text-anchor="middle" font-size="14" fill="#5B7186">Capped sales bottle,</text>
  <text x="220" y="720" text-anchor="middle" font-size="14" fill="#5B7186">tag lowered as packed</text>

  <!-- Scene 2: at rest -->
  <rect x="420" y="90" width="360" height="680" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="600" y="128" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">2 &#183; At rest</text>

  <!-- bottle -->
  <rect x="572" y="370" width="56" height="32" rx="7" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="588" y="402" width="24" height="20" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="550" y="422" width="100" height="208" rx="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>

  <!-- tag resting on neck, hanging down the front -->
  <rect x="525" y="410" width="150" height="185" rx="10" fill="#F0E7C8" fill-opacity="0.92" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="600" cy="432" r="23" fill="none" stroke="#2E5F8A" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="535" y1="492" x2="665" y2="492" stroke="#C9B37E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="545" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Campaign</text>
  <text x="600" y="567" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">face</text>

  <text x="448" y="440" font-size="14" font-weight="bold" fill="#16324F">Opening</text>
  <text x="448" y="458" font-size="14" font-weight="bold" fill="#16324F">on neck</text>
  <line x1="498" y1="444" x2="575" y2="436" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="448" y="496" font-size="14" font-weight="bold" fill="#16324F">Score</text>
  <line x1="492" y1="492" x2="531" y2="492" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- flavor name band below the tag -->
  <rect x="550" y="612" width="100" height="30" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="600" y="631" text-anchor="middle" font-size="11" fill="#16324F">Flavor name</text>
  <text x="688" y="640" font-size="14" font-weight="bold" fill="#16324F">Flavor</text>
  <text x="688" y="658" font-size="14" font-weight="bold" fill="#16324F">name</text>
  <line x1="684" y1="640" x2="652" y2="630" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="600" y="700" text-anchor="middle" font-size="14" fill="#5B7186">Check headline does not</text>
  <text x="600" y="720" text-anchor="middle" font-size="14" fill="#5B7186">cover the flavor name</text>

  <!-- Scene 3: inside the case -->
  <rect x="800" y="90" width="360" height="680" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="980" y="128" text-anchor="middle" font-size="21" font-weight="bold" fill="#16324F">3 &#183; Inside the case</text>

  <text x="1078" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Check flap</text>
  <text x="1078" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">clearance</text>
  <line x1="1108" y1="392" x2="1108" y2="452" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- bottle A with tag in front -->
  <rect x="852" y="404" width="44" height="28" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="866" y="432" width="16" height="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="838" y="446" width="85" height="180" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="822" y="436" width="150" height="170" rx="8" fill="#F0E7C8" fill-opacity="0.88" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="874" cy="458" r="19" fill="none" stroke="#2E5F8A" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- bottle B with tag in front -->
  <rect x="1020" y="404" width="44" height="28" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="1034" y="432" width="16" height="14" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="1006" y="446" width="85" height="180" rx="12" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="992" y="436" width="130" height="170" rx="8" fill="#F0E7C8" fill-opacity="0.88" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="1042" cy="458" r="19" fill="none" stroke="#2E5F8A" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- divider and clearance check -->
  <rect x="1130" y="410" width="10" height="230" fill="#B9C6D4" stroke="#7A94A8" stroke-width="1.5"/>
  <circle cx="1120" cy="470" r="17" fill="none" stroke="#C9B37E" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="1123" y1="470" x2="1129" y2="470" stroke="#4A7196" stroke-width="2.5"/>
  <text x="1118" y="668" text-anchor="middle" font-size="11" fill="#5B7186">Case divider</text>

  <text x="980" y="700" text-anchor="middle" font-size="14" fill="#5B7186">Remove and return the bottle</text>
  <text x="980" y="720" text-anchor="middle" font-size="14" fill="#5B7186">without moving the fixture</text>

  <!-- Footer -->
  <text x="600" y="830" text-anchor="middle" font-size="14" fill="#5B7186">Concept outlines only — mark any interference on the physical dummy, not on this drawing</text>
</svg>
