<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1520" viewBox="0 0 360 1520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Two eligible code-source paths feed a selected print route. The packer accounts for each unit, the brand records release, and Amazon reviews operations.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#4A7196"/></marker>
  </defs>
  <rect width="360" height="1520" fill="#FEFEFC"/>
  <text x="180" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Who controls the code,</text>
  <text x="180" y="60" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">the package and the review</text>

  <!-- Brand -->
  <rect x="16" y="84" width="328" height="420" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="116" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Brand</text>
  <rect x="40" y="132" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Confirm enrollment</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#5B7186">Brand Registry &#183; trademark &#183; GTIN</text>
  <line x1="180" y1="198" x2="180" y2="218" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="180" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Eligible code source —</text>
  <text x="180" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">brand confirms with Amazon</text>
  <rect x="30" y="268" width="140" height="90" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="100" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Amazon-</text>
  <text x="100" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">issued codes</text>
  <rect x="190" y="268" width="140" height="90" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="260" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Existing serials</text>
  <text x="260" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">connected</text>
  <text x="260" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">to Amazon</text>
  <circle cx="180" cy="313" r="14" fill="#FEFEFC" stroke="#7A94A8" stroke-width="2"/>
  <text x="180" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#5B7186">or</text>
  <line x1="100" y1="360" x2="100" y2="390" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="260" y1="360" x2="260" y2="390" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="100" y1="390" x2="260" y2="390" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="180" y1="390" x2="180" y2="412" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="40" y="414" width="280" height="54" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="447" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Choose print route</text>
  <text x="180" y="492" text-anchor="middle" font-size="11" fill="#5B7186">route handed to printer or packer</text>

  <line x1="180" y1="506" x2="180" y2="528" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Printer or packer -->
  <rect x="16" y="530" width="328" height="400" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="562" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Printer or packer</text>
  <rect x="40" y="576" width="280" height="66" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="604" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Self-print / Partner labels</text>
  <text x="180" y="626" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">/ Packaging print</text>
  <line x1="180" y1="644" x2="180" y2="664" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="40" y="666" width="280" height="52" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="698" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">One code per unit</text>
  <line x1="180" y1="720" x2="180" y2="740" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="60" y="750" width="60" height="96" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="60" y="776" width="60" height="30" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="90" y="796" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Demo A</text>
  <rect x="240" y="750" width="60" height="96" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="240" y="776" width="60" height="30" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="270" y="796" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">Demo B</text>
  <text x="180" y="886" text-anchor="middle" font-size="12" fill="#5B7186">packer accounts for each unit</text>

  <line x1="180" y1="932" x2="180" y2="952" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Brand release record -->
  <rect x="40" y="954" width="280" height="84" rx="10" fill="#FFFFFF" stroke="#7A94A8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="180" y="984" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Brand release record</text>
  <text x="180" y="1006" text-anchor="middle" font-size="11" fill="#5B7186">printed &#183; used &#183; spoiled &#183; on hand</text>
  <text x="180" y="1026" text-anchor="middle" font-size="11" fill="#5B7186">brand authorizes release</text>

  <line x1="180" y1="1040" x2="180" y2="1060" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Amazon -->
  <rect x="16" y="1062" width="328" height="380" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="1094" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Amazon</text>
  <text x="180" y="1116" text-anchor="middle" font-size="11" fill="#5B7186">labeling and shipping begin</text>
  <rect x="40" y="1126" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="1154" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Operational</text>
  <text x="180" y="1174" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">performance review</text>
  <line x1="180" y1="1192" x2="180" y2="1212" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="40" y="1214" width="280" height="60" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="180" y="1240" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Protection after</text>
  <text x="180" y="1260" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">passing review</text>
  <rect x="40" y="1296" width="280" height="90" rx="10" fill="#FEFEFC" stroke="#7A94A8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="180" y="1326" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Keep records separate</text>
  <text x="180" y="1348" text-anchor="middle" font-size="11" fill="#5B7186">print approval alone</text>
  <text x="180" y="1366" text-anchor="middle" font-size="11" fill="#5B7186">does not activate protection</text>

  <text x="180" y="1472" text-anchor="middle" font-size="11" fill="#5B7186">Demo A / Demo B are placeholders only —</text>
  <text x="180" y="1490" text-anchor="middle" font-size="11" fill="#5B7186">no live codes, scannable marks or platform seals</text>
</svg>
