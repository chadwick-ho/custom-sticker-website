<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A folded header holds a loaded sticker bag on a peg. A template and two details show how the hook opening, fold and attachment affect the visible pack name.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#4A7196"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7A94A8"/></marker>
  </defs>
  <rect width="1200" height="880" fill="#FEFEFC"/>
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#16324F">From a flat header to a loaded pack on the peg</text>

  <!-- ============ Left: flat template ============ -->
  <rect x="40" y="90" width="420" height="390" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="250" y="126" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Printer&#8217;s template (flat)</text>

  <!-- back panel -->
  <rect x="90" y="150" width="300" height="120" rx="8" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <rect x="90" y="150" width="300" height="28" fill="#C9B37E" fill-opacity="0.45" stroke="#C9B37E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="240" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Back</text>
  <text x="240" y="246" text-anchor="middle" font-size="12" fill="#5B7186">read in the hand</text>

  <!-- fold -->
  <line x1="90" y1="270" x2="390" y2="270" stroke="#2E5F8A" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="400" y="266" font-size="13" font-weight="bold" fill="#16324F">Fold</text>
  <line x1="396" y1="270" x2="392" y2="270" stroke="#7A94A8" stroke-width="1.5"/>

  <!-- front panel -->
  <rect x="90" y="270" width="300" height="120" rx="8" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="240" y="330" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Front</text>
  <text x="240" y="352" text-anchor="middle" font-size="12" fill="#5B7186">seen on the peg</text>
  <rect x="90" y="362" width="300" height="28" fill="#C9B37E" fill-opacity="0.45" stroke="#C9B37E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="240" y="382" text-anchor="middle" font-size="12" fill="#16324F">Attachment area</text>

  <!-- hook opening straddling the fold -->
  <circle cx="240" cy="270" r="15" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="2"/>
  <text x="400" y="296" font-size="13" font-weight="bold" fill="#16324F">Hook</text>
  <text x="400" y="312" font-size="13" font-weight="bold" fill="#16324F">opening</text>
  <line x1="396" y1="302" x2="258" y2="274" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="250" y="452" text-anchor="middle" font-size="12" fill="#5B7186">Attachment bands at the outer</text>
  <text x="250" y="469" text-anchor="middle" font-size="12" fill="#5B7186">edge of each panel</text>

  <!-- ============ Right: folded header on loaded bag ============ -->
  <rect x="480" y="90" width="680" height="390" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="820" y="126" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Folded header on the loaded bag</text>

  <!-- retail hook -->
  <line x1="782" y1="168" x2="1120" y2="168" stroke="#16324F" stroke-width="7"/>
  <line x1="782" y1="168" x2="770" y2="156" stroke="#16324F" stroke-width="7"/>
  <text x="1050" y="150" font-size="14" font-weight="bold" fill="#16324F">Retail hook</text>

  <!-- back panel peeking behind -->
  <rect x="680" y="190" width="220" height="120" rx="8" fill="#C9B37E" fill-opacity="0.55" stroke="#C9B37E" stroke-width="2"/>

  <!-- bag behind front panel -->
  <rect x="690" y="315" width="220" height="140" rx="10" fill="#DCE8F2" fill-opacity="0.5" stroke="#2E5F8A" stroke-width="2"/>
  <rect x="724" y="352" width="46" height="36" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="792" y="368" width="40" height="30" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <circle cx="852" cy="400" r="18" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="742" y="408" width="42" height="30" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>

  <!-- front panel of folded header -->
  <rect x="690" y="198" width="220" height="122" rx="8" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="795" cy="198" r="13" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="2"/>
  <text x="800" y="268" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">PACK NAME</text>
  <rect x="690" y="294" width="220" height="26" fill="#C9B37E" fill-opacity="0.45" stroke="#C9B37E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="720" y="300" width="10" height="14" rx="2" fill="#FEFEFC" stroke="#16324F" stroke-width="2"/>
  <rect x="862" y="300" width="10" height="14" rx="2" fill="#FEFEFC" stroke="#16324F" stroke-width="2"/>

  <!-- leaders -->
  <text x="520" y="172" font-size="14" font-weight="bold" fill="#16324F">Fold</text>
  <line x1="556" y1="176" x2="688" y2="192" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="520" y="216" font-size="14" font-weight="bold" fill="#16324F">Hook</text>
  <text x="520" y="234" font-size="14" font-weight="bold" fill="#16324F">opening</text>
  <line x1="580" y1="222" x2="780" y2="200" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="520" y="306" font-size="14" font-weight="bold" fill="#16324F">Attachment</text>
  <text x="520" y="324" font-size="14" font-weight="bold" fill="#16324F">area</text>
  <line x1="580" y1="310" x2="686" y2="308" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="940" y="344" font-size="14" font-weight="bold" fill="#16324F">Top edge of</text>
  <text x="940" y="362" font-size="14" font-weight="bold" fill="#16324F">stickers</text>
  <line x1="936" y1="352" x2="858" y2="352" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="940" y="430" font-size="14" font-weight="bold" fill="#16324F">Loaded bag</text>
  <line x1="936" y1="426" x2="912" y2="426" stroke="#7A94A8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="820" y="462" text-anchor="middle" font-size="12" fill="#5B7186">Hang it, lift it off, put it back</text>

  <!-- ============ Detail 1: pack name clear ============ -->
  <rect x="40" y="520" width="560" height="310" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="320" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Detail — pack name clear</text>

  <rect x="90" y="580" width="460" height="80" rx="6" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="320" y="630" text-anchor="middle" font-size="22" font-weight="bold" fill="#16324F">PACK NAME</text>
  <rect x="90" y="660" width="460" height="30" fill="#C9B37E" fill-opacity="0.45" stroke="#C9B37E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="500" y="666" width="10" height="16" rx="2" fill="#FEFEFC" stroke="#16324F" stroke-width="2"/>
  <rect x="130" y="666" width="10" height="16" rx="2" fill="#FEFEFC" stroke="#16324F" stroke-width="2"/>

  <rect x="90" y="690" width="460" height="100" fill="#DCE8F2" fill-opacity="0.5" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="90" y1="722" x2="550" y2="722" stroke="#2E5F8A" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="140" y="722" width="44" height="34" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="230" y="722" width="44" height="34" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>

  <text x="110" y="566" font-size="12" fill="#5B7186">header front</text>
  <text x="545" y="716" text-anchor="end" font-size="11" fill="#5B7186">top edge of stickers</text>
  <text x="320" y="778" text-anchor="middle" font-size="12" fill="#5B7186">bag top below; fasteners stay in the attachment band</text>
  <text x="320" y="806" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Fastener in band &#8212; name readable</text>

  <!-- ============ Detail 2: pack name blocked ============ -->
  <rect x="620" y="520" width="540" height="310" rx="14" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="890" y="556" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Detail — pack name blocked</text>

  <rect x="670" y="580" width="440" height="80" rx="6" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="890" y="630" text-anchor="middle" font-size="22" font-weight="bold" fill="#16324F">PACK NAME</text>
  <rect x="846" y="600" width="10" height="40" rx="2" fill="#FEFEFC" stroke="#16324F" stroke-width="2"/>
  <rect x="670" y="660" width="440" height="30" fill="#C9B37E" fill-opacity="0.45" stroke="#C9B37E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="700" y="666" width="10" height="16" rx="2" fill="#FEFEFC" stroke="#16324F" stroke-width="2"/>

  <rect x="670" y="690" width="440" height="100" fill="#DCE8F2" fill-opacity="0.5" stroke="#2E5F8A" stroke-width="2"/>
  <line x1="670" y1="722" x2="1110" y2="722" stroke="#2E5F8A" stroke-width="2" stroke-dasharray="8 5"/>
  <rect x="720" y="722" width="44" height="34" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="810" y="722" width="44" height="34" rx="8" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1.5"/>

  <text x="1105" y="716" text-anchor="end" font-size="11" fill="#5B7186">top edge of stickers</text>
  <text x="890" y="778" text-anchor="middle" font-size="12" fill="#5B7186">a fastener through the name is a rejected position</text>
  <text x="890" y="806" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Fastener across the name &#8212; comparison only</text>

  <text x="600" y="858" text-anchor="middle" font-size="13" fill="#5B7186">Illustrative geometry — proof the fold, hole and attachment on the actual filled bag and fixture</text>
</svg>
