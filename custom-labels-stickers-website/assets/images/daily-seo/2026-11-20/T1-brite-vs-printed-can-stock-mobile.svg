<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1330" viewBox="0 0 360 1330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="After B drops to 1,000 units, the brite order leaves 1,000 blank bodies and 1,000 B labels. The printed order leaves 1,000 B bodies. Both leave 1,000 ends.">
  <rect width="360" height="1330" fill="#FEFEFC"/>
  <text x="180" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">One fill change,</text>
  <text x="180" y="60" text-anchor="middle" font-size="20" font-weight="bold" fill="#16324F">two possible can orders</text>

  <!-- Fill plan -->
  <rect x="16" y="80" width="328" height="176" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Illustrative fill plan</text>
  <rect x="56" y="120" width="248" height="42" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="180" y="147" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">A: 8,000 &#8594; 8,000</text>
  <rect x="56" y="170" width="248" height="42" rx="8" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="180" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">B: 2,000 &#8594; 1,000</text>
  <text x="180" y="240" text-anchor="middle" font-size="12" fill="#5B7186">Change before labeling &#183; exact orders, zero losses</text>

  <!-- Shared brite order -->
  <rect x="16" y="276" width="328" height="400" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Shared brite order</text>
  <text x="180" y="328" text-anchor="middle" font-size="11" fill="#5B7186">Ordered: 10,000 bodies + 8,000 A + 2,000 B labels</text>

  <rect x="34" y="342" width="142" height="180" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="105" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Plain bodies</text>
  <rect x="74" y="378" width="26" height="48" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <line x1="74" y1="389" x2="100" y2="389" stroke="#2E5F8A" stroke-width="1"/>
  <rect x="108" y="378" width="26" height="48" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <line x1="108" y1="389" x2="134" y2="389" stroke="#2E5F8A" stroke-width="1"/>
  <text x="105" y="448" text-anchor="middle" font-size="12" fill="#5B7186">9,000 filled</text>
  <text x="105" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">1,000 blank</text>
  <text x="105" y="494" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">bodies left</text>

  <rect x="186" y="342" width="142" height="180" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="257" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Label rolls</text>
  <circle cx="230" cy="398" r="18" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <circle cx="230" cy="398" r="6" fill="#FEFEFC" stroke="#2E5F8A" stroke-width="1"/>
  <text x="256" y="402" font-size="12" fill="#5B7186">A: 0 left</text>
  <circle cx="230" cy="452" r="18" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1.5"/>
  <circle cx="230" cy="452" r="6" fill="#FEFEFC" stroke="#C9B37E" stroke-width="1"/>
  <text x="256" y="448" font-size="12" font-weight="bold" fill="#16324F">B: 1,000</text>
  <text x="256" y="464" font-size="12" font-weight="bold" fill="#16324F">left</text>

  <rect x="34" y="534" width="292" height="66" rx="10" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="180" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">After both fills:</text>
  <text x="180" y="582" text-anchor="middle" font-size="13" fill="#16324F">1,000 blank bodies + 1,000 B labels</text>
  <text x="180" y="632" text-anchor="middle" font-size="11" fill="#5B7186">Later B run reuses labels;</text>
  <text x="180" y="650" text-anchor="middle" font-size="11" fill="#5B7186">a later A run needs new A labels</text>

  <!-- Dedicated printed order -->
  <rect x="16" y="696" width="328" height="360" rx="12" fill="#F4F7FA" stroke="#B9C6D4" stroke-width="2"/>
  <text x="180" y="726" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Dedicated printed order</text>
  <text x="180" y="748" text-anchor="middle" font-size="11" fill="#5B7186">Ordered: 8,000 printed A + 2,000 printed B bodies</text>

  <rect x="34" y="762" width="142" height="170" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="105" y="786" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Printed A</text>
  <text x="105" y="803" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">bodies</text>
  <rect x="92" y="814" width="26" height="46" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="92" y="828" width="26" height="16" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1"/>
  <text x="105" y="840" text-anchor="middle" font-size="10" font-weight="bold" fill="#16324F">A</text>
  <text x="105" y="882" text-anchor="middle" font-size="12" fill="#5B7186">8,000 filled</text>
  <text x="105" y="910" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">0 left</text>

  <rect x="186" y="762" width="142" height="170" rx="10" fill="#FFFFFF" stroke="#B9C6D4" stroke-width="2"/>
  <text x="257" y="786" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">Printed B</text>
  <text x="257" y="803" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">bodies</text>
  <rect x="244" y="814" width="26" height="46" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <rect x="244" y="828" width="26" height="16" fill="#F0E7C8" stroke="#C9B37E" stroke-width="1"/>
  <text x="257" y="840" text-anchor="middle" font-size="10" font-weight="bold" fill="#16324F">B</text>
  <text x="257" y="882" text-anchor="middle" font-size="12" fill="#5B7186">1,000 filled</text>
  <text x="257" y="904" text-anchor="middle" font-size="12" font-weight="bold" fill="#16324F">1,000 B left</text>
  <text x="257" y="922" text-anchor="middle" font-size="10" fill="#5B7186">art on can</text>

  <rect x="34" y="944" width="292" height="66" rx="10" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <text x="180" y="970" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">After both fills:</text>
  <text x="180" y="992" text-anchor="middle" font-size="13" fill="#16324F">1,000 B bodies (fixed artwork)</text>
  <text x="180" y="1034" text-anchor="middle" font-size="11" fill="#5B7186">Reusable only for a compatible B fill</text>
  <text x="180" y="1050" text-anchor="middle" font-size="11" fill="#5B7186">while the artwork is current</text>

  <!-- Shared ends footer -->
  <rect x="16" y="1076" width="328" height="86" rx="12" fill="#F0E7C8" stroke="#C9B37E" stroke-width="2"/>
  <circle cx="60" cy="1119" r="20" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <circle cx="60" cy="1119" r="13" fill="none" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="200" y="1112" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Either order:</text>
  <text x="200" y="1132" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">1,000 ends left</text>
  <text x="200" y="1150" text-anchor="middle" font-size="10" fill="#5B7186">(10,000 ordered, 9,000 used)</text>

  <text x="180" y="1194" text-anchor="middle" font-size="11" fill="#5B7186">Illustrative arithmetic only — replace</text>
  <text x="180" y="1212" text-anchor="middle" font-size="11" fill="#5B7186">quantities with actual order increments</text>
  <text x="180" y="1230" text-anchor="middle" font-size="11" fill="#5B7186">and the filler&#8217;s allowance</text>
</svg>
