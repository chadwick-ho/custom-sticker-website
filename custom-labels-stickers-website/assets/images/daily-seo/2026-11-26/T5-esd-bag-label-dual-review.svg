<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="A protective bag with a proposed label position is reviewed in two separate cards: a security review and an electrical packaging review, each with unfilled decision fields.">
 <defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#16324F"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
   <rect width="10" height="10" fill="#F7FAFC"/>
   <line x1="0" y1="0" x2="0" y2="10" stroke="#B9C6D4" stroke-width="1.2"/>
  </pattern>
  <style>
   .t{font:700 27px Arial,Helvetica,sans-serif;fill:#16324F}
   .h{font:700 20px Arial,Helvetica,sans-serif;fill:#16324F}
   .lb{font:700 16px Arial,Helvetica,sans-serif;fill:#16324F}
   .s{font:14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .sb{font:700 14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .tag{font:700 14px Arial,Helvetica,sans-serif;fill:#B07514}
   .card{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:2}
   .panel{fill:#FFFFFF;stroke:#B9C6D4;stroke-width:2}
   .leader{stroke:#16324F;stroke-width:1.4;fill:none;marker-end:url(#arr)}
   .flow{stroke:#16324F;stroke-width:2;fill:none;marker-end:url(#arr)}
   .blank{stroke:#5B7186;stroke-width:1.5;stroke-dasharray:7 5;fill:none}
   .callout{fill:#FFFFFF;stroke:#B07514;stroke-width:1.8;stroke-dasharray:7 5}
   .bag{fill:#FFFFFF;stroke:#16324F;stroke-width:2}
   .closure{fill:#DCE8F2;stroke:#16324F;stroke-width:1.6}
   .draft{fill:#F0E7C8;stroke:#B07514;stroke-width:2;stroke-dasharray:8 5}
   .req{fill:#FFFFFF;stroke:#5B7186;stroke-width:1.4}
  </style>
 </defs>

 <rect width="1200" height="880" fill="#FFFFFF"/>
 <text class="t" x="40" y="52">One placement, two separate reviews</text>
 <rect x="820" y="26" width="340" height="34" rx="17" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
 <text class="tag" x="990" y="48" text-anchor="middle">Concept — decisions unfilled</text>

 <!-- ============ Left: bag with proposed label ============ -->
 <rect class="card" x="40" y="80" width="430" height="560" rx="10"/>
 <text class="h" x="62" y="118">Label added to a protective bag</text>
 <text class="s" x="62" y="141">Draft position — approved or moved per review</text>

 <!-- bag -->
 <rect class="bag" x="80" y="185" width="210" height="330" rx="10"/>
 <rect class="closure" x="80" y="185" width="210" height="30" rx="10"/>
 <line x1="80" y1="215" x2="290" y2="215" stroke="#16324F" stroke-width="1.6"/>
 <line x1="92" y1="200" x2="278" y2="200" stroke="#16324F" stroke-width="1.3" stroke-dasharray="4 4"/>
 <text class="s" x="185" y="240" text-anchor="middle">closure</text>
 <!-- required markings zone kept clear -->
 <rect class="req" x="100" y="262" width="170" height="54" rx="4"/>
 <text class="s" x="185" y="285" text-anchor="middle">required markings</text>
 <text class="s" x="185" y="303" text-anchor="middle">kept clear</text>
 <!-- proposed label -->
 <rect class="draft" x="110" y="350" width="150" height="86" rx="6"/>
 <text class="sb" x="185" y="385" text-anchor="middle">proposed label</text>
 <text class="s" x="185" y="406" text-anchor="middle">draft position</text>
 <!-- handling / opening note -->
 <text class="s" x="185" y="470" text-anchor="middle">opening route noted</text>
 <line class="leader" x1="185" y1="478" x2="185" y2="505"/>

 <!-- callouts to the right of bag -->
 <line x1="290" y1="200" x2="318" y2="200" stroke="#16324F" stroke-width="1.3"/>
 <text class="s" x="322" y="196">who opens,</text>
 <text class="s" x="322" y="212">where (EPA?)</text>
 <line x1="290" y1="393" x2="318" y2="393" stroke="#16324F" stroke-width="1.3"/>
 <text class="s" x="322" y="389">covers no</text>
 <text class="s" x="322" y="405">marking</text>
 <text class="s" x="62" y="560">Bag construction and closure are given to</text>
 <text class="s" x="62" y="580">both owners with the label stack:</text>
 <text class="sb" x="62" y="608">face · adhesive · inks · coatings · size</text>

 <!-- arrows to review cards -->
 <path class="flow" d="M470 215 L505 215"/>
 <path class="flow" d="M470 515 L505 515"/>

 <!-- ============ Right top: security review ============ -->
 <rect class="card" x="510" y="80" width="650" height="270" rx="10"/>
 <text class="h" x="532" y="118">Security review</text>
 <text class="sb" x="1000" y="118" text-anchor="end">owner: ____</text>
 <text class="s" x="532" y="141">What the visible feature is expected to do</text>

 <line x1="532" y1="162" x2="1138" y2="162" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="532" y="190">Feature job</text>
 <line class="blank" x1="760" y1="183" x2="1138" y2="183"/>
 <text class="lb" x="532" y="224">Placement</text>
 <line class="blank" x1="760" y1="217" x2="1138" y2="217"/>
 <text class="lb" x="532" y="258">Opening route</text>
 <line class="blank" x1="760" y1="251" x2="1138" y2="251"/>
 <text class="lb" x="532" y="292">Observable change / bypass</text>
 <line class="blank" x1="760" y1="285" x2="1138" y2="285"/>

 <text class="s" x="532" y="330">Record intended job, placement and what a</text>
 <text class="s" x="532" y="348">handler would actually see.</text>

 <!-- ============ Right bottom: electrical review ============ -->
 <rect class="card" x="510" y="370" width="650" height="270" rx="10"/>
 <text class="h" x="532" y="408">Electrical packaging review</text>
 <text class="sb" x="1138" y="408" text-anchor="end">ESD owner: ____</text>
 <text class="s" x="532" y="431">Does the modified assembly still qualify?</text>

 <line x1="532" y1="452" x2="1138" y2="452" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="532" y="480">Approved configuration</text>
 <line class="blank" x1="800" y1="473" x2="1138" y2="473"/>
 <text class="lb" x="532" y="514">Methods + limits</text>
 <line class="blank" x1="800" y1="507" x2="1138" y2="507"/>
 <text class="lb" x="532" y="548">Results</text>
 <line class="blank" x1="800" y1="541" x2="1138" y2="541"/>
 <text class="lb" x="532" y="582">Disposition</text>
 <line class="blank" x1="800" y1="575" x2="1138" y2="575"/>

 <text class="s" x="532" y="620">Tests chosen by the ESD owner under the</text>
 <text class="s" x="532" y="638">applicable control plan — on the full assembly.</text>

 <!-- ============ Bottom note ============ -->
 <rect class="callout" x="40" y="690" width="1120" height="110" rx="8"/>
 <text class="lb" x="60" y="722">Two records, not one</text>
 <text class="s" x="60" y="746">A printed security graphic does not establish electrical protection, and an electrical result</text>
 <text class="s" x="60" y="766">does not prove a tamper claim. Each owner approves separately; reassess after any change.</text>

 <text class="s" x="40" y="852">Illustrative planning diagram — appearance is not shielding and no certification or test outcome is implied.</text>
</svg>
