<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1760" viewBox="0 0 360 1760" role="img" aria-label="A package links its face stock, adhesive, ink and coatings cards to an evidence matrix with blank fields for the finished assembly, composting route, conditions and facility acceptance.">
 <defs>
  <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
   <rect width="9" height="9" fill="#F7FAFC"/>
   <line x1="0" y1="0" x2="0" y2="9" stroke="#B9C6D4" stroke-width="1.1"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#16324F"/>
  </marker>
  <style>
   .t{font:700 21px Arial,Helvetica,sans-serif;fill:#16324F}
   .h{font:700 18px Arial,Helvetica,sans-serif;fill:#16324F}
   .lb{font:700 15px Arial,Helvetica,sans-serif;fill:#16324F}
   .s{font:13px Arial,Helvetica,sans-serif;fill:#5B7186}
   .sb{font:700 13px Arial,Helvetica,sans-serif;fill:#5B7186}
   .tag{font:700 13px Arial,Helvetica,sans-serif;fill:#B07514}
   .card{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:2}
   .panel{fill:#FFFFFF;stroke:#B9C6D4;stroke-width:2}
   .leader{stroke:#16324F;stroke-width:1.4;fill:none;marker-end:url(#arr)}
   .flow{stroke:#16324F;stroke-width:2;fill:none;marker-end:url(#arr)}
   .blank{stroke:#5B7186;stroke-width:1.4;stroke-dasharray:6 4;fill:none}
   .callout{fill:#FFFFFF;stroke:#B07514;stroke-width:1.8;stroke-dasharray:7 5}
   .pack{fill:#FFFFFF;stroke:#16324F;stroke-width:2}
   .seam{fill:#DCE8F2;stroke:#16324F;stroke-width:1.5}
   .fill{fill:#DCE8F2;stroke:#16324F;stroke-width:1.5}
  </style>
 </defs>

 <rect width="360" height="1760" fill="#FFFFFF"/>
 <text class="t" x="24" y="40">Check the whole package,</text>
 <text class="t" x="24" y="66">not one component</text>
 <rect x="24" y="82" width="290" height="30" rx="15" fill="#F0E7C8" stroke="#B07514" stroke-width="1.4"/>
 <text class="tag" x="169" y="102" text-anchor="middle">Concept — fields filled per project</text>

 <!-- package card -->
 <rect class="card" x="24" y="130" width="312" height="360" rx="10"/>
 <text class="h" x="42" y="162">The finished package</text>
 <text class="s" x="42" y="182">Label layers ride with the</text>
 <text class="s" x="42" y="200">pack at disposal</text>

 <rect class="pack" x="60" y="222" width="120" height="220" rx="9"/>
 <rect class="seam" x="60" y="222" width="120" height="20" rx="9"/>
 <line x1="60" y1="242" x2="180" y2="242" stroke="#16324F" stroke-width="1.5"/>
 <rect x="62" y="244" width="116" height="110" fill="url(#hatch)"/>
 <rect class="fill" x="62" y="354" width="116" height="86"/>
 <text class="s" x="121" y="401" text-anchor="middle">Contents</text>

 <line x1="180" y1="252" x2="204" y2="252" stroke="#16324F" stroke-width="1.3"/>
 <line x1="180" y1="306" x2="204" y2="306" stroke="#16324F" stroke-width="1.3"/>
 <line x1="180" y1="360" x2="204" y2="360" stroke="#16324F" stroke-width="1.3"/>
 <text class="s" x="208" y="248">Ink +</text>
 <text class="s" x="208" y="264">coatings</text>
 <text class="s" x="208" y="302">Face</text>
 <text class="s" x="208" y="318">stock</text>
 <text class="s" x="208" y="356">Adhesive</text>
 <text class="s" x="208" y="372">at pack</text>

 <text class="sb" x="42" y="466">Does the label stay</text>
 <text class="sb" x="42" y="482">attached at disposal?</text>

 <path class="flow" d="M180 498 L180 530"/>

 <!-- component cards -->
 <rect class="panel" x="24" y="538" width="312" height="84" rx="8"/>
 <text class="lb" x="40" y="566">Face stock</text>
 <text class="s" x="40" y="588">Document on file:</text>
 <line class="blank" x1="160" y1="582" x2="320" y2="582"/>

 <rect class="panel" x="24" y="632" width="312" height="84" rx="8"/>
 <text class="lb" x="40" y="660">Adhesive</text>
 <text class="s" x="40" y="682">Document on file:</text>
 <line class="blank" x1="160" y1="676" x2="320" y2="676"/>

 <rect class="panel" x="24" y="726" width="312" height="84" rx="8"/>
 <text class="lb" x="40" y="754">Ink</text>
 <text class="s" x="40" y="776">Document on file:</text>
 <line class="blank" x1="160" y1="770" x2="320" y2="770"/>

 <rect class="panel" x="24" y="820" width="312" height="84" rx="8"/>
 <text class="lb" x="40" y="848">Coatings / finishes</text>
 <text class="s" x="40" y="870">Document on file:</text>
 <line class="blank" x1="160" y1="864" x2="320" y2="864"/>

 <path class="flow" d="M180 912 L180 944"/>

 <!-- evidence matrix -->
 <rect class="card" x="24" y="952" width="312" height="560" rx="10"/>
 <text class="h" x="42" y="984">Evidence matrix</text>
 <text class="s" x="42" y="1004">Blank until recorded</text>

 <line x1="42" y1="1020" x2="318" y2="1020" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="42" y="1046">What is claimed?</text>
 <text class="s" x="42" y="1066">Exact wording + where:</text>
 <line class="blank" x1="42" y1="1086" x2="318" y2="1086"/>

 <line x1="42" y1="1108" x2="318" y2="1108" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="42" y="1134">Finished assembly</text>
 <text class="s" x="42" y="1154">Does evidence cover the</text>
 <text class="s" x="42" y="1172">printed, applied pack?</text>
 <line class="blank" x1="42" y1="1192" x2="318" y2="1192"/>

 <line x1="42" y1="1214" x2="318" y2="1214" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="42" y="1240">Composting route</text>
 <text class="s" x="42" y="1260">Home or industrial —</text>
 <text class="s" x="42" y="1278">which does claim describe?</text>
 <line class="blank" x1="42" y1="1298" x2="318" y2="1298"/>

 <line x1="42" y1="1320" x2="318" y2="1320" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="42" y="1346">Conditions</text>
 <text class="s" x="42" y="1366">Test scope and limits:</text>
 <line class="blank" x1="42" y1="1386" x2="318" y2="1386"/>

 <line x1="42" y1="1408" x2="318" y2="1408" stroke="#B9C6D4" stroke-width="1.4"/>
 <text class="lb" x="42" y="1434">Facility acceptance</text>
 <text class="s" x="42" y="1454">Destination market:</text>
 <line class="blank" x1="42" y1="1474" x2="318" y2="1474"/>

 <!-- notes -->
 <rect class="callout" x="24" y="1540" width="312" height="90" rx="8"/>
 <text class="lb" x="40" y="1566">Record, don&#8217;t assume</text>
 <text class="s" x="40" y="1588">One layer&#8217;s document does not cover</text>
 <text class="s" x="40" y="1606">the printed, applied assembly.</text>

 <rect class="callout" x="24" y="1644" width="312" height="90" rx="8"/>
 <text class="lb" x="40" y="1670">Route is local</text>
 <text class="s" x="40" y="1692">Facility acceptance is checked</text>
 <text class="s" x="40" y="1710">in each destination market.</text>

 <text class="s" x="24" y="1752">Illustrative planning diagram.</text>
</svg>
