<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-label="A phone tapping a marked NFC spot on a package and a camera scanning a QR zone both route to a destination owner and a printed fallback instruction.">
 <defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#16324F"/>
  </marker>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
   <rect width="10" height="10" fill="#F7FAFC"/>
   <line x1="0" y1="0" x2="0" y2="10" stroke="#B9C6D4" stroke-width="1.2"/>
  </pattern>
  <style>
   .t{font:700 27px Arial,Helvetica,sans-serif;fill:#16324F}
   .h{font:700 20px Arial,Helvetica,sans-serif;fill:#16324F}
   .lb{font:700 16px Arial,Helvetica,sans-serif;fill:#16324F}
   .s{font:14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .sb{font:700 14px Arial,Helvetica,sans-serif;fill:#5B7186}
   .tag{font:700 14px Arial,Helvetica,sans-serif;fill:#B07514}
   .card{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:2}
   .panel{fill:#FFFFFF;stroke:#B9C6D4;stroke-width:2}
   .leader{stroke:#16324F;stroke-width:1.4;fill:none;marker-end:url(#arr)}
   .flow{stroke:#16324F;stroke-width:2;fill:none;marker-end:url(#arr)}
   .blank{stroke:#5B7186;stroke-width:1.5;stroke-dasharray:7 5;fill:none}
   .pack{fill:#FFFFFF;stroke:#16324F;stroke-width:2}
   .seam{fill:#DCE8F2;stroke:#16324F;stroke-width:1.6}
   .mark{fill:none;stroke:#B07514;stroke-width:2;stroke-dasharray:8 5}
   .phone{fill:#FFFFFF;stroke:#16324F;stroke-width:2}
   .screen{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:1.4}
   .wave{fill:none;stroke:#16324F;stroke-width:1.8}
   .vf{fill:none;stroke:#B07514;stroke-width:2.2}
   .qr{fill:#16324F}
   .qzone{fill:#FFFFFF;stroke:#B07514;stroke-width:1.8;stroke-dasharray:6 4}
  </style>
 </defs>

 <rect width="1200" height="880" fill="#FFFFFF"/>
 <text class="t" x="40" y="52">Two handoffs, one destination</text>
 <rect x="850" y="26" width="310" height="34" rx="17" fill="#F0E7C8" stroke="#B07514" stroke-width="1.5"/>
 <text class="tag" x="1005" y="48" text-anchor="middle">Concept — no functional codes</text>

 <!-- ============ Left card: NFC tap ============ -->
 <rect class="card" x="40" y="80" width="530" height="440" rx="10"/>
 <text class="h" x="62" y="118">NFC tap — phone meets a marked spot</text>
 <text class="s" x="62" y="141">Mark where the user taps; test the tag in its</text>
 <text class="s" x="62" y="159">final position and construction</text>

 <!-- package -->
 <rect class="pack" x="85" y="190" width="190" height="240" rx="8"/>
 <rect class="seam" x="85" y="190" width="190" height="20" rx="8"/>
 <rect x="87" y="212" width="186" height="120" fill="url(#hatch)"/>
 <text class="s" x="180" y="277" text-anchor="middle">package</text>
 <!-- marked tap spot -->
 <circle class="mark" cx="180" cy="372" r="38"/>
 <circle cx="180" cy="372" r="6" fill="#B07514"/>
 <line class="leader" x1="218" y1="372" x2="255" y2="345"/>
 <text class="s" x="222" y="338">tap mark</text>
 <text class="s" x="215" y="354">on artwork</text>

 <!-- phone -->
 <rect class="phone" x="345" y="205" width="120" height="210" rx="14"/>
 <rect class="screen" x="357" y="222" width="96" height="140" rx="6"/>
 <line x1="395" y1="215" x2="415" y2="215" stroke="#16324F" stroke-width="1.4"/>
 <circle cx="405" cy="388" r="8" fill="none" stroke="#16324F" stroke-width="1.4"/>
 <text class="s" x="405" y="300" text-anchor="middle">phone</text>

 <!-- NFC waves between phone and package -->
 <path class="wave" d="M300 300 a70 70 0 0 1 40 -62"/>
 <path class="wave" d="M308 318 a46 46 0 0 1 26 -40"/>
 <path class="wave" d="M292 282 a92 92 0 0 1 52 -82"/>
 <text class="s" x="282" y="196">close</text>
 <text class="s" x="282" y="212">range</text>

 <text class="sb" x="62" y="465">Tap position marked:</text>
 <line class="blank" x1="240" y1="458" x2="545" y2="458"/>
 <text class="sb" x="62" y="495">Tag + encoding owner:</text>
 <line class="blank" x1="240" y1="488" x2="545" y2="488"/>

 <path class="flow" d="M305 520 L305 560"/>

 <!-- ============ Right card: QR scan ============ -->
 <rect class="card" x="630" y="80" width="530" height="440" rx="10"/>
 <text class="h" x="652" y="118">QR scan — camera reads a printed zone</text>
 <text class="s" x="652" y="141">Protect symbol size, contrast and clear space</text>
 <text class="s" x="652" y="159">on the finished package</text>

 <!-- package -->
 <rect class="pack" x="675" y="190" width="190" height="240" rx="8"/>
 <rect class="seam" x="675" y="190" width="190" height="20" rx="8"/>
 <rect x="677" y="212" width="186" height="90" fill="url(#hatch)"/>
 <text class="s" x="770" y="262" text-anchor="middle">package</text>
 <!-- QR zone placeholder -->
 <rect class="qzone" x="712" y="318" width="126" height="96" rx="6"/>
 <rect class="qr" x="724" y="330" width="16" height="16"/>
 <rect x="728" y="334" width="8" height="8" fill="#FFFFFF"/>
 <rect class="qr" x="810" y="330" width="16" height="16"/>
 <rect x="814" y="334" width="8" height="8" fill="#FFFFFF"/>
 <rect class="qr" x="724" y="382" width="16" height="16"/>
 <rect x="728" y="386" width="8" height="8" fill="#FFFFFF"/>
 <rect class="qr" x="760" y="352" width="8" height="8"/>
 <rect class="qr" x="780" y="368" width="8" height="8"/>
 <rect class="qr" x="798" y="352" width="6" height="6"/>
 <rect class="qr" x="770" y="386" width="8" height="8"/>
 <rect class="qr" x="796" y="388" width="6" height="6"/>
 <rect class="qr" x="748" y="372" width="6" height="6"/>
 <text class="s" x="775" y="447" text-anchor="middle">symbol zone — placeholder, not functional</text>

 <!-- phone + viewfinder -->
 <rect class="phone" x="935" y="205" width="120" height="210" rx="14"/>
 <rect class="screen" x="947" y="222" width="96" height="140" rx="6"/>
 <line x1="985" y1="215" x2="1005" y2="215" stroke="#16324F" stroke-width="1.4"/>
 <circle cx="995" cy="388" r="8" fill="none" stroke="#16324F" stroke-width="1.4"/>
 <text class="s" x="995" y="292" text-anchor="middle">camera</text>
 <text class="s" x="995" y="310" text-anchor="middle">view</text>
 <!-- sight line + viewfinder corners on QR zone -->
 <line x1="935" y1="330" x2="838" y2="350" stroke="#16324F" stroke-width="1.4" stroke-dasharray="5 4"/>
 <line x1="935" y1="390" x2="838" y2="382" stroke="#16324F" stroke-width="1.4" stroke-dasharray="5 4"/>
 <path class="vf" d="M700 340 L700 320 L716 320"/>
 <path class="vf" d="M850 340 L850 320 L834 320"/>
 <path class="vf" d="M700 392 L700 412 L716 412"/>
 <path class="vf" d="M850 392 L850 412 L834 412"/>

 <text class="sb" x="652" y="465">Quiet zone + symbol size:</text>
 <line class="blank" x1="840" y1="458" x2="1135" y2="458"/>
 <text class="sb" x="652" y="495">Scan instruction printed:</text>
 <line class="blank" x1="840" y1="488" x2="1135" y2="488"/>

 <path class="flow" d="M895 520 L895 560"/>

 <!-- ============ Bottom: destination + fallback ============ -->
 <rect class="card" x="40" y="560" width="1120" height="170" rx="10"/>
 <text class="h" x="62" y="596">Both routes land on the same plan</text>

 <rect class="panel" x="62" y="616" width="530" height="92" rx="8"/>
 <text class="lb" x="82" y="646">Destination owner</text>
 <text class="s" x="82" y="670">Domain, redirects and content controlled by:</text>
 <line class="blank" x1="82" y1="692" x2="572" y2="692"/>

 <rect class="panel" x="612" y="616" width="526" height="92" rx="8"/>
 <text class="lb" x="632" y="646">Fallback instruction</text>
 <text class="s" x="632" y="670">Printed alternative when the tap or scan fails:</text>
 <line class="blank" x1="632" y1="692" x2="1118" y2="692"/>

 <!-- footer -->
 <text class="s" x="40" y="770">A tap or scan opens a page — neither authenticates the product.</text>
 <text class="s" x="40" y="792">Who supplies, encodes and verifies tags or codes is assigned per project.</text>
 <text class="s" x="40" y="852">Illustrative planning diagram — symbols are placeholders; no read range, compatibility or service is implied.</text>
</svg>
