<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1900" viewBox="0 0 360 1900" role="img" aria-label="Three sample states, unused roll, applied label, and applied label under use stress, flow into four blank evidence fields: report scope, model support, real-time evidence and the limited claim.">
 <defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#16324F"/>
  </marker>
  <style>
   .t{font:700 21px Arial,Helvetica,sans-serif;fill:#16324F}
   .h{font:700 18px Arial,Helvetica,sans-serif;fill:#16324F}
   .lb{font:700 15px Arial,Helvetica,sans-serif;fill:#16324F}
   .s{font:13px Arial,Helvetica,sans-serif;fill:#5B7186}
   .sb{font:700 13px Arial,Helvetica,sans-serif;fill:#5B7186}
   .tag{font:700 13px Arial,Helvetica,sans-serif;fill:#B07514}
   .card{fill:#F7FAFC;stroke:#B9C6D4;stroke-width:2}
   .panel{fill:#FFFFFF;stroke:#B9C6D4;stroke-width:2}
   .leader{stroke:#16324F;stroke-width:1.4;fill:none;marker-end:url(#arr)}
   .flow{stroke:#16324F;stroke-width:2;fill:none;marker-end:url(#arr)}
   .blank{stroke:#5B7186;stroke-width:1.4;stroke-dasharray:6 4;fill:none}
   .callout{fill:#FFFFFF;stroke:#B07514;stroke-width:1.8;stroke-dasharray:7 5}
   .mat{fill:#FFFFFF;stroke:#16324F;stroke-width:1.8}
   .lbl{fill:#DCE8F2;stroke:#16324F;stroke-width:1.5}
   .stress{fill:none;stroke:#B07514;stroke-width:1.8}
  </style>
 </defs>

 <rect width="360" height="1900" fill="#FFFFFF"/>
 <text class="t" x="24" y="40">Which sample did</text>
 <text class="t" x="24" y="66">the report measure?</text>
 <rect x="24" y="82" width="220" height="30" rx="15" fill="#F0E7C8" stroke="#B07514" stroke-width="1.4"/>
 <text class="tag" x="134" y="102" text-anchor="middle">Concept — fields left blank</text>

 <!-- state 1 -->
 <rect class="card" x="24" y="128" width="312" height="270" rx="10"/>
 <text class="h" x="42" y="160">1 · Unused roll</text>
 <text class="s" x="42" y="182">Stock stored, not yet applied</text>
 <circle class="mat" cx="110" cy="262" r="50"/>
 <circle cx="110" cy="262" r="24" fill="none" stroke="#16324F" stroke-width="1.5"/>
 <circle cx="110" cy="262" r="10" fill="none" stroke="#16324F" stroke-width="1.3"/>
 <path class="mat" d="M110 312 L 310 312 L 310 330 L 118 330 Z"/>
 <text class="s" x="250" y="325" text-anchor="middle">web tail</text>
 <text class="s" x="110" y="266" text-anchor="middle">roll</text>
 <text class="sb" x="42" y="376">Still convertible / applicable?</text>

 <path class="flow" d="M180 406 L180 428"/>

 <!-- state 2 -->
 <rect class="card" x="24" y="436" width="312" height="270" rx="10"/>
 <text class="h" x="42" y="468">2 · Applied label</text>
 <text class="s" x="42" y="490">Construction on the tested substrate</text>
 <rect class="mat" x="60" y="560" width="240" height="38" rx="4"/>
 <text class="s" x="180" y="584" text-anchor="middle">tested substrate</text>
 <rect class="lbl" x="100" y="532" width="160" height="26" rx="4"/>
 <text class="s" x="180" y="550" text-anchor="middle">applied label</text>
 <line class="leader" x1="180" y1="532" x2="180" y2="512"/>
 <text class="s" x="180" y="508" text-anchor="middle">adhesion + legibility</text>
 <text class="sb" x="42" y="684">Attached and readable after aging?</text>

 <path class="flow" d="M180 714 L180 736"/>

 <!-- state 3 -->
 <rect class="card" x="24" y="744" width="312" height="290" rx="10"/>
 <text class="h" x="42" y="776">3 · Applied + use stress</text>
 <text class="s" x="42" y="798">Defined system after stated exposure</text>
 <rect class="mat" x="60" y="880" width="240" height="38" rx="4"/>
 <text class="s" x="180" y="904" text-anchor="middle">tested substrate</text>
 <rect class="lbl" x="100" y="852" width="160" height="26" rx="4"/>
 <text class="s" x="180" y="870" text-anchor="middle">applied label</text>
 <path class="stress" d="M70 826 q12 -13 24 0 q12 13 24 0"/>
 <path class="stress" d="M180 834 c-6 -11 6 -17 3 -27 c11 6 14 17 6 25 c-3 3 -8 3 -9 2 z"/>
 <path class="stress" d="M275 822 l18 -16 m0 0 l-7 2 m7 -2 l-2 7"/>
 <text class="s" x="180" y="950" text-anchor="middle">service stresses defined</text>
 <text class="s" x="180" y="966" text-anchor="middle">per project</text>
 <text class="sb" x="42" y="1012">Meets endpoints after exposure?</text>

 <path class="flow" d="M180 1042 L180 1064"/>

 <!-- evidence fields -->
 <rect class="panel" x="24" y="1072" width="312" height="128" rx="8"/>
 <text class="lb" x="42" y="1100">Report scope</text>
 <text class="s" x="42" y="1122">Sample, lot, substrate, conditions,</text>
 <text class="s" x="42" y="1140">endpoints:</text>
 <line class="blank" x1="42" y1="1164" x2="318" y2="1164"/>
 <line class="blank" x1="42" y1="1186" x2="318" y2="1186"/>

 <rect class="panel" x="24" y="1212" width="312" height="128" rx="8"/>
 <text class="lb" x="42" y="1240">Model support</text>
 <text class="s" x="42" y="1262">Model, assumptions and applicable</text>
 <text class="s" x="42" y="1280">range stated:</text>
 <line class="blank" x1="42" y1="1304" x2="318" y2="1304"/>
 <line class="blank" x1="42" y1="1326" x2="318" y2="1326"/>

 <rect class="panel" x="24" y="1352" width="312" height="128" rx="8"/>
 <text class="lb" x="42" y="1380">Real-time evidence</text>
 <text class="s" x="42" y="1402">Corroborating data at intended</text>
 <text class="s" x="42" y="1420">use conditions:</text>
 <line class="blank" x1="42" y1="1444" x2="318" y2="1444"/>
 <line class="blank" x1="42" y1="1466" x2="318" y2="1466"/>

 <rect class="panel" x="24" y="1492" width="312" height="128" rx="8"/>
 <text class="lb" x="42" y="1520">Limited claim</text>
 <text class="s" x="42" y="1542">Wording limited to the measured</text>
 <text class="s" x="42" y="1560">endpoint:</text>
 <line class="blank" x1="42" y1="1584" x2="318" y2="1584"/>
 <line class="blank" x1="42" y1="1606" x2="318" y2="1606"/>

 <!-- notes -->
 <rect class="callout" x="24" y="1644" width="312" height="86" rx="8"/>
 <text class="lb" x="40" y="1670">One endpoint is not the others</text>
 <text class="s" x="40" y="1692">Adhesion alone does not establish</text>
 <text class="s" x="40" y="1710">legibility, codes or edge lift.</text>

 <rect class="callout" x="24" y="1744" width="312" height="86" rx="8"/>
 <text class="lb" x="40" y="1770">No universal factor</text>
 <text class="s" x="40" y="1792">Extrapolation needs model support;</text>
 <text class="s" x="40" y="1810">untested durations stay open.</text>

 <text class="s" x="24" y="1862">Illustrative planning diagram — no</text>
 <text class="s" x="24" y="1882">lifetime or test outcome implied.</text>
</svg>
