<svg xmlns="http://www.w3.org/2000/svg" width="420" height="780" viewBox="0 0 420 780" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept drawing of a service-cover seal and a carton seal, with wording review before printing and separate case review after observation.">
  <rect width="420" height="780" fill="#FEFEFC"/>

  <!-- Wording path -->
  <rect x="45" y="34" width="330" height="120" rx="10" fill="#FFFDF7" stroke="#9A6B1F" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="110" y="22" width="200" height="28" rx="6" fill="#FBF4E4" stroke="#9A6B1F" stroke-width="2"/>
  <text x="210" y="41" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A5410">Draft - review required</text>
  <text x="210" y="88" text-anchor="middle" font-size="18" font-style="italic" fill="#16324F">&#8220;Warranty void if removed&#8221;</text>
  <text x="210" y="122" text-anchor="middle" font-size="13" fill="#5B7186">proposed wording - not released</text>
  <line x1="210" y1="154" x2="210" y2="190" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2m)"/>
  <rect x="45" y="190" width="330" height="70" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="218" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Wording review</text>
  <text x="210" y="242" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">before print release</text>
  <line x1="210" y1="260" x2="210" y2="296" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2m)"/>
  <rect x="45" y="296" width="330" height="56" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="331" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Print release</text>

  <line x1="30" y1="388" x2="390" y2="388" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Placement drawings side by side -->
  <text x="115" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Service access</text>
  <rect x="45" y="436" width="140" height="76" rx="9" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <circle cx="68" cy="458" r="7" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <circle cx="162" cy="458" r="7" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <circle cx="68" cy="492" r="7" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <circle cx="162" cy="492" r="7" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <rect x="140" y="478" width="62" height="24" rx="5" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="171" y="495" text-anchor="middle" font-size="11" fill="#16324F">seal</text>

  <text x="305" y="424" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Carton opening</text>
  <rect x="240" y="436" width="130" height="76" rx="6" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <line x1="240" y1="436" x2="305" y2="456" stroke="#4A7196" stroke-width="1.5"/>
  <line x1="370" y1="436" x2="305" y2="456" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="298" y="432" width="14" height="48" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>

  <line x1="210" y1="516" x2="210" y2="552" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2m)"/>
  <rect x="45" y="552" width="330" height="68" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="580" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Observe condition</text>
  <text x="210" y="604" text-anchor="middle" font-size="13" fill="#5B7186">intact / damaged / missing / uncertain</text>
  <line x1="210" y1="620" x2="210" y2="656" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT2m)"/>
  <rect x="45" y="656" width="330" height="54" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="689" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Review the case</text>
  <text x="210" y="748" text-anchor="middle" font-size="13" fill="#5B7186">A seal observation is not a coverage decision.</text>

  <defs>
    <marker id="arrT2m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
