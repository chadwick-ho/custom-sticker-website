<svg xmlns="http://www.w3.org/2000/svg" width="420" height="900" viewBox="0 0 420 900" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept diagram separating a supplement opening-seal observation from child-resistant bottle-and-closure evidence.">
  <rect width="420" height="900" fill="#FEFEFC"/>
  <text x="210" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#16324F">Different questions</text>

  <!-- Lane A -->
  <g transform="translate(130,60)">
    <rect x="40" y="0" width="80" height="40" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
    <line x1="40" y1="13" x2="120" y2="13" stroke="#4A7196" stroke-width="1.5"/>
    <line x1="40" y1="25" x2="120" y2="25" stroke="#4A7196" stroke-width="1.5"/>
    <path d="M 52 40 L 52 68 L 108 68 L 108 40" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <path d="M 40 68 L 30 98 L 130 98 L 120 68" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <rect x="24" y="46" width="112" height="16" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
    <text x="80" y="59" text-anchor="middle" font-size="12" fill="#16324F">seal</text>
  </g>
  <line x1="210" y1="164" x2="210" y2="196" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1m)"/>
  <rect x="40" y="196" width="340" height="58" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="232" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Opening-seal observation</text>
  <line x1="210" y1="254" x2="210" y2="284" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1m)"/>
  <rect x="40" y="284" width="340" height="62" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="310" text-anchor="middle" font-size="16" fill="#16324F">Seal opening-cue decision</text>
  <text x="210" y="332" text-anchor="middle" font-size="13" fill="#5B7186">visible opening record only</text>

  <line x1="30" y1="380" x2="390" y2="380" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Lane B -->
  <g transform="translate(95,400)">
    <rect x="50" y="0" width="72" height="38" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
    <line x1="50" y1="12" x2="122" y2="12" stroke="#4A7196" stroke-width="1.5"/>
    <line x1="50" y1="24" x2="122" y2="24" stroke="#4A7196" stroke-width="1.5"/>
    <path d="M 55 38 L 55 62 L 117 62 L 117 38" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <rect x="42" y="62" width="88" height="46" rx="6" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <rect x="146" y="14" width="30" height="40" rx="4" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <text x="161" y="39" text-anchor="middle" font-size="11" fill="#5B7186">liner</text>
    <rect x="150" y="64" width="30" height="42" rx="4" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
    <text x="165" y="90" text-anchor="middle" font-size="11" fill="#5B7186">seal</text>
  </g>
  <rect x="30" y="524" width="360" height="56" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="549" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Bottle + closure +</text>
  <text x="210" y="571" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">relevant components</text>
  <line x1="210" y1="580" x2="210" y2="608" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1m)"/>
  <rect x="30" y="608" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="634" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Child-resistant package evidence</text>
  <text x="210" y="658" text-anchor="middle" font-size="13" fill="#5B7186">protocol documents for the identified package</text>
  <line x1="210" y1="678" x2="210" y2="706" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT1m)"/>
  <rect x="30" y="706" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="732" text-anchor="middle" font-size="16" fill="#16324F">Child-resistant package decision</text>
  <text x="210" y="754" text-anchor="middle" font-size="13" fill="#5B7186">responsible product and packaging team</text>

  <rect x="50" y="800" width="320" height="50" rx="10" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2.5"/>
  <text x="210" y="832" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Separate decisions</text>
  <text x="210" y="882" text-anchor="middle" font-size="14" fill="#5B7186">Concept only - no test result</text>

  <defs>
    <marker id="arrT1m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
  </defs>
</svg>
