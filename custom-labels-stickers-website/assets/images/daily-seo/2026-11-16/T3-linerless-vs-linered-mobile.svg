<svg xmlns="http://www.w3.org/2000/svg" width="420" height="960" viewBox="0 0 420 960" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Concept paths comparing linered media with a peel point and spent liner against linerless media using a compatible non-stick path and output step.">
  <rect width="420" height="960" fill="#FEFEFC"/>

  <!-- Lane A -->
  <text x="210" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Linered media</text>
  <rect x="80" y="48" width="260" height="58" rx="9" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <rect x="96" y="60" width="90" height="17" fill="#F4F7FA" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="96" y="77" width="90" height="17" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <text x="250" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Label + liner</text>
  <line x1="210" y1="106" x2="210" y2="140" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3m)"/>
  <rect x="80" y="140" width="260" height="52" rx="9" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="172" text-anchor="middle" font-size="17" font-weight="bold" fill="#16324F">Peel point</text>
  <line x1="140" y1="192" x2="140" y2="222" stroke="#8299B0" stroke-width="2.5" marker-end="url(#arrT3mg)"/>
  <rect x="45" y="222" width="190" height="46" rx="9" fill="#F4F7FA" stroke="#8299B0" stroke-width="2"/>
  <text x="140" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="#5B7186">Spent liner</text>
  <line x1="280" y1="192" x2="280" y2="224" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="280" y1="224" x2="376" y2="224" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="376" y1="224" x2="376" y2="742" stroke="#4A7196" stroke-width="2.5"/>

  <line x1="30" y1="304" x2="390" y2="304" stroke="#B9C6D4" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Lane B -->
  <text x="210" y="338" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Linerless media</text>
  <rect x="80" y="352" width="260" height="76" rx="9" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <rect x="96" y="362" width="228" height="26" fill="#DCE8F2" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="96" y="392" width="228" height="26" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <text x="210" y="380" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Release-coated face</text>
  <text x="210" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#16324F">Adhesive side</text>
  <line x1="210" y1="428" x2="210" y2="462" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3m)"/>
  <rect x="80" y="462" width="260" height="56" rx="9" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <rect x="96" y="482" width="228" height="16" rx="6" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="210" y="479" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Compatible non-stick path</text>
  <line x1="210" y1="518" x2="210" y2="552" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3m)"/>
  <rect x="80" y="552" width="260" height="56" rx="9" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <circle cx="140" cy="580" r="7" fill="none" stroke="#4A7196" stroke-width="2"/>
  <circle cx="170" cy="580" r="7" fill="none" stroke="#4A7196" stroke-width="2"/>
  <line x1="143" y1="585" x2="167" y2="604" stroke="#4A7196" stroke-width="2"/>
  <line x1="167" y1="585" x2="143" y2="604" stroke="#4A7196" stroke-width="2"/>
  <text x="240" y="588" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Cut / output</text>
  <line x1="210" y1="608" x2="210" y2="742" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3m)"/>

  <!-- Bottle -->
  <rect x="176" y="748" width="44" height="22" rx="5" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
  <rect x="182" y="770" width="32" height="10" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <rect x="150" y="780" width="96" height="80" rx="9" fill="#F4F7FA" stroke="#4A7196" stroke-width="2.5"/>
  <rect x="150" y="806" width="96" height="30" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="2"/>
  <text x="198" y="826" text-anchor="middle" font-size="13" fill="#16324F">label</text>
  <line x1="376" y1="742" x2="376" y2="820" stroke="#4A7196" stroke-width="2.5"/>
  <line x1="376" y1="820" x2="252" y2="820" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3m)"/>
  <line x1="198" y1="860" x2="198" y2="888" stroke="#4A7196" stroke-width="2.5" marker-end="url(#arrT3m)"/>
  <rect x="60" y="888" width="280" height="56" rx="9" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="200" y="912" text-anchor="middle" font-size="16" font-weight="bold" fill="#16324F">Check applied output</text>
  <text x="200" y="934" text-anchor="middle" font-size="12" fill="#5B7186">agreed criteria - not a result</text>

  <defs>
    <marker id="arrT3m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#4A7196"/>
    </marker>
    <marker id="arrT3mg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#8299B0"/>
    </marker>
  </defs>
  <text x="210" y="956" text-anchor="middle" font-size="12" fill="#5B7186">Conceptual paths - not machine drawings</text>
</svg>
