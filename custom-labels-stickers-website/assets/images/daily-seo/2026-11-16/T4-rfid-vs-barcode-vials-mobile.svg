<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1000" viewBox="0 0 420 1000" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Schematic comparison of an optical vial scan and an RFID tray read zone, with an invented expected-versus-observed identifier example.">
  <rect width="420" height="1000" fill="#FEFEFC"/>

  <!-- Optical panel -->
  <rect x="20" y="16" width="380" height="262" rx="12" fill="#FBFCFD" stroke="#B9C6D4" stroke-width="2"/>
  <text x="210" y="50" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">Optical scan</text>
  <rect x="52" y="86" width="64" height="50" rx="9" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
  <circle cx="84" cy="111" r="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="84" y="160" text-anchor="middle" font-size="12" fill="#5B7186">reader</text>
  <line x1="116" y1="111" x2="196" y2="172" stroke="#2E5F8A" stroke-width="3"/>
  <text x="238" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Present the</text>
  <text x="238" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">visible code</text>
  <rect x="206" y="150" width="36" height="16" rx="3" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="198" y="166" width="52" height="82" rx="7" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <rect x="198" y="190" width="52" height="36" fill="#FFFFFF" stroke="#2E5F8A" stroke-width="1.5"/>
  <line x1="206" y1="197" x2="206" y2="219" stroke="#16324F" stroke-width="3"/>
  <line x1="213" y1="197" x2="213" y2="219" stroke="#16324F" stroke-width="2"/>
  <line x1="220" y1="197" x2="220" y2="219" stroke="#16324F" stroke-width="4"/>
  <line x1="229" y1="197" x2="229" y2="219" stroke="#16324F" stroke-width="2"/>
  <line x1="236" y1="197" x2="236" y2="219" stroke="#16324F" stroke-width="3"/>
  <text x="224" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#16324F">DEMO-V01</text>
  <text x="298" y="196" font-size="12" fill="#5B7186">line of sight</text>
  <text x="290" y="214" font-size="12" fill="#5B7186">one vial at a time</text>

  <!-- RFID panel -->
  <rect x="20" y="292" width="380" height="380" rx="12" fill="#FBFCFD" stroke="#B9C6D4" stroke-width="2"/>
  <text x="210" y="326" text-anchor="middle" font-size="19" font-weight="bold" fill="#16324F">RAIN RFID pilot</text>
  <rect x="40" y="356" width="56" height="46" rx="8" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
  <circle cx="68" cy="379" r="10" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="68" y="428" text-anchor="middle" font-size="12" fill="#5B7186">reader</text>
  <path d="M 96 360 Q 122 360 132 376" fill="none" stroke="#8299B0" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M 96 379 Q 126 379 138 392" fill="none" stroke="#8299B0" stroke-width="2.5" stroke-dasharray="5 5"/>
  <path d="M 96 398 Q 130 398 142 408" fill="none" stroke="#8299B0" stroke-width="2.5" stroke-dasharray="5 5"/>
  <rect x="140" y="348" width="246" height="236" rx="13" fill="none" stroke="#4A7196" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="263" y="376" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Intended read zone</text>
  <text x="263" y="396" text-anchor="middle" font-size="13" fill="#5B7186">- schematic -</text>
  <rect x="156" y="492" width="214" height="62" rx="7" fill="#E8EEF4" stroke="#4A7196" stroke-width="2"/>
  <rect x="166" y="438" width="30" height="14" rx="3" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="161" y="452" width="40" height="54" rx="5" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <rect x="166" y="470" width="30" height="24" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="181" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#16324F">DEMO-V01</text>
  <rect x="248" y="438" width="30" height="14" rx="3" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="243" y="452" width="40" height="54" rx="5" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <rect x="248" y="470" width="30" height="24" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="263" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#16324F">DEMO-V02</text>
  <rect x="330" y="438" width="30" height="14" rx="3" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="325" y="452" width="40" height="54" rx="5" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <rect x="330" y="470" width="30" height="24" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="345" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#16324F">DEMO-V03</text>
  <rect x="60" y="492" width="30" height="14" rx="3" fill="#E8EEF4" stroke="#4A7196" stroke-width="1.5"/>
  <rect x="55" y="506" width="40" height="54" rx="5" fill="#F4F7FA" stroke="#4A7196" stroke-width="2"/>
  <rect x="60" y="524" width="30" height="24" fill="#DCE8F2" stroke="#2E5F8A" stroke-width="1.5"/>
  <text x="75" y="582" text-anchor="middle" font-size="11" font-weight="bold" fill="#16324F">DEMO-X9</text>
  <text x="263" y="644" text-anchor="middle" font-size="12" fill="#5B7186">dashed zone = task boundary,</text>
  <text x="263" y="662" text-anchor="middle" font-size="12" fill="#5B7186">not a measured cutoff</text>

  <!-- Invented set example -->
  <rect x="20" y="688" width="380" height="296" rx="12" fill="#FFFFFF" stroke="#4A7196" stroke-width="2"/>
  <text x="210" y="724" text-anchor="middle" font-size="18" font-weight="bold" fill="#16324F">Invented set example</text>
  <text x="210" y="766" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Expected: V01, V02, V03</text>
  <text x="210" y="806" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Assumed observed:</text>
  <text x="210" y="828" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">V01, V03, X9</text>
  <text x="210" y="868" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Missing: V02</text>
  <text x="210" y="900" text-anchor="middle" font-size="15" font-weight="bold" fill="#16324F">Extra: X9</text>
  <text x="210" y="946" text-anchor="middle" font-size="12" fill="#5B7186">Invented DEMO values;</text>
  <text x="210" y="964" text-anchor="middle" font-size="12" fill="#5B7186">observation is assumed.</text>
</svg>
