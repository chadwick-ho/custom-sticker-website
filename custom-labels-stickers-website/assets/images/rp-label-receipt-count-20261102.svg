<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Count the right unit</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Separate cartons, rolls and label</text>
<text x="30" y="212" fill="#344c49" font-size="25" font-family="Arial,sans-serif">quantities.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Order and design</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the SKU, revision and ordered</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">units.</text>
<text x="45" y="373" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Check approved quantity variations.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Cartons and rolls</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Count cartons and identify each roll.</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Mark partial or unidentified rolls.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Label quantities</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the supplier-stated quantity.</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">State the actual counting method.</text>
</svg>