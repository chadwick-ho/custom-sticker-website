<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Sticky roll: supplier handoff</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Document evidence without assuming the</text>
<text x="30" y="212" fill="#344c49" font-size="25" font-family="Arial,sans-serif">cause.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Identify the roll</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record roll ID, construction and order.</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Keep the packaging and photograph the</text>
<text x="45" y="373" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">edge.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Record the conditions</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the model and observed location.</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Note known storage or handling</text>
<text x="45" y="613" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">exceptions.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Compare responsibly</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Use a comparable roll only if permitted.</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Keep setup and conditions consistent.</text>
<rect x="25" y="945" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="992" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">4. Agree the disposition</text>
<text x="45" y="1031" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Keep affected stock identified and on</text>
<text x="45" y="1062" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">hold.</text>
<text x="45" y="1093" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Ask who reviews inspection or</text>
<text x="45" y="1124" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">replacement.</text>
</svg>