<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Representation can change at export</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Concept only · not a rendering-defect example</text><text x="35" y="275" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Live objects with an overlap</text><rect opacity="0.7" x="105" y="315" width="300" height="150" rx="0" fill="#478e7c" stroke="#92afa2" stroke-width="2"/><rect opacity="0.7" x="285" y="385" width="300" height="150" rx="0" fill="#c69b53" stroke="#92afa2" stroke-width="2"/><text x="35" y="620" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">A divided output representation</text><rect x="105" y="660" width="180" height="150" rx="0" fill="#7aad9e" stroke="#92afa2" stroke-width="2"/><rect x="285" y="660" width="120" height="70" rx="0" fill="#7aad9e" stroke="#92afa2" stroke-width="2"/><rect x="285" y="730" width="120" height="80" rx="0" fill="#afa06a" stroke="#92afa2" stroke-width="2"/><rect x="405" y="730" width="180" height="150" rx="0" fill="#d3b682" stroke="#92afa2" stroke-width="2"/><rect x="285" y="810" width="120" height="70" rx="0" fill="#d3b682" stroke="#92afa2" stroke-width="2"/><text x="35" y="980" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Ask how the actual content will be processed.</text><text x="35" y="1020" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">No visible seam or failure is predicted here.</text><text x="35" y="1060" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Compare the actual export with the agreed intent.</text></svg>