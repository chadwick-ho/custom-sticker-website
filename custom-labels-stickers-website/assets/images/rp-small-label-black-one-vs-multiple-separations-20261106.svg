<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">One-looking black can have many plates</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Schematic only · enlarged alignment question</text><text x="35" y="270" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">One process-black separation</text><rect x="60" y="310" width="580" height="150" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="110" y="409" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#101010">LABEL COPY</text><text x="35" y="518" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">The letter shape is carried on one plate.</text><text x="35" y="615" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Multiple process separations</text><rect x="60" y="655" width="580" height="190" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="105" y="771" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#00a1c8">LABEL COPY</text><text x="115" y="776" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#d60078">LABEL COPY</text><text x="110" y="781" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#d4b600">LABEL COPY</text><text x="110" y="775" font-family="Arial,sans-serif" font-size="58" font-weight="bold" fill="#101010">LABEL COPY</text><text x="35" y="920" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Offsets illustrate a question, not a press result.