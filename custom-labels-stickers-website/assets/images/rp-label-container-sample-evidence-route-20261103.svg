<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PRACTICAL BUYING GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Keep the object linked to the decision</text><rect x="35" y="190" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="233" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Select the actual reference</text><text x="58" y="276" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Production part or identified candidate</text><text x="58" y="318" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Mark differences before dispatch.</text><path d="M350 350 L350 381" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="390" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="433" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Agree the review and handling</text><text x="58" y="476" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Quantity, scope, receipt and return plan</text><text x="58" y="518" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Resolve contents before shipping.</text><path d="M350 550 L350 581" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="590" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="633" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Confirm receipt identity</text><text x="58" y="676" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Which object arrived, in what condition?</text><text x="58" y="718" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Do not substitute without recording it.</text><path d="M350 750 L350 781" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="790" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="833" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Return identified observations</text><text x="58" y="876" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Container + artwork + construction</text><text x="58" y="918" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Record covered decisions and open items.</text><text x="35" y="1025" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">A geometry sample does not approve every use.</text></svg>