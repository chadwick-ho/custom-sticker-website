<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1020" viewBox="0 0 700 1020" role="img"><rect width="700" height="1020" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="31" fill="white" font-weight="bold">Two records, one actual shipment</text><rect x="30" y="200" width="305" height="345" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="52" y="251" font-family="Arial,sans-serif" font-size="32" fill="#163e36" font-weight="bold">Invoice</text><text x="52" y="319" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Goods description</text><text x="52" y="388" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Quantity + unit</text><text x="52" y="457" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Value + currency</text><path d="M182 550 L182 625" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="365" y="200" width="305" height="345" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="387" y="251" font-family="Arial,sans-serif" font-size="32" fill="#163e36" font-weight="bold">Packing list</text><text x="387" y="319" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Carton references</text><text x="387" y="388" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Roll / design map</text><text x="387" y="457" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Actual pack details</text><path d="M517 550 L517 625" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M182 625 L517 625" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M350 625 L350 700" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="65" y="700" width="570" height="175" rx="12" fill="#e2ebdd" stroke="#bfd2c4" stroke-width="2"/><text x="88" y="750" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="bold">Same goods and consistent quantity units</text><text x="88" y="804" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Supplier + importer + carrier / broker</text><text x="88" y="849" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Resolve route-specific questions.</text><text x="35" y="966" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">A packing list does not prove a measured count.</text></svg>