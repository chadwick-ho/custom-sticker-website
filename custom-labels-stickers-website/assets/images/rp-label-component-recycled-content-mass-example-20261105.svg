<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Check the percentage denominator</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Fictional dry mass · excludes release liner</text><text x="35" y="278" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">100 g example finished-label construction</text><rect x="45" y="325" width="427" height="140" rx="0" fill="#c4d8bd" stroke="#b8ccc1" stroke-width="2"/><rect x="45" y="325" width="128.1" height="140" rx="0" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="472" y="325" width="183" height="140" rx="0" fill="#d6e1e1" stroke="#b8ccc1" stroke-width="2"/><text x="70" y="507" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">70 g face</text><text x="450" y="507" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173d37">30 g other layers</text><path d="M173 330 L173 270" fill="none" stroke="#ad7542" stroke-width="4"/><text x="35" y="586" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Face material: 30% recycled by mass</text><rect x="35" y="630" width="630" height="160" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="65" y="681" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">70 g × 30% = 21 g recycled input</text><text x="65" y="741" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">21 g ÷ 100 g = 21% of this example</text><rect x="35" y="860" width="630" height="130" rx="10" fill="#f4e5cf" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="906" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#173d37">Component percentage ≠ whole percentage</text><text x="60" y="953" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Assumptions must match the actual evidence.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Illustration only; not approved claim wording.</text></svg>