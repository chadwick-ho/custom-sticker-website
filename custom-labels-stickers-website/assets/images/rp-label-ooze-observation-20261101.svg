<text x="30" y="50" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="103" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Where is the sticky material?</text>
<text x="30" y="185" font-family="Arial,sans-serif" font-size="25" fill="#27443e">Locate the symptom before assigning a cause.</text>
