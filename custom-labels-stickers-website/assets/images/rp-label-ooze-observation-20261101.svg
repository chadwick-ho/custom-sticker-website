<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="title desc">
<title id="title">Where is the sticky material?</title><desc id="desc">An illustrative roll, label web and machine contact point show three locations to inspect.</desc>
