<path d="M480 330 C545 310 581 323 623 350 L623 426 C580 397 548 389 481 408" fill="#ffffff" stroke="#45695f" stroke-width="6"/><path d="M505 337 l25 -7 v58 l-25 7z M547 329 l25 3 v59 l-25 -4z M589 337 l22 10 v58 l-22 -10z" fill="#c5dfc2" stroke="#61906c" stroke-width="2"/>
<circle cx="237" cy="293" r="24" fill="#c87331"/><text x="229" y="302" font-size="25" fill="white" font-family="Arial,sans-serif" font-weight="bold">1</text><circle cx="548" cy="325" r="24" fill="#c87331"/><text x="540" y="334" font-size="25" fill="white" font-family="Arial,sans-serif" font-weight="bold">2</text><circle cx="605" cy="427" r="24" fill="#c87331"/><text x="597" y="436" font-size="25" fill="white" font-family="Arial,sans-serif" font-weight="bold">3</text>
<rect x="30" y="566" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="605" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">1 · Roll edge</text><text x="50" y="643" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Photograph the edge before loading.</text>
<rect x="30" y="682" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="721" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">2 · Label or liner</text><text x="50" y="759" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Record where material appears.</text>
<rect x="30" y="798" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="837" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">3 · Machine path</text><text x="50" y="875" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Stop and follow the equipment procedure.</text>
