<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="t d">
<title id="t">Compare color in context</title><desc id="d">A reference, bottle label and carton should be compared under agreed light.</desc><rect width="700" height="940" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/><text x="30" y="50" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="103" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Compare color in context</text><text x="30" y="185" font-family="Arial,sans-serif" font-size="25" fill="#27443e">Agree the reference, parts and viewing light.</text>
<rect x="40" y="230" width="180" height="230" rx="12" fill="white" stroke="#d5e3df" stroke-width="3"/><rect x="75" y="285" width="110" height="90" fill="#6e9c78" stroke="#45695f" stroke-width="3"/><text x="65" y="425" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#123934">REFERENCE</text>
<rect x="260" y="230" width="180" height="230" rx="12" fill="white" stroke="#d5e3df" stroke-width="3"/><rect x="312" y="275" width="75" height="130" rx="12" fill="#dde8dd" stroke="#45695f" stroke-width="4"/><rect x="325" y="261" width="49" height="18" fill="#45695f"/><rect x="318" y="324" width="63" height="55" fill="#6e9c78"/><text x="302" y="438" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#123934">LABEL</text>
<rect x="480" y="230" width="180" height="230" rx="12" fill="white" stroke="#d5e3df" stroke-width="3"/><rect x="520" y="275" width="100" height="130" fill="#dfd2b7" stroke="#806f52" stroke-width="4"/><rect x="532" y="324" width="76" height="55" fill="#6e9c78"/><text x="525" y="438" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#123934">CARTON</text>
<rect x="30" y="520" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="560" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">1 · Identify the reference</text><text x="50" y="598" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Keep the approved master and revision.</text>
<rect x="30" y="634" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="674" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">2 · Compare finished parts</text><text x="50" y="712" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Record material, finish and viewing angle.</text>
<rect x="30" y="748" width="640" height="135" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="788" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">3 · Agree the lighting</text><text x="50" y="826" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Specify who decides and under which light.</text><text x="50" y="860" font-family="Arial,sans-serif" font-size="22" fill="#526763">Screen colors are illustrative, not a color standard.</text></svg>
