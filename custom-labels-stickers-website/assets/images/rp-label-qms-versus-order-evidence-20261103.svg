<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PURCHASING EVIDENCE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Two layers of purchasing evidence</text><rect x="30" y="205" width="305" height="405" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="52" y="255" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Management system</text><text x="52" y="323" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Organization</text><text x="52" y="397" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Site and activities</text><text x="52" y="471" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Certificate status</text><text x="52" y="545" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Supplier qualification</text><rect x="365" y="205" width="305" height="405" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="387" y="255" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Actual label order</text><text x="387" y="323" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Approved artwork</text><text x="387" y="397" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Material and use</text><text x="387" y="471" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Inspection scope</text><text x="387" y="545" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Shipment acceptance</text><path d="M182 615 L182 710" stroke="#ad7542" stroke