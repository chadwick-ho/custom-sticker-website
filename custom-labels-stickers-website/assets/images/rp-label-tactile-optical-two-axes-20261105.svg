ill="#173d37">Choose the requirements for the pack.</text><text x="35" y="850" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Then identify the proposed construction.</text><text x="35" y="908" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Check feel on a real finished sample.</text><text x="35" y="966" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Mark resistance is another property.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">A screen cannot reproduce a tactile approval.</text></svg>