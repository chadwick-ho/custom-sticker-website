<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="t d">
<title id="t">Where will labels see light?</title><desc id="d">Illustration comparing boxed storage, indoor display and window display.</desc>
<rect width="700" height="940" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/><text x="30" y="50" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="103" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Where will labels see light?</text>
<text x="30" y="185" font-family="Arial,sans-serif" font-size="25" fill="#27443e">Define exposure before selecting a comparison.</text>
<rect x="30" y="235" width="195" height="240" rx="12" fill="#fff" stroke="#d5e3df" stroke-width="3"/><rect x="65" y="300" width="125" height="105" fill="#d8c49e" stroke="#806f52" stroke-width="4"/><path d="M65 315 L190 315 M127 300 L127 315" stroke="#806f52" stroke-width="4"/><text x="65" y="450" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#123934">BOXED</text>
<rect x="252" y="235" width="195" height="240" rx="12" fill="#fff" stroke="#d5e3df" stroke-width="3"/><rect x="316" y="289" width="68" height="110" rx="11" fill="#dae6d8" stroke="#45695f" stroke-width="4"/><rect x="326" y="274" width="48" height="18" fill="#45695f"/><rect x="323" y="329" width="54" height="48" fill="#f0c88d"/><path d="M275 405 L425 405 M350 255 L350 240" stroke="#45695f" stroke-width="4"/><text x="292" y="450" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#123934">INDOOR</text>
<rect x="474" y="235" width="195" height="240" rx="12" fill="#fff" stroke="#d5e3df" stroke-width="3"/><rect x="499" y="265" width="145" height="125" fill="#e2f2f4" stroke="#87aeb1" stroke-width="4"/><path d="M571 265 V390 M499 327 H644" stroke="#87aeb1" stroke-width="3"/><circle cx="621" cy="283" r="17" fill="#f4c761"/><rect x="537" y="319" width="68" height="90" rx="9" fill="#dae6d8" stroke="#45695f" stroke-width="4"/><rect x="547" y="305" width="48" height="18" fill="#45695f"/><rect x="544" y="347" width="54" height="40" fill="#f0c88d"/><text x="500" y="450" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#123934">WINDOW</text>
<rect x="30" y="530" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="570" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">1 · Record the environment</text><text x="50" y="608" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Location, light and expected duration.</text>
<rect x="30" y="644" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="684" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">2 · Identify the construction</text><text x="50" y="722" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Ink, label material and protective finish.</text>
<rect x="30" y="758" width="640" height="135" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="798" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">3 · Agree a comparison</text><text x="50" y="836" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Choose controls, observations and a reviewer.</text><text x="50" y="870" font-family="Arial,sans-serif" font-size="23" fill="#526763">Illustrative categories; not a test result.</text>
</svg>
