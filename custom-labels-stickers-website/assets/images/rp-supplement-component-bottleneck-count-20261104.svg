<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Compare capacity in complete packs</text><text x="35" y="203" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Fictional usable stock · excludes allowances</text><text x="45" y="270" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Bottle labels</text><text x="340" y="270" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="normal">10,000 ÷ 1</text><rect x="45" y="295" width="560" height="52" rx="0" fill="#326951" stroke="#bed2c3" stroke-width="2"/><text x="45" y="392" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">10,000 complete packs</text><text x="45" y="455" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Cartons</text><text x="340" y="455" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="normal">9,800 ÷ 1</text><rect x="45" y="480" width="548.8" height="52" rx="0" fill="#326951" stroke="#bed2c3" stroke-width="2"/><text x="45" y="577" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">9,800 complete packs</text><text x="45" y="640" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Closure seals</text><text x="340" y="640" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="normal">19,200 ÷ 2</text><rect x="45" y="665" width="537.6" height="52" rx="0" fill="#326951" stroke="#bed2c3" stroke-width="2"/><text x="45" y="762" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">9,600 complete packs</text><path d="M582.6 303 L582.6 735" stroke="#ad7542" stroke-width="4" fill="none" stroke-dasharray="9 8"/><rect x="35" y="840" width="630" height="143" rx="12" fill="#f5e5cb" stroke="#bed2c3" stroke-width="2"/><text x="60" y="887" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">The first bottleneck is the seals.</text><text x="60" y="933" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Base gaps for a 10,000-pack plan:</text><text x="60" y="972" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">200 cartons + 800 individual seals</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Setup, spares and MOQ remain separate inputs.</text></svg>