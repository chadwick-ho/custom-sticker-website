<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">A number needs an agreed basis</text><rect x="35" y="205" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="247" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Reference</text><text x="60" y="291" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Exact retained sample / target revision</text><text x="60" y="331" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Critical print area and specimen identity</text><path d="M350 353 L350 390" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="395" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="437" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Equation</text><text x="60" y="481" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">CIE1976, CIEDE2000 or agreed method</text><text x="60" y="521" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Record parameters where relevant.</text><path d="M350 543 L350 580" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="585" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="627" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Measurement and specimen</text><text x="60" y="671" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Actual provider method and presentation</text><text x="60" y="711" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Construction, finish and backing if relevant</text><path d="M350 733 L350 770" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="775" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="817" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Decision rule</text><text x="60" y="861" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Agreed feasible limit and response</text><text x="60" y="901" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Keep actual measurement separate.</text><text x="35" y="1035" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">A request is not an existing RP measurement service.</text></svg>