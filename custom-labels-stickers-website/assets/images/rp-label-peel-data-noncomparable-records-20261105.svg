<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Two peel records do not yet rank</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Fictional figures · not material specifications</text><rect x="35" y="250" width="630" height="245" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="298" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#173d37">Proposal A</text><text x="60" y="356" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">8 N per 25 mm</text><text x="60" y="413" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">180° peel · stainless steel</text><text x="60" y="470" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">24 hours before measurement</text><rect x="35" y="560" width="630" height="245" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="608" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#173d37">Proposal B</text><text x="60" y="666" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">6 N per 25 mm</text><text x="60" y="723" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">90° peel · glass</text><text x="60" y="780" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">20 minutes before measurement</text><rect x="35" y="863" width="630" height="135" rx="10" fill="#f4e5cf" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="908" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">Different geometry, panel and dwell.</text><text x="60" y="958" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Ask for a comparable basis before ranking.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Neither record approves the actual vial.</text></svg>