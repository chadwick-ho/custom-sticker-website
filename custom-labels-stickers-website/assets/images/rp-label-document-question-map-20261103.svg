<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="31" fill="white" font-weight="bold">The question chooses the document</text><rect x="30" y="200" width="640" height="205" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="52" y="245" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Will it work in this process?</text><path d="M75 262 L75 303" stroke="#ad7542" stroke-width="4" fill="none"/><text x="112" y="307" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Technical evidence</text><text x="52" y="361" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Named construction + use conditions</text><rect x="30" y="470" width="640" height="205" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="52" y="515" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">What chemical safety applies?</text><path d="M75 532 L75 573" stroke="#ad7542" stroke-width="4" fill="none"/><text x="112" y="577" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">SDS / safety scope</text><text x="52" y="631" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Product identity + handling context</text><rect x="30" y="740" width="640" height="205" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="52" y="785" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Does it cover this food-contact use?</text><path d="M75 802 L75 843" stroke="#ad7542" stroke-width="4" fill="none"/><text x="112" y="847" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Use-specific evidence</text><text x="52" y="901" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Product + manufacturer + limitations</text><text x="35" y="1015" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Document title alone is not a pass.</text></svg>