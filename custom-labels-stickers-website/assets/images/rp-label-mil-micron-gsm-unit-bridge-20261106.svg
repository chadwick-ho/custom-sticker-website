<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Convert units, not physical quantities</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Exact unit definitions; actual stock still varies.</text><rect x="35" y="255" width="630" height="250" rx="10" fill="#e0eade" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="305" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Length / thickness conversion</text><text x="60" y="368" font-family="Arial,sans-serif" font-size="30" font-weight="normal" fill="#173d37">1 mil = 0.001 inch = 25.4 µm</text><text x="60" y="438" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#173d37">2 mil = 50.8 µm</text><rect x="35" y="610" width="630" height="250" rx="10" fill="#f4e5cf" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="660" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">A different quantity: grammage</text><text x="60" y="722" font-family="Arial,sans-serif" font-size="29" font-weight="normal" fill="#173d37">gsm = grams per square meter</text><text x="60" y="790" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Mass per area is not a thickness unit.</text><text x="35" y="958" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">First match the layer and measurement basis.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">An exact conversion is not a material approval.</text></svg>