<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Length first; repeat count second</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Fictional uniform-web model · not delivered count</text><rect x="35" y="245" width="630" height="205" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="290" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">D = 150 mm · core OD d = 90 mm</text><text x="60" y="345" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Effective wound-web t = 0.09 mm</text><text x="60" y="405" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">L = π(D² − d²) / (4t) ≈ 125,664 mm</text><text x="35" y="535" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">One repeat in the travel direction</text><rect x="60" y="575" width="510.4" height="90" rx="0" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="570.4" y="575" width="69.6" height="90" rx="0" fill="#e2c7a0" stroke="#b8ccc1" stroke-width="2"/><text x="160" y="631" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white">Label length 22 mm</text><text x="525" y="708" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Gap 3 mm</text><path d="M60 745 L640 745" fill="none" stroke="#ad7542" stroke-width="4"/><text x="204" y="791" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Pitch = 22 + 3 = 25 mm</text><rect x="35" y="850" width="630" height="135" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="898" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">floor(125,664 / 25) = 5,026 positions</text><text x="60" y="950" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Before losses, roll weight and actual build limits</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Discrete gaps and real winding need confirmation.</text></svg>