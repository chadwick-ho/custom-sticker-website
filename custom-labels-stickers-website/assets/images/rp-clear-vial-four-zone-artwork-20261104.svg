<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Identify four separate artwork regions</text><text x="35" y="194" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="bold">Fictional clear-film label · not print artwork</text><rect x="35" y="240" width="630" height="485" rx="6" fill="#dce6e5" stroke="#bed2c3" stroke-width="2"/><rect x="60" y="280" width="230" height="155" rx="6" fill="#326951" stroke="#bed2c3" stroke-width="2"/><text x="80" y="326" font-family="Arial,sans-serif" font-size="33" fill="white" font-weight="bold">A</text><text x="80" y="380" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">Brand mark</text><rect x="320" y="280" width="320" height="155" rx="6" fill="#7ea7c1" stroke="#bed2c3" stroke-width="2"/><text x="340" y="326" font-family="Arial,sans-serif" font-size="33" fill="#163e36" font-weight="bold">B</text><text x="340" y="380" font-family="Arial,sans-serif" font-size="24" fill="#163e36" font-weight="bold">Translucent accent</text><rect x="60" y="505" width="230" height="175" rx="6" fill="#fafbf7" stroke="#bed2c3" stroke-width="2"/><text x="80" y="551" font-family="Arial,sans-serif" font-size="33" fill="#163e36" font-weight="bold">C</text><text x="80" y="605" font-family="Arial,sans-serif" font-size="24" fill="#163e36" font-weight="bold">Code field</text><rect x="320" y="505" width="320" height="175" rx="6" fill="#fafbf7" stroke="#bed2c3" stroke-width="2"/><text x="340" y="551" font-family="Arial,sans-serif" font-size="33" fill="#163e36" font-weight="bold">D</text><text x="340" y="605" font-family="Arial,sans-serif" font-size="24" fill="#163e36" font-weight="bold">Viewing window</text><text x="35" y="790" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">A: keep the light brand mark distinct.</text><text x="35" y="841" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">B: retain intentional translucency.</text><text x="35" y="892" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">C: propose a stable contrasting background.</text><text x="35" y="943" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">D: leave the viewing area unbacked.</text><text x="35" y="1020" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">No opacity, trapping or barcode result is proven.</text></svg>