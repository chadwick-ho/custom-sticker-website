<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img"><rect width="700" height="1000" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PRACTICAL BUYING GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Measure the sealed outside package</text><path d="M140 360 L440 360 L570 270 L270 270 Z" fill="#dbe8d3" stroke="#a9bea7" stroke-width="3"/><path d="M140 360 V615 H440 V360 Z" fill="#c5dab8" stroke="#a9bea7" stroke-width="3"/><path d="M440 360 L570 270 V525 L440 615 Z" fill="#9cbd92" stroke="#a9bea7" stroke-width="3"/><path d="M140 665 L440 665" stroke="#ad7542" stroke-width="4" fill="none"/><text x="190" y="715" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Length</text><path d="M480 670 L610 580" stroke="#ad7542" stroke-width="4" fill="none"/><text x="495" y="728" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Width</text><path d="M90 360 L90 615" stroke="#ad7542" stroke-width="4" fill="none"/><text x="35" y="325" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Height</text><rect x="35" y="790" width="630" height="125" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="839" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Gross scale weight includes all packing.</text><text x="58" y="882" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Record each carton and the measurement units.</text><text x="35" y="964" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Schematic only; use actual sealed carton values.</text></svg>