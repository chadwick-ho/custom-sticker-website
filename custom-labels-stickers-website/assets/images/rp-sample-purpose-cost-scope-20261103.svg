<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1000" viewBox="0 0 700 1000" role="img"><rect width="700" height="1000" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · SAMPLE SCOPE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="31" fill="white" font-weight="bold">Which question must the sample answer?</text><rect x="30" y="190" width="640" height="330" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="55" y="236" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Layout and available space</text><rect x="55" y="270" width="150" height="180" rx="12" fill="#e1e8e2" stroke="#bfd2c4" stroke-width="2"/><rect x="70" y="326" width="120" height="68" rx="12" fill="#356650" stroke="#bfd2c4" stroke-width="2"/><text x="230" y="312" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Actual-size paper wrap</text><text x="230" y="361" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Not adhesive-use evidence.</text><text x="55" y="492" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Can support a geometry discussion.</text><rect x="30" y="560" width="640" height="330" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="55" y="606" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Adhesive use conditions</text><rect x="55" y="640" width="150" height="180" rx="12" fill="#e1e8e2" stroke="#bfd2c4" stroke-width="2"/><rect x="70" y="696" width="120" height="68" rx="12" fill="#356650" stroke="#bfd2c4" stroke-width="2"/><text x="230" y="682" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Identified label construction</text><text x="230" y="731" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Material + pack + conditions</text><text x="55" y="862" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Needs the agreed application trial.</text><text x="35" y="946" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="bold">Match scope before comparing charges.</text></svg>