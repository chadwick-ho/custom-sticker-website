<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Roll comparison: what to record</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Use the same approved setup and agreed safe</text>
<text x="30" y="212" fill="#344c49" font-size="25" font-family="Arial,sans-serif">trial conditions.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Identify each roll</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Roll ID, construction, artwork and</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">unwind direction.</text>
<text x="45" y="373" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record packaging condition before</text>
<text x="45" y="404" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">loading.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Keep setup consistent</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Machine model, guide positions, path and</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">product.</text>
<text x="45" y="613" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Use a compatible known-acceptable</text>
<text x="45" y="644" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">comparison roll.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Observe the movement</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Where and when does the liner begin to</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">shift?</text>
<text x="45" y="853" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record whether the symptom follows the</text>
<text x="45" y="884" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">roll.</text>
<rect x="25" y="945" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="992" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">4. Stop and assign the next action</text>
<text x="45" y="1031" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Hold tears, contamination or unsafe</text>
<text x="45" y="1062" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">operation.</text>
<text x="45" y="1093" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Operator and supplier agree disposition</text>
<text x="45" y="1124" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">and evidence.</text>
</svg>