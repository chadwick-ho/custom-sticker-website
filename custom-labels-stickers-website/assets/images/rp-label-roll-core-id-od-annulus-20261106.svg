<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Three different diameter boundaries</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Not to scale · no machine dimensions</text><circle cx="320" cy="495" r="220" fill="#c5d8c2" stroke="#326951" stroke-width="3"/><circle cx="320" cy="495" r="130" fill="#d4b58a" stroke="#326951" stroke-width="3"/><circle cx="320" cy="495" r="90" fill="white" stroke="#326951" stroke-width="3"/><text x="249" y="487" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Opening</text><text x="237" y="536" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#173d37">Mounting ID</text><rect x="35" y="770" width="30" height="30" rx="0" fill="#c5d8c2" stroke="#b8ccc1" stroke-width="2"/><text x="82" y="798" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">D · outside of the full wound roll</text><rect x="35" y="840" width="30" height="30" rx="0" fill="#d4b58a" stroke="#b8ccc1" stroke-width="2"/><text x="82" y="868" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">d · outside of the core tube</text><rect x="35" y="910" width="30" height="30" rx="0" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="82" y="938" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">ID · opening that fits the shaft</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Do not substitute ID for OD in a winding model.</text></svg>