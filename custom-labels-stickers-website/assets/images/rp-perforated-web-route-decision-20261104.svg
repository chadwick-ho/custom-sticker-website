<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">What happens after the roll arrives?</text><rect x="150" y="185" width="400" height="95" rx="12" fill="#e0ebdb" stroke="#bed2c3" stroke-width="2"/><text x="177" y="242" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Proposed perforated web</text><path d="M350 282 L350 335" stroke="#ad7542" stroke-width="4"/><path d="M180 335 L520 335" stroke="#ad7542" stroke-width="4"/><path d="M180 335 L180 380" stroke="#ad7542" stroke-width="4"/><path d="M520 335 L520 380" stroke="#ad7542" stroke-width="4"/><rect x="30" y="380" width="305" height="285" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="52" y="428" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Manual separation</text><text x="52" y="488" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Single piece or group?</text><text x="52" y="553" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Protect the adhesive.</text><text x="52" y="618" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Keep SKU identity.</text><path d="M182 667 L182 730" stroke="#ad7542" stroke-width="4"/><rect x="365" y="380" width="305" height="285" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="387" y="428" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Machine feeding</text><text x="387" y="488" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Identify the full path.</text><text x="387" y="553" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Get line-owner review.</text><text x="387" y="618" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Confirm web integrity.</text><path d="M517 667 L517 730" stroke="#ad7542" stroke-width="4"/><path d="M182 730 L517 730" stroke="#ad7542" stroke-width="4"/><path d="M350 730 L350 790" stroke="#ad7542" stroke-width="4"/><rect x="45" y="790" width="610" height="170" rx="12" fill="#e0ebdb" stroke="#bed2c3" stroke-width="2"/><text x="70" y="837" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Converter confirms the supplied format.</text><text x="70" y="885" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Keep the accepted drawing with the quote.</text><text x="70" y="928" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">A hand tear does not qualify machine use.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">No universal liner or perforation rule.</text></svg>