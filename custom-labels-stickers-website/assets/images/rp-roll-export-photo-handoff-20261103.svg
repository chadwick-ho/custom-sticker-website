<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180"><rect width="700" height="1180" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/><text x="30" y="49" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700">RP LABELS · BUYER GUIDE</text><text x="30" y="103" font-family="Arial,sans-serif" font-size="31" fill="white" font-weight="700">Keep the evidence connected</text><rect x="35" y="190" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="239" font-family="Arial,sans-serif" font-size="29" fill="#193f38" font-weight="700">1 · Before dispatch</text><text x="58" y="290" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Photograph identified rolls and packing.</text><text x="58" y="331" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Record carton IDs and packing list.</text><rect x="35" y="415" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="464" font-family="Arial,sans-serif" font-size="29" fill="#193f38" font-weight="700">2 · At receipt</text><text x="58" y="515" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Record arrival and external condition.</text><text x="58" y="556" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Match the carton IDs before opening.</text><rect x="35" y="640" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="689" font-family="Arial,sans-serif" font-size="29" fill="#193f38" font-weight="700">3 · If an exception appears</text><text x="58" y="740" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Retain relevant packaging and photos.</text><text x="58" y="781" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Identify held stock and who reviews it.</text><rect x="35" y="865" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="914" font-family="Arial,sans-serif" font-size="29" fill="#193f38" font-weight="700">4 · Before release</text><text x="58" y="965" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Agree the inspection and disposition.</text><text x="58" y="1006" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="400">Link the decision to the affected rolls.</text><text x="35" y="1140" font-family="Arial,sans-serif" font-size="24" fill="#193f38" font-weight="400">An evidence record is not a transit guarantee.</text></svg>