<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Foil strokes and open spaces differ</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Enlarged geometry · no minimum implied</text><text x="35" y="272" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Positive stroke: foil must remain</text><rect x="70" y="310" width="560" height="95" rx="3" fill="white" stroke="#b8ccc1" stroke-width="2"/><rect x="110" y="350" width="475" height="16" rx="0" fill="#b58a3d" stroke="#b8ccc1" stroke-width="2"/><text x="35" y="488" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Gap: this area must remain unfoiled</text><rect x="70" y="530" width="560" height="115" rx="3" fill="#b58a3d" stroke="#b8ccc1" stroke-width="2"/><rect x="340" y="530" width="20" height="115" rx="0" fill="#f2f6ef" stroke="#b8ccc1" stroke-width="2"/><text x="35" y="728" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Counter: an opening inside a letter</text><path d="M250 780h200v170h-200z M305 825v80h90v-80z" fill="#b58a3d" fill-rule="evenodd"/><path d="M350 855 L535 855" fill="none" stroke="#ad7542" stroke-width="4"/><text x="547" y="865" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Open</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Ask the finisher about the actual final-size artwork.</text></svg>