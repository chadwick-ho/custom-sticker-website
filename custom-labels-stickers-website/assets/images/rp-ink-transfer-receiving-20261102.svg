<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Check the contact pair</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Document both surfaces before separating.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Printed surface</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the printed area and revision.</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Photograph the condition as received.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Adjacent surface</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Identify the touching sheet or backing.</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Preserve its position and identity.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Receiving decision</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Keep affected stock on hold.</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Ask the supplier how to retain a sample.</text>
</svg>