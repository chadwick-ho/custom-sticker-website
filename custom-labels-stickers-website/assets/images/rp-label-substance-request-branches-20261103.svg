<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PURCHASING EVIDENCE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">What requirement are you trying to meet?</text><rect x="30" y="195" width="640" height="210" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="53" y="243" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">EU REACH article information</text><text x="53" y="301" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Identify the applicable duty and list.</text><text x="53" y="355" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Keep product and reference date clear.</text><rect x="30" y="465" width="640" height="210" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="53" y="513" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">RoHS equipment context</text><text x="53" y="571" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Identify the electrical product use.</text><text x="53" y="625" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Do not infer from printing equipment.</text><rect x="30" y="735" width="640" height="210" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="53" y="783" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Customer purchasing specification</text><text x="53" y="841" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Obtain the actual restricted list.</text><text x="53" y="895" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">State criteria and evidence requested.</text><text x="35" y="1033" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Applicability belongs to the responsible reviewer.</text></svg>