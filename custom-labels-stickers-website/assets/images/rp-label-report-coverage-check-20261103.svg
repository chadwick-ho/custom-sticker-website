<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PURCHASING EVIDENCE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Does the report cover this construction?</text><rect x="35" y="190" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="233" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Sample identity</text><text x="58" y="276" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Report sample and actual construction</text><text x="58" y="318" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Same film, adhesive, ink and finish?</text><path d="M350 350 L350 381" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="390" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="433" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Requirement identity</text><text x="58" y="476" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Substances / restrictions / reference date</text><text x="58" y="518" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Does it answer the customer request?</text><path d="M350 550 L350 581" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="590" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="633" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Method and limits</text><text x="58" y="676" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Scope, method and reporting limitations</text><text x="58" y="718" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Reviewer confirms the evidence needed.</text><path d="M350 750 L350 781" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="790" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="833" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Order connection</text><text x="58" y="876" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Quote + material revision + evidence</text><text x="58" y="918" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Reopen after a relevant substitution.</text><text x="35" y="1020" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">A laboratory name alone does not establish scope.</text></svg>