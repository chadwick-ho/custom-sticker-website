<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Agree the response to no connection</text><rect x="65" y="205" width="570" height="105" rx="10" fill="#e0eade" stroke="#b8ccc1" stroke-width="2"/><text x="93" y="251" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#173d37">Connection unavailable at the workstation</text><text x="93" y="292" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Actual reader capability must be checked.</text><path d="M350 315 L350 365" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M185 365 L515 365" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M185 365 L185 415" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M515 365 L515 415" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="420" width="300" height="290" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="55" y="467" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173d37">Local capture scope</text><text x="55" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Save decoded identity.</text><text x="55" y="600" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Record the capture event.</text><text x="55" y="665" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Check later if agreed.</text><rect x="365" y="420" width="300" height="290" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="385" y="467" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173d37">Online answer required</text><text x="385" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Required check pending.</text><text x="385" y="600" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Do not mark it passed.</text><text x="385" y="665" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Route to named owner.</text><rect x="35" y="825" width="630" height="160" rx="10" fill="#f4e5cf" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="877" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">Receiving owner defines the disposition.</text><text x="60" y="934" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">A cached result needs a clear time basis.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">No universal hold, release or authenticity rule.</text></svg>