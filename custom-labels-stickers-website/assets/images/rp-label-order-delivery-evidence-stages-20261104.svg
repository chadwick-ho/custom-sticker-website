<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Keep shipment milestones distinct</text><rect x="35" y="195" width="630" height="205" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="243" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Shipment information</text><text x="58" y="301" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">A shipping number exists.</text><text x="58" y="353" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Physical handoff needs its own evidence.</text><path d="M350 405 L350 465" stroke="#ad7542" stroke-width="4"/><rect x="35" y="475" width="630" height="205" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="523" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Carrier possession</text><text x="58" y="581" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Use the carrier event and handoff record.</text><text x="58" y="633" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Match the covered cartons.</text><path d="M350 685 L350 745" stroke="#ad7542" stroke-width="4"/><rect x="35" y="755" width="630" height="205" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="58" y="803" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Warehouse receipt</text><text x="58" y="861" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Check package identity and condition.</text><text x="58" y="913" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Contents still need the agreed review.</text><text x="35" y="1020" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Event dates and estimates are different records.</text></svg>