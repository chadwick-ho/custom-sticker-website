<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Two accepted routes for a named edit</text><rect x="65" y="205" width="570" height="110" rx="10" fill="#e0eade" stroke="#b8ccc1" stroke-width="2"/><text x="92" y="252" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">Identify the actual requested operation.</text><text x="92" y="293" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Do not infer it from “send source.”</text><path d="M350 320 L350 365" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M185 365 L515 365" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M185 365 L185 420" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M515 365 L515 420" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="425" width="300" height="265" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="59" y="475" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Designer route</text><text x="59" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Controlled master edit</text><text x="59" y="594" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">New accepted export</text><text x="59" y="653" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Revision recorded</text><path d="M185 695 L185 760" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="365" y="425" width="300" height="265" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="389" y="475" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Converter route</text><text x="389" y="535" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Agreed job-copy edit</text><text x="389" y="594" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Required assets only</text><text x="389" y="653" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Revision recorded</text><path d="M515 695 L515 760" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M185 760 L515 760" fill="none" stroke="#ad7542" stroke-width="4"/><path d="M350 760 L350 815" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="65" y="820" width="570" height="150" rx="10" fill="#e0eade" stroke="#b8ccc1" stroke-width="2"/><text x="92" y="870" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Return a new proof for review.</text><text x="92" y="927" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Working-file transfer is not approval.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">No edit or production release is shown as done.</text></svg>