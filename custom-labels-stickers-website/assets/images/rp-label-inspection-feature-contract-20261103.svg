<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1120" viewBox="0 0 700 1120" role="img"><rect width="700" height="1120" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="31" fill="white" font-weight="bold">One fault, one agreed inspection scope</text><rect x="35" y="190" width="630" height="140" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="236" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">1. Fault to find</text><text x="58" y="290" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Wrong artwork version inside an A roll</text><path d="M350 335 L350 367" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="375" width="630" height="140" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="421" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">2. Detection method</text><text x="58" y="475" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Use identified references and capability</text><path d="M350 520 L350 552" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="560" width="630" height="140" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="606" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">3. Coverage and exceptions</text><text x="58" y="660" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Record the observed run and any gaps</text><path d="M350 705 L350 737" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M350 737 L350 778" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M185 778 L515 778" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M185 778 L185 815" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M515 778 L515 815" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="30" y="815" width="310" height="170" rx="12" fill="#e2ebdd" stroke="#bfd2c4" stroke-width="2"/><text x="53" y="862" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="bold">Within agreed scope</text><text x="53" y="908" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Named owner makes</text><text x="53" y="949" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">the release decision.</text><rect x="360" y="815" width="310" height="170" rx="12" fill="#f5e5cd" stroke="#bfd2c4" stroke-width="2"/><text x="383" y="862" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="bold">Fault or coverage gap</text><text x="383" y="908" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Hold affected stock;</text><text x="383" y="949" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">resolve the exception.</text><text x="35" y="1075" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">An inspection label is not a detection guarantee.</text></svg>