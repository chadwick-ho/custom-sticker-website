<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Label receipt handoff</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Keep each quantity and its basis separate.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Ordered quantity</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record SKU, revision and approved order.</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Include the unit and approved changes.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Received rolls</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record carton and roll identifiers.</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Note partial rolls and visible damage.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Quantity basis</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Separate stated and physically counted.</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the method and unknown values.</text>
<rect x="25" y="945" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="992" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">4. Release decision</text>
<text x="45" y="1031" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Identify accepted, held or rejected</text>
<text x="45" y="1062" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">stock.</text>
<text x="45" y="1093" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Assign the discrepancy and next action.</text>
</svg>