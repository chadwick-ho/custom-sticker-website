<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940"><rect width="700" height="940" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/><text x="30" y="49" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700">RP LABELS · BUYER GUIDE</text><text x="30" y="103" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="700">Confirm the delivery scope</text><rect x="35" y="195" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="243" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="700">Where?</text><text x="58" y="295" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Name the full destination.</text><text x="58" y="336" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Include receiving restrictions.</text><rect x="35" y="420" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="468" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="700">Who clears import?</text><text x="58" y="520" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Identify the responsible party.</text><text x="58" y="561" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Confirm how the task will be performed.</text><rect x="35" y="645" width="630" height="195" rx="14" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="693" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="700">Who pays?</text><text x="58" y="745" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Clarify duties, taxes and exclusions.</text><text x="58" y="786" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Retain the actual written quotation.</text><text x="35" y="917" font-family="Arial,sans-serif" font-si