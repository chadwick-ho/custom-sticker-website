<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Curing does not specify an extra coat</text><text x="35" y="203" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#173d37">UV-cured image</text><rect x="60" y="270" width="580" height="105" rx="0" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><rect x="100" y="245" width="160" height="25" rx="0" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="320" y="245" width="240" height="25" rx="0" fill="#bd8b56" stroke="#b8ccc1" stroke-width="2"/><text x="85" y="334" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Identified label stock</text><text x="35" y="431" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">The printed image uses the specified ink.</text><text x="35" y="479" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">No selected coating follows from that name.</text><text x="35" y="592" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#173d37">Image + a selective coating</text><rect x="60" y="700" width="580" height="105" rx="0" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><rect x="100" y="675" width="160" height="25" rx="0" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="320" y="675" width="240" height="25" rx="0" fill="#bd8b56" stroke="#b8ccc1" stroke-width="2"/><rect x="100" y="643" width="160" height="31" rx="0" fill="#8fb2a8" stroke="#b8ccc1" stroke-width="2"/><text x="85" y="764" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Identified label stock</text><text x="35" y="870" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">A separate artwork map selects the coating.</text><text x="35" y="922" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Relief and reflection still need a sample.</text><text x="35" y="1035" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Conceptual thicknesses; no process is qualified.</text></svg>