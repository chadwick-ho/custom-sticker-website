<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Name the owners between operations</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">A responsibility map, not a service bundle</text><rect x="35" y="240" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="281" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Containers</text><text x="60" y="324" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Exact reference and delivered condition</text><text x="60" y="362" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Owner: buyer or confirmed provider</text><path d="M350 388 L350 420" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="425" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="466" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Printed labels / direct decoration</text><text x="60" y="509" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Artwork + material or decorated-bottle scope</text><text x="60" y="547" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Owner: confirmed manufacturing provider</text><path d="M350 573 L350 605" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="610" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="651" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Application, if the route needs it</text><text x="60" y="694" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Accepted stock, equipment and sample</text><text x="60" y="732" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Owner: actual application provider</text><path d="M350 758 L350 790" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="795" width="630" height="145" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="836" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Filling, closure and final receiving</text><text x="60" y="879" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Agreed completed item and destination</text><text x="60" y="917" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Owner: actual packer and receiver</text><text x="35" y="1038" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">A label shipment does not book the other work.</text></svg>