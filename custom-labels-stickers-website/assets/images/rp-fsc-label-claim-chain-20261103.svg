<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PURCHASING EVIDENCE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Connect the paper claim to the purchase</text><rect x="35" y="190" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="233" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Specify the product</text><text x="58" y="276" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Which paper product is requested?</text><text x="58" y="318" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Face, liner and carton are distinct.</text><path d="M350 348 L350 381" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="390" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="433" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Check supplier scope</text><text x="58" y="476" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Current certificate + product category</text><text x="58" y="518" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Resolve the actual supply arrangement.</text><path d="M350 548 L350 581" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="590" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="633" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Confirm the offered claim</text><text x="58" y="676" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Keep claim and quote line connected.</text><text x="58" y="718" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Do not infer from a mill certificate.</text><path d="M350 748 L350 781" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="790" width="630" height="155" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="833" font-family="Arial,sans-serif" font-size="31" fill="#163e36" font-weight="bold">Check the sales record</text><text x="58" y="876" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Product claim + supplier certificate code</text><text x="58" y="918" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Retain with accepted specification.</text><text x="35" y="1018" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">This diagram asserts no RP certification.</text></svg>