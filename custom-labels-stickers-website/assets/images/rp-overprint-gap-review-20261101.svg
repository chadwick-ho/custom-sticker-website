<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="title desc">
<title id="title">Missing print: first checks</title><desc id="desc">Illustrative preprinted label and sample overprinted lot field with an intentionally missing vertical band.</desc>
<rect width="700" height="940" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="103" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Missing print: first checks</text>
<text x="30" y="185" font-family="Arial,sans-serif" font-size="25" fill="#27443e">Protect the sample and identify the missing field.</text>
<rect x="95" y="230" width="510" height="300" rx="20" fill="white" stroke="#45695f" stroke-width="4"/><rect x="125" y="258" width="450" height="68" rx="8" fill="#dce9df"/><text x="150" y="303" fill="#123934" font-family="Arial,sans-serif" font-size="28" font-weight="bold">DEMO · PREPRINTED LABEL</text>
<text x="145" y="365" fill="#45695f" font-family="Arial,sans-serif" font-size="23">Later printed field · example only</text><rect x="135" y="382" width="430" height="93" rx="7" fill="#f7faf8" stroke="#92ab9d" stroke-width="3"/><text x="155" y="442" fill="#123934" font-family="monospace" font-size="43" font-weight="bold">LOT 8A47</text><rect x="321" y="392" width="18" height="70" fill="#f7faf8"/><path d="M330 490 L330 523" stroke="#c87331" stroke-width="5"/><text x="360" y="522" fill="#a34d1b" font-family="Arial,sans-serif" font-size="23" font-weight="bold">Missing band</text>
<rect x="30" y="568" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="608" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">1 · Hold the affected labels</text><text x="50" y="646" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Keep the sample and data reference.</text>
<rect x="30" y="682" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="722" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">2 · Record the print pattern</text><text x="50" y="760" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Do not infer a cause from appearance.</text>
<rect x="30" y="796" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="836" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">3 · Assign the review</text><text x="50" y="874" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Operator and quality owner agree next steps.</text>
</svg>
