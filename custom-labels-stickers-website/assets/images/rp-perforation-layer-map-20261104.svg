<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Which layer should tear?</text><text x="35" y="205" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Between-label carrier separation</text><rect x="40" y="250" width="620" height="180" rx="0" fill="#dce6e5" stroke="#bed2c3" stroke-width="2"/><rect x="60" y="275" width="260" height="130" rx="12" fill="#326951" stroke="#bed2c3" stroke-width="2"/><rect x="380" y="275" width="260" height="130" rx="12" fill="#326951" stroke="#bed2c3" stroke-width="2"/><text x="119" y="351" font-family="Arial,sans-serif" font-size="29" fill="white" font-weight="bold">LABEL A</text><text x="440" y="351" font-family="Arial,sans-serif" font-size="29" fill="white" font-weight="bold">LABEL B</text><path d="M350 230 L350 450" stroke="#ad7542" stroke-width="4" stroke-dasharray="9 8"/><text x="35" y="495" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Tear line in gap; face labels stay intact.</text><text x="35" y="605" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Perforation through a face label</text><rect x="40" y="650" width="620" height="180" rx="0" fill="#dce6e5" stroke="#bed2c3" stroke-width="2"/><rect x="100" y="675" width="500" height="130" rx="12" fill="#326951" stroke="#bed2c3" stroke-width="2"/><path d="M350 660 L350 820" stroke="#ad7542" stroke-width="4" stroke-dasharray="9 8"/><text x="131" y="751" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">SEAL</text><text x="402" y="751" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">FACE</text><text x="35" y="893" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Different purpose: opening or separation</text><text x="35" y="937" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">within the label itself.</text><text x="35" y="1020" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Schematic only; no cut pattern prescribed.</text></svg>