<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180"><rect width="700" height="1180" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/><text x="30" y="49" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="700">RP LABELS · BUYER GUIDE</text><text x="30" y="103" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="700">Two import-responsibility routes</text><text x="35" y="195" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Same named destination · confirm the contract</text><rect x="35" y="240" width="630" height="280" rx="15" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="293" font-family="Arial,sans-serif" font-size="30" fill="#193f38" font-weight="700">DAP · Incoterms® 2020</text><text x="58" y="350" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="400">Seller arranges carriage to the</text><text x="58" y="391" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="400">agreed destination. Buyer handles</text><text x="58" y="432" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="400">import clearance and import costs.</text><rect x="35" y="570" width="630" height="280" rx="15" fill="white" stroke="#c8dcd0" stroke-width="2"/><text x="58" y="623" font-family="Arial,sans-serif" font-size="30" fill="#193f38" font-weight="700">DDP · Incoterms® 2020</text><text x="58" y="680" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="400">Seller handles import clearance</text><text x="58" y="721" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="400">and applicable import duties/taxes.</text><text x="58" y="762" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="400">Confirm this can be performed.</text><text x="35" y="925" font-family="Arial,sans-serif" font-size="27" fill="#193f38" font-weight="700">Both: delivery normally before unloading.</text><text x="35" y="977" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Use the full rule and actual agreed terms.</text><text x="35" y="1025" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="400">Local import requirements need confirmation.</text><text x="35" y="1090" font-family="Arial,sans-serif" font-size="24" fill="#193f38" font-weight="400">This comparison does not promise that RP</text><text x="35" y="1128" font-family="Arial,sans-serif" font-size="24" fill="#193f38" font-weight="400">offers every route to every destination.</text></svg>