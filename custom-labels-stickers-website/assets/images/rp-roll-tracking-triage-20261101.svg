<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Where did the movement begin?</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Separate the observed symptom from the</text>
<text x="30" y="212" fill="#344c49" font-size="25" font-family="Arial,sans-serif">cause.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Before loading</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Roll layers already displaced or edge</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">damaged?</text>
<text x="45" y="373" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Hold the roll; photograph and ask the</text>
<text x="45" y="404" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">converter.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Through the machine</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Roll looks even but the liner moves</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">sideways?</text>
<text x="45" y="613" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the path and compare a suitable</text>
<text x="45" y="644" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">second roll.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. At the container</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Web stays aligned but the label lands</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">crooked?</text>
<text x="45" y="853" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Review container handling and</text>
<text x="45" y="884" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">application setup.</text>
</svg>