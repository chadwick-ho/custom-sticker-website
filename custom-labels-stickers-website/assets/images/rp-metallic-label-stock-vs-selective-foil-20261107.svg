<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Broad base or local metallic accent?</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Construction proposals · not to scale</text><text x="35" y="280" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">A · Metallic face beneath the design</text><rect x="70" y="325" width="560" height="80" rx="0" fill="#b2b8ad" stroke="#92afa2" stroke-width="2"/><rect x="300" y="325" width="280" height="25" rx="0" fill="white" stroke="#92afa2" stroke-width="2"/><text x="70" y="455" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">Broad reflective base</text><text x="70" y="505" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Selected print / white areas above it</text><text x="35" y="640" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">B · Local transfer on another face</text><rect x="70" y="710" width="560" height="80" rx="0" fill="white" stroke="#92afa2" stroke-width="2"/><rect x="105" y="680" width="150" height="30" rx="0" fill="#b88947" stroke="#92afa2" stroke-width="2"/><text x="70" y="840" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">Localized metallic feature</text><text x="70" y="890" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">The remaining face is not that feature.</text><text x="35" y="1015" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Adhesive, liner and protection remain specified.</text><text x="35" y="1055" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">These drawings do not reproduce metallic sheen.</text></svg>