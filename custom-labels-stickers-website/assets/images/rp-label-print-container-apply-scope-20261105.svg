<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Three different supplied outputs</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">A piece count needs a physical item name.</text><rect x="45" y="280" width="190" height="140" rx="0" fill="#d6e1e1" stroke="#b8ccc1" stroke-width="2"/><rect x="58" y="295" width="45" height="106" rx="2" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="117" y="295" width="45" height="106" rx="2" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="176" y="295" width="45" height="106" rx="2" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><text x="280" y="281" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Printed labels</text><text x="280" y="338" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Supplied on a carrier</text><text x="280" y="388" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">No bottle shown</text><path d="M35 470 L665 470" fill="none" stroke="#b8ccc1" stroke-width="4"/><rect x="75" y="530" width="135" height="180" rx="25" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><rect x="102" y="503" width="81" height="40" rx="4" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><rect x="82" y="596" width="121" height="63" rx="3" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="96" y="635" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#173d37">LABEL</text><rect x="75" y="800" width="135" height="180" rx="25" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><rect x="102" y="773" width="81" height="40" rx="4" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><text x="115" y="905" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#173d37">INK</text><text x="280" y="550" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">Applied labels</text><text x="280" y="607" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">A separate printed label</text><text x="280" y="654" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">is attached to the bottle.</text><path d="M35 750 L665 750" fill="none" stroke="#b8ccc1" stroke-width="4"/><text x="280" y="827" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">Direct decoration</text><text x="280" y="884" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Graphics on the container</text><text x="280" y="931" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">No separate label face</text><text x="35" y="1035" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">No RP bottle/application service is represented.</text></svg>