<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PRACTICAL BUYING GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Carrier length and labels are different</text><rect x="35" y="190" width="630" height="200" rx="12" fill="#dfe9dc" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="238" font-family="Arial,sans-serif" font-size="32" fill="#163e36" font-weight="bold">Blank carrier</text><text x="58" y="294" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Record length from actual machine needs.</text><text x="58" y="348" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="bold">It contributes no printed labels.</text><rect x="35" y="445" width="630" height="145" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="490" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="bold">Accepted applied output</text><text x="540" y="494" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">1,000</text><text x="58" y="549" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Fictional buyer requirement</text><rect x="35" y="635" width="630" height="145" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="680" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="bold">Setup / checking use</text><text x="540" y="684" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">20</text><text x="58" y="739" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Fictional process allowance</text><path d="M350 788 L350 835" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="35" y="850" width="630" height="130" rx="12" fill="#dfe9dc" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="897" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Planning pool: 1,000 + 20 = 1,020</text><text x="58" y="945" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Confirm actual delivered-count commitment.</text><text x="35" y="1030" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Not a standard allowance or guaranteed yield.</text></svg>