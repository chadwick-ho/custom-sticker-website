<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img"><rect width="700" height="940" fill="#f2f6f3"/><rect width="700" height="145" fill="#123934"/><text x="30" y="49" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="105" font-family="Arial,sans-serif" font-size="31" fill="white" font-weight="bold">What does the total include?</text><rect x="40" y="195" width="620" height="138" rx="15" fill="white" stroke="#c9dcd0" stroke-width="2"/><text x="64" y="241" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="bold">1. Printing</text><text x="64" y="289" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="normal">Same size, designs and construction</text><path d="M350 340 v18 m-8 -8 h16" stroke="#9c6a2b" stroke-width="4"/><rect x="40" y="365" width="620" height="138" rx="15" fill="white" stroke="#c9dcd0" stroke-width="2"/><text x="64" y="411" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="bold">2. Preparation</text><text x="64" y="459" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="normal">Die, plate or data work if quoted</text><path d="M350 510 v18 m-8 -8 h16" stroke="#9c6a2b" stroke-width="4"/><rect x="40" y="535" width="620" height="138" rx="15" fill="white" stroke="#c9dcd0" stroke-width="2"/><text x="64" y="581" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="bold">3. Delivery preparation</text><text x="64" y="629" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="normal">Required roll format and packing</text><path d="M350 680 v18 m-8 -8 h16" stroke="#9c6a2b" stroke-width="4"/><rect x="40" y="705" width="620" height="138" rx="15" fill="white" stroke="#c9dcd0" stroke-width="2"/><text x="64" y="751" font-family="Arial,sans-serif" font-size="31" fill="#193f38" font-weight="bold">4. Transport scope</text><text x="64" y="799" font-family="Arial,sans-serif" font-size="26" fill="#193f38" font-weight="normal">Same address; confirm exclusions</text><text x="40" y="915" font-family="Arial,sans-serif" font-size="25" fill="#193f38" font-weight="normal">Unquoted cost = open question, not zero.</text></svg>