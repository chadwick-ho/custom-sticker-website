<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Color comparison handoff</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Document the parts and acceptance condition.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Identify the reference</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Name the master and artwork revision.</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record the owner and reference</text>
<text x="45" y="373" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">condition.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Record both constructions</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Identify label, carton and container.</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record print, finish and sample</text>
<text x="45" y="613" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">identity.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Agree the viewing setup</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record illumination and viewing angle.</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Identify the controlling approval</text>
<text x="45" y="853" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">condition.</text>
<rect x="25" y="945" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="992" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">4. Assign the decision</text>
<text x="45" y="1031" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Agree the acceptable difference for the</text>
<text x="45" y="1062" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">job.</text>
<text x="45" y="1093" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Keep evidence and responsible reviewer.</text>
</svg>