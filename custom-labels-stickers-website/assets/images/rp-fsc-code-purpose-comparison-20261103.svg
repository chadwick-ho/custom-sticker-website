<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1060" viewBox="0 0 700 1060" role="img"><rect width="700" height="1060" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PURCHASING EVIDENCE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Verification and artwork are separate</text><rect x="30" y="205" width="305" height="410" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="52" y="255" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">Supplier record</text><text x="52" y="323" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Certificate code</text><text x="52" y="398" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Organization + scope</text><text x="52" y="473" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Current status</text><text x="52" y="548" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Sales-document claim</text><path d="M182 620 L182 710" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="365" y="205" width="305" height="410" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="387" y="255" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">On-product artwork</text><text x="387" y="323" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Authorized label</text><text x="387" y="398" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Trademark licence</text><text x="387" y="473" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Approval route</text><text x="387" y="548" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Correct artwork revision</text><path d="M517 620 L517 710" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M182 710 L517 710" stroke="#ad7542" stroke-width="4" fill="none"/><path d="M350 710 L350 770" stroke="#ad7542" stroke-width="4" fill="none"/><rect x="60" y="770" width="580" height="165" rx="12" fill="#e0ebdc" stroke="#bfd2c4" stroke-width="2"/><text x="85" y="820" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Resolve both before making the claim.</text><text x="85" y="868" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Do not copy marks from another pack.</text><text x="85" y="910" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Use the authorized supplier route.</text><text x="35" y="1018" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Generic text; no certification mark reproduced.</text></svg>