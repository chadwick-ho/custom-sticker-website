<svg xmlns="http://www.w3.org/2000/svg" width="700" height="940" viewBox="0 0 700 940" role="img" aria-labelledby="t d">
<title id="t">What does the QR reveal?</title><desc id="d">Illustration showing separate review of a printed code, a website and a responsible owner.</desc>
<rect width="700" height="940" fill="#f3f7f5"/><rect width="700" height="145" fill="#123934"/><text x="30" y="50" fill="white" font-family="Arial,sans-serif" font-size="25" font-weight="bold">RP LABELS · BUYER GUIDE</text><text x="30" y="103" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="bold">What does the QR reveal?</text>
<text x="30" y="185" font-family="Arial,sans-serif" font-size="25" fill="#27443e">Check the symbol and destination separately.</text>
<rect x="45" y="235" width="260" height="210" rx="12" fill="#fff" stroke="#45695f" stroke-width="4"/><text x="65" y="275" fill="#123934" font-family="Arial,sans-serif" font-size="25" font-weight="bold">PRINTED SYMBOL</text><rect x="104" y="295" width="135" height="112" fill="#e5f1de" stroke="#45695f" stroke-width="3"/><text x="135" y="344" fill="#123934" font-family="Arial,sans-serif" font-size="25" font-weight="bold">CODE</text><text x="122" y="380" fill="#526763" font-family="Arial,sans-serif" font-size="20">placeholder</text>
<path d="M320 340 H375 M362 327 L375 340 L362 353" fill="none" stroke="#c87331" stroke-width="6"/><rect x="395" y="235" width="260" height="210" rx="12" fill="#fff" stroke="#45695f" stroke-width="4"/><text x="415" y="275" fill="#123934" font-family="Arial,sans-serif" font-size="25" font-weight="bold">DESTINATION</text><rect x="420" y="295" width="210" height="112" fill="#e7f1f2" stroke="#87aeb1" stroke-width="3"/><path d="M440 325 H605 M440 347 H580 M440 369 H590" stroke="#87aeb1" stroke-width="6"/>
<rect x="30" y="505" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="545" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">1 · Approve the code data</text><text x="50" y="583" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Decode a non-sensitive test symbol.</text>
<rect x="30" y="619" width="640" height="105" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="659" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">2 · Review the public page</text><text x="50" y="697" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Check what it displays and requests.</text>
<rect x="30" y="733" width="640" height="135" rx="12" fill="white" stroke="#d5e3df" stroke-width="2"/><text x="50" y="773" font-family="Arial,sans-serif" font-size="28" fill="#123934" font-weight="bold">3 · Name the owners</text><text x="50" y="811" font-family="Arial,sans-serif" font-size="25" fill="#354f4a">Assign the data, print and website review.</text><text x="50" y="845" font-family="Arial,sans-serif" font-size="23" fill="#526763">Diagram only; not a security test.</text>
</svg>
