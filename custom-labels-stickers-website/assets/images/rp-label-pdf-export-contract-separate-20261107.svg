<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Agree the export before the handoff</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Planning workflow · no preflight result</text><rect x="55" y="255" width="590" height="180" rx="8" fill="white" stroke="#92afa2" stroke-width="2"/><text x="85" y="305" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">ARTWORK SOURCE R3</text><text x="85" y="360" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="#173d37">Keep the editable master.</text><text x="85" y="406" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Identify the intended production layers.</text><path d="M350 435L350 495" fill="none" stroke="#8b6034" stroke-width="3"/><rect x="55" y="495" width="590" height="190" rx="8" fill="#e5ebdf" stroke="#92afa2" stroke-width="2"/><text x="85" y="545" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">CONVERTER REQUIREMENT</text><text x="85" y="600" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Standard + version + output condition</text><text x="85" y="652" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Agree special layers and transparency.</text><path d="M350 685L350 745" fill="none" stroke="#8b6034" stroke-width="3"/><rect x="55" y="745" width="590" height="165" rx="8" fill="white" stroke="#92afa2" stroke-width="2"/><text x="85" y="795" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">EXPORTED PDF R3-E1</text><text x="85" y="850" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Review this file and its returned proof.</text><text x="35" y="1015" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">A preset name does not approve the label.</text><text x="35" y="1055" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#173d37">Return any changed file for the agreed review.</text></svg>