<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Define exactly which region is coated</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Fictional job · not a production separation</text><rect x="45" y="250" width="610" height="525" rx="3" fill="#dce8d5" stroke="#b8ccc1" stroke-width="2"/><rect x="70" y="280" width="560" height="170" rx="4" fill="#326951" stroke="#b8ccc1" stroke-width="2"/><path d="M95 292 L130 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M130 292 L165 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M165 292 L200 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M200 292 L235 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M235 292 L270 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M270 292 L305 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M305 292 L340 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M340 292 L375 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M375 292 L410 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M410 292 L445 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M445 292 L480 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M480 292 L515 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M515 292 L550 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M550 292 L585 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><path d="M585 292 L620 435" fill="none" stroke="#a3c8b2" stroke-width="4"/><text x="220" y="344" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="white">BRAND A</text><text x="159" y="402" font-family="Arial,sans-serif" font-size="28" font-weight="normal" fill="white">Proposed selected coating</text><rect x="70" y="485" width="245" height="235" rx="3" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="108" y="550" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">CODE B</text><text x="97" y="611" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Own contrast</text><text x="97" y="653" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">and scan review</text><rect x="345" y="485" width="285" height="235" rx="3" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="383" y="550" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173d37">LATER PRINT C</text><text x="373" y="611" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Own surface</text><text x="373" y="653" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">and output review</text><text x="35" y="867" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#173d37">This example selects A, not B or C.</text><text x="35" y="925" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Confirm actual coating limits with the quote.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Not a universal rule to leave every code bare.</text></svg>