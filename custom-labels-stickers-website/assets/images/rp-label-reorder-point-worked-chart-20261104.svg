<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="24" fill="white" font-weight="bold">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">A trigger starts a review, not an order</text><text x="35" y="202" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">Fictional steady use: 200 labels per day</text><text x="35" y="246" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Example replenishment: 12 calendar days</text><text x="35" y="289" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Chosen example buffer: 800 labels</text><path d="M105 355 L105 760" stroke="#6c8581" stroke-width="4" fill="none"/><path d="M105 760 L650 760" stroke="#6c8581" stroke-width="4" fill="none"/><path d="M105 410 L640 410" stroke="#b38347" stroke-width="4" fill="none" stroke-dasharray="9 8"/><path d="M105 675 L640 675" stroke="#b38347" stroke-width="4" fill="none" stroke-dasharray="9 8"/><text x="110" y="388" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="bold">3,200 review trigger</text><text x="250" y="718" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="bold">800 buffer remains</text><path d="M135 410 L610 675" stroke="#326951" stroke-width="8" fill="none"/><text x="110" y="805" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Day 0</text><text x="505" y="805" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Day 12</text><text x="209" y="546" font-family="Arial,sans-serif" font-size="28" fill="#163e36" font-weight="bold">2,400 labels</text><text x="240" y="585" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">consumed</text><rect x="35" y="866" width="630" height="118" rx="12" fill="white" stroke="#bed2c3" stroke-width="2"/><text x="60" y="911" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">200 × 12 + 800 = 3,200 labels</text><text x="60" y="953" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">Order size is a separate purchasing decision.</text><text x="35" y="1030" font-family="Arial,sans-serif" font-size="25" fill="#163e36" font-weight="normal">No RP turnaround or stock guarantee implied.</text></svg>