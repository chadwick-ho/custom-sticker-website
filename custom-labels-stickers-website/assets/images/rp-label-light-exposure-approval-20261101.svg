<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">Light-exposure approval</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Agree the sample and acceptance decision.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Define the exposure</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Record display, duration and light</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">source.</text>
<text x="45" y="373" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Mark unknown conditions for follow-up.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Identify the construction</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Material, ink, finish and artwork</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">revision.</text>
<text x="45" y="613" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Keep critical color and code areas</text>
<text x="45" y="644" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">identified.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Agree the comparison</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Identify the exposed and control</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">samples.</text>
<text x="45" y="853" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Document the conditions and</text>
<text x="45" y="884" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">observations.</text>
<rect x="25" y="945" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="992" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">4. Record the decision</text>
<text x="45" y="1031" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Define appearance and readability</text>
<text x="45" y="1062" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">limits.</text>
<text x="45" y="1093" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Assign a reviewer and next action.</text>
</svg>