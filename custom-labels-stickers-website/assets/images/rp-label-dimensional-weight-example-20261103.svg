<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1120" viewBox="0 0 700 1120" role="img"><rect width="700" height="1120" fill="#f3f6ef"/><rect width="700" height="145" fill="#123934"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" fill="white" font-weight="bold">RP LABELS · PRACTICAL BUYING GUIDE</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="30" fill="white" font-weight="bold">Compare each carton before adding</text><text x="35" y="190" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Fictional cm / kg example · divisor 5,000</text><rect x="35" y="220" width="630" height="290" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="268" font-family="Arial,sans-serif" font-size="33" fill="#163e36" font-weight="bold">Carton A</text><text x="58" y="327" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="normal">40 × 30 × 50 ÷ 5,000 = 12 kg</text><text x="58" y="388" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="normal">Actual weight: 8 kg</text><text x="58" y="458" font-family="Arial,sans-serif" font-size="32" fill="#163e36" font-weight="bold">Greater basis: 12 kg</text><rect x="35" y="565" width="630" height="290" rx="12" fill="white" stroke="#bfd2c4" stroke-width="2"/><text x="58" y="613" font-family="Arial,sans-serif" font-size="33" fill="#163e36" font-weight="bold">Carton B</text><text x="58" y="672" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="normal">30 × 20 × 20 ÷ 5,000 = 2.4 kg</text><text x="58" y="733" font-family="Arial,sans-serif" font-size="29" fill="#163e36" font-weight="normal">Actual weight: 6 kg</text><text x="58" y="803" font-family="Arial,sans-serif" font-size="32" fill="#163e36" font-weight="bold">Greater basis: 6 kg</text><text x="35" y="946" font-family="Arial,sans-serif" font-size="30" fill="#163e36" font-weight="bold">12 + 6 = 18 kg before service rounding</text><text x="35" y="1002" font-family="Arial,sans-serif" font-size="27" fill="#163e36" font-weight="normal">Not the sum of actual weights: 14 kg.</text><text x="35" y="1055" font-family="Arial,sans-serif" font-size="26" fill="#163e36" font-weight="normal">Confirm carrier rules; no freight price shown.</text></svg>