<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#367864"/></marker><linearGradient id="fade"><stop stop-color="#397b66"/><stop offset="1" stop-color="#fff"/></linearGradient><linearGradient id="tint"><stop stop-color="#397b66"/><stop offset="1" stop-color="#d5e4dd"/></linearGradient><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 12L12 0M10 14L14 10" stroke="#8b714b" stroke-width="2"/></pattern></defs><rect x="0" y="0" width="700" height="920" fill="#f4f7f1" stroke="none" stroke-width="2" rx="0"/><rect x="0" y="0" width="700" height="144" fill="#103931" stroke="none" stroke-width="2" rx="0"/><text x="32" y="47" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="white">RP LABELS  ·  BUYER DECISIONS</text><text x="32" y="105" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="white">Name the remaining balance</text><text x="32" y="199" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#173833">Fictional order: 8,000 labels committed</text><text x="32" y="261" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173833">Whole order printed</text><rect x="32" y="290" width="239" height="104" fill="#e1eee5" stroke="#a8bdb4" stroke-width="2" rx="3"/><rect x="271" y="290" width="397" height="104" fill="#e4b66d" stroke="#a8bdb4" stroke-width="2" rx="3"/><text x="48" y="352" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173833">3,000 shipped</text><text x="310" y="352" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#173833">5,000 finished</text><text x="36" y="440" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#173833">Hold and review the printed revision.</text><text x="32" y="512" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#173833">First run printed</text><rect x="32" y="541" width="239" height="104" fill="#e1eee5" stroke="#a8bdb4" stroke-width="2" rx="3"/><rect x="271" y="541" width="397" height="104" fill="#e4dfed" stroke="#a8bdb4" stroke-width="2" rx="3"/><text x="48" y="603" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#173833">3,000 shipped</text><text x="310" y="603" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#173833">5,000 unprinted</text><text x="36" y="691" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#173833">Ask whether unprinted work can change.</text><rect x="32" y="751" width="636" height="96" fill="#e0eee5" stroke="#a8bdb4" stroke-width="2" rx="7"/><text x="52" y="795" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#173833">The agreement defines what is owed.</text><text x="52" y="828" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#173833">Quantity alone does not settle billing.</text><text x="32" y="900" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#173833">Editorial illustration · no measured result</text></svg>