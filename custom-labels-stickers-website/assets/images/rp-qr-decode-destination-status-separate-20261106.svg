<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Decode, destination and status differ</text><rect x="35" y="220" width="630" height="190" rx="10" fill="#e0eade" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="268" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">1 · Read the encoded data</text><text x="60" y="328" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Actual reader and application output</text><text x="60" y="378" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Record what was decoded.</text><path d="M350 415 L350 455" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="465" width="630" height="190" rx="10" fill="white" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="513" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">2 · Open the destination</text><text x="60" y="573" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Content and routing service</text><text x="60" y="623" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Check the actual destination response.</text><path d="M350 660 L350 700" fill="none" stroke="#ad7542" stroke-width="4"/><rect x="35" y="710" width="630" height="190" rx="10" fill="#f4e5cf" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="758" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#173d37">3 · Obtain required current status</text><text x="60" y="818" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Authorized connected system, if required</text><text x="60" y="868" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">A decoded ID is not the response.</text><text x="35" y="1035" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">No service or authentication result is shown.</text></svg>