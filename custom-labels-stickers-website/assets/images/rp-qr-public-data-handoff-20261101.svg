<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1180" viewBox="0 0 700 1180" role="img">
<rect width="100%" height="100%" fill="#f4f7f7"/>
<rect x="0" y="0" width="700" height="145" fill="#123934"/>
<text x="30" y="50" fill="#ffffff" font-size="25" font-family="Arial,sans-serif" font-weight="bold">RP LABELS · BUYER GUIDE</text>
<text x="30" y="102" fill="#ffffff" font-size="32" font-family="Arial,sans-serif" font-weight="bold">QR data and print handoff</text>
<text x="30" y="180" fill="#344c49" font-size="25" font-family="Arial,sans-serif">Keep code, data file and destination</text>
<text x="30" y="212" fill="#344c49" font-size="25" font-family="Arial,sans-serif">aligned.</text>
<rect x="25" y="225" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="272" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">1. Approve code content</text>
<text x="45" y="311" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Confirm symbology, fields and test data.</text>
<text x="45" y="342" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Avoid private data in public samples.</text>
<rect x="25" y="465" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="512" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">2. Review the public page</text>
<text x="45" y="551" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Open the destination without a staff</text>
<text x="45" y="582" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">login.</text>
<text x="45" y="613" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Check what it reveals and requests.</text>
<rect x="25" y="705" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="752" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">3. Name the file owners</text>
<text x="45" y="791" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Identify generator, approver and</text>
<text x="45" y="822" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">printer.</text>
<text x="45" y="853" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Agree how data and unused codes are</text>
<text x="45" y="884" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">handled.</text>
<rect x="25" y="945" width="650" height="222" rx="14" fill="#ffffff" stroke="#d5e3df" stroke-width="2"/>
<text x="45" y="992" fill="#123934" font-size="30" font-family="Arial,sans-serif" font-weight="bold">4. Approve the release</text>
<text x="45" y="1031" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Separate readability from access checks.</text>
<text x="45" y="1062" fill="#354f4a" font-size="27" font-family="Arial,sans-serif">Hold unexpected information for review.</text>
</svg>