<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1080" viewBox="0 0 700 1080" role="img"><rect width="700" height="1080" fill="#f2f6ef"/><rect width="700" height="145" fill="#123a35"/><text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">RP LABELS · BUYER DECISIONS</text><text x="30" y="107" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="white">Input content and end-of-life differ</text><text x="35" y="200" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Two evidence questions, not a closed loop</text><rect x="35" y="250" width="630" height="225" rx="10" fill="#e0eade" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="298" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#173d37">Recycled-content question</text><text x="60" y="356" font-family="Arial,sans-serif" font-size="27" font-weight="normal" fill="#173d37">Recovered input → identified component</text><text x="60" y="412" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Which proportion and accounting basis?</text><text x="60" y="452" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">What exactly does the evidence name?</text><rect x="35" y="570" width="630" height="260" rx="10" fill="#e3ebeb" stroke="#b8ccc1" stroke-width="2"/><text x="60" y="618" font-family="Arial,sans-serif" font-size="31" font-weight="bold" fill="#173d37">Recyclability question</text><text x="60" y="680" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Finished pack → actual end-of-life route</text><text x="60" y="737" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#173d37">Collection, sorting and processing scope</text><text x="60" y="792" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">Which pack and sales market are covered?</text><text x="35" y="932" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#173d37">An input claim does not prove the route.</text><text x="35" y="1040" font-family="Arial,sans-serif" font-size="25" font-weight="normal" fill="#173d37">No RP material or pack is shown as certified.</text></svg>